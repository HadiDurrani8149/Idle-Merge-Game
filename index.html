function reset(){
  const keepDebug = S ? S.debug : false;
  S = newState();
  S.debug = keepDebug;
  setNest(0, 1, 0);
  S.grid[0] = { kind: 'egg', seg: 0, t: 0 };   // something to tap on frame one
  // No golden egg yet — the first one is scripted a few eggs in, so the
  // tutorial arrow has something real to point at when it appears.
  dirty = { grid: true, nest: true, coll: true, popup: true, rv: true,
            shop: true, inter: true, confirm: true, tasks: true, drop: true };
  applyDebugVisibility();
}

/* ─────────────────────── fit the board to the screen ───────────────────────
 * The board used to be laid out at a fixed tile size and allowed to run off the
 * bottom, with sticky bars and drag-edge-scrolling papering over it. On a phone
 * that is the wrong trade: a merge board you have to scroll is a merge board
 * where you cannot see your own pieces. So the tiles are sized from the space
 * that is actually left, and nothing scrolls except the shop.
 *
 * Solved for one unknown. With nests at 0.9x a board cell:
 *     nestRows*0.9c + gridRows*c + gaps <= budget      ->  c = (budget - gaps)
 *                                                            / (0.9*nestRows + gridRows)
 * then clamped by width so a wide screen doesn't produce absurd tiles.
 */
const NEST_RATIO = 0.9;

function fitToScreen(){
  const app = $('#app');
  if (!app) return;
  const H = app.clientHeight, W = app.clientWidth;
  if (!H || !W) return;

  // gap scales a little with the screen so a small phone isn't mostly padding
  const gap = Math.max(4, Math.min(8, Math.round(W / 58)));
  // READ the padding, never hardcode it. This was `20` and the stylesheet moved to
  // 15px a side (30 total) for the grass margin, so every cell came out ~2.5px too
  // wide, the row overflowed #app's overflow:hidden, and the last tile got clipped
  // to a zero-size box — which surfaced as a null bounding box in the touch tests,
  // about a hundred lines from the cause.
  const cs = getComputedStyle(app);
  const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const inner = W - pad;

  // Nests are the SAME SIZE as a board cell now and there are at most four, so
  // they are always exactly one row, aligned to the grid's left edge.
  const nestRows = 1;
  const cols = BOARD_COLS;                   // fixed, forever — see economy.js
  // Budget for the FINAL board, not the current one. Sizing to the rows you own
  // today means the tiles shrink every time you add a row — on a 360x640 phone
  // they went 78px at 8 cells to 67px at 20, which is the exact "everything gets
  // smaller as a reward for progressing" the fixed 4-column layout exists to
  // avoid. Reserving the full height up front costs some empty space in the first
  // minutes and buys a tile size that never moves.
  const gridRows = boardRowsFor(BOARD_BASE + BOARD_MAX_LEVELS);

  // fixed furniture: hud, debug line, bottom bar, and the gaps between the rows
  // of #app. The hint line is NOT in the sum any more: it is height:0 and reserves
  // no row (see the #log rule), which is also why this is gap * 4 and not 5.
  const h = sel => { const e = $(sel); return e && e.offsetParent !== null ? e.offsetHeight : 0; };
  // ...and their vertical MARGINS, which are as real as their heights: #hud pulls
  // itself up by #app's padding to sit edge to edge, and #nests carries 21px under
  // it so the level chips do not land on the first row of the board. Both used to
  // be absorbed by the spare `gap` this sum was quietly adding; the moment the hint
  // line's gap came out of it the nests' margin started overflowing the column, and
  // the measure-and-shrink loop below paid for it by taking 4px off every tile on a
  // 360x640 — a board that scaled DOWN as it grew, which is the one thing the fixed
  // four-column layout exists to prevent.
  // NOT #shop: its margin-top is `auto`, which is how the bar pins itself to the
  // bottom of the column, and getComputedStyle resolves that to however much slack
  // is left over. Reading it would feed the leftover space back into the sum and
  // collapse the board to the 30px floor.
  const vm = sel => {
    const e = $(sel);
    if (!e || e.offsetParent === null) return 0;
    const cs = getComputedStyle(e);
    return (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
  };
  const fixed = h('#hud') + h('#dbgline') + h('#shop') + h('#dbg') + gap * 4 + 14
              + vm('#hud') + vm('#log') + vm('#nests') + vm('#grid');

  // The stall used to take 19% of the screen height here, floored at 96px so
  // customers stayed legible. It is gone, and every pixel of it goes to the
  // board — which is the throughput ceiling, so this is not just cosmetic.
  const budget = H - fixed;

  const gapsH = gap * (nestRows + gridRows - 1);
  let c = (budget - gapsH) / (nestRows + gridRows);

  // Four columns of cells is the ONLY horizontal constraint now: nests are the
  // same size as cells and there are four of them, so they fit by construction.
  c = Math.min(c,
    (inner - (cols - 1) * gap) / cols,
    132);                                            // and never look silly big
  c = Math.max(30, c);                               // never smaller than a thumb

  const root = app.style;
  root.setProperty('--gap', gap + 'px');
  const put = v => {
    // ONE size for both. A nest that is a different size from a cell reads as a
    // different kind of slot, and they sit in the same 4-wide column rhythm.
    root.setProperty('--cell', Math.floor(v) + 'px');
    root.setProperty('--nest', Math.floor(v) + 'px');
  };
  put(c);
  $('#grid').style.gridTemplateColumns = `repeat(${cols},var(--cell))`;

  // The concrete ends just under the board, measured rather than guessed, so the
  // bottom bar always sits on the GRASS below it and the board never bleeds past
  // the paving. Written after put() so the grid has its final size.
  {
    const g = $('#grid'), a = app.getBoundingClientRect();
    if (g){
      const gb = g.getBoundingClientRect().bottom;
      root.setProperty('--yardBottom', Math.max(74, Math.round(a.bottom - gb - 14)) + 'px');
    }
  }

  // Belt and braces. The arithmetic above assumes it knows the height of every
  // fixed row, and one wrapped hint line or a taller safe-area inset makes it
  // wrong. Rather than trust it, measure — and shrink until it actually fits.
  for (let i = 0; i < 10 && app.scrollHeight > app.clientHeight + 1 && c > 30; i++){
    c -= Math.max(1, c * 0.05);
    put(c);
  }
}

/** Re-fit whenever anything that changes the row count changes. Cheap enough to
 *  call freely; it only writes four custom properties. */
let fitSig = '';
function fitIfNeeded(){
  const sig = [S.nestsOwned, S.upg.board, S.debug, innerWidth, innerHeight].join('|');
  if (sig === fitSig) return;
  fitSig = sig;
  fitToScreen();
}

/** Say why it's quiet. On a phone the commonest cause isn't a bug in the game
 *  at all — it's the hardware mute switch, which Web Audio obeys on iOS. A
 *  player with no feedback assumes the sound is broken. */
/** Say plainly whether progress is being kept. A player whose save is being
 *  silently dropped — file:// with storage disabled, a private window — should be
 *  told, not left to discover it by losing a session. */
function renderSaveState(){
  const el = $('#saveState');
  if (!el || !$('#settings').classList.contains('open')) return;
  const msg = storageState === 'ok'
    ? (S.savedAt
        ? `Saved on this device. Last save ${untilSince(S.savedAt)} ago — it keeps itself up to date.`
        : 'Saved on this device automatically.')
    : 'This browser is not allowing storage, so progress will NOT be kept. ' +
      'Opening the file through a local web server, or in a normal (non-private) window, fixes it.';
  if (el.dataset.msg !== msg){ el.dataset.msg = msg; el.textContent = msg; }
  el.style.color = storageState === 'ok' ? 'var(--ok)' : '#FFD54A';
}

const untilSince = at => {
  const s = Math.max(0, (Date.now() - at) / 1000);
  return s < 60 ? `${Math.round(s)}s` : `${Math.floor(s / 60)}m`;
};

function renderSoundState(){
  const el = $('#sndState');
  if (!el || !$('#settings').classList.contains('open')) return;
  const st = audioState();
  const msg = {
    off:     '',
    waiting: 'Waiting for your first tap — browsers won’t start audio before one.',
    blocked: 'Blocked by the browser. Tap anywhere in the game once.',
    on:      'Playing. Hearing nothing on a phone? Check the side mute switch — ' +
             'iOS silences web audio with it, and raise the volume slider above.',
  }[st] || '';
  if (el.dataset.st !== st){ el.dataset.st = st; el.textContent = msg; }
  el.style.color = st === 'on' ? 'var(--ok)' : '#FFD54A';
}

function applyDebugVisibility(){
  $('#dbg').style.display = S.debug ? '' : 'none';
  $('#dbgToggle').checked = S.debug;
  $('#devgrants')?.classList.toggle('on', S.debug);
}

/** Dev-only currency taps. Behind the same gate as the time controls: a player
 *  never sees these, but testing shop pricing shouldn't require an hour of
 *  grinding first. */
function grant(kind, n){
  if (kind === 'coins'){ S.coins += n; toast(`+${fmt(n)} coins`, 'start'); }
  if (kind === 'gems') { S.gems  += n; toast(`+${fmt(n)} gems`, 'start'); }
  if (kind === 'boost'){
    S.stock.speed += n; S.stock.merge += n;
    toast(`+${n} of each booster`, 'start');
  }
  if (kind === 'tier'){
    // Jumping a tier means the FLOOR moves, so hand over a matching pair to
    // merge rather than silently rewriting maxTier — otherwise the board is
    // left holding birds below the new floor and the state is one no real run
    // could reach.
    const t = Math.min(C.tiersPerArea, S.maxTier + 1);
    const free = [];
    for (let i = 0; i < gridCells() && free.length < 2; i++) if (!S.grid[i]) free.push(i);
    free.forEach(i => { S.grid[i] = { kind: 'chicken', tier: Math.max(1, t - 1) }; });
    if (free.length === 2) tryMerge(free[0], free[1]);
    else { S.maxTier = t; discover(t); }
    // no discovery modal from a dev tap — you'd be dismissing one per click
    S.popup = null; markDirty('popup');
    markDirty('grid');
  }
  markDirty('shop'); markDirty('coll');
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  tick(dt);
  render();
  autosave();
  requestAnimationFrame(loop);
}

function boot(){
  reset();
  // A save is only restored at BOOT. Restoring mid-session would mean two states
  // racing, and there is no situation in this game where that is what anyone wants.
  if (loadGame()){
    // Everything the save deliberately does not carry has to be put back to a
    // known-good value, or the first frame renders against half a state.
    S.popup = null; S.rv = null; S.inter = null; S.confirm = null;
    S.mutPopup = false; S.cratePopupIntro = false;
    S.nestPopup = null; S.cratePopup = null; S.slimePopup = null;
    S.prizePopup = false; S.drop = null; S.paused = false; S.timeScale = 1;
    S.boost = { speed: 0, merge: 0 };
    dirty = { grid: true, nest: true, coll: true, popup: true, rv: true,
              shop: true, inter: true, confirm: true, tasks: true, drop: true };
    fitSig = '';
    toast('Welcome back', 'start');
  }
  buildPanel();
  document.addEventListener('pointerdown', onDown, { passive: false });
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  // cancel is NOT an up: the browser took the gesture away, so put the piece
  // back rather than dropping it wherever the finger happened to be
  document.addEventListener('pointercancel', onCancel);

  $('#buyEgg').onclick     = buyEgg;
  $('#boostSpeed').onclick = () => tryBoost('speed');
  $('#boostMerge').onclick = () => tryBoost('merge');

  $('#gear').onclick     = () => { play('open'); $('#settings').classList.add('open'); };
  $('#nextPill').onclick = () => { play('open'); renderTree(); $('#treeSheet').classList.add('open');
    coach('tree', '\u{1F333}', 'Your collection', 'Bright tiles are unlocked, faded ones are still to find. The coloured dot on a hen tier marks where that breed can appear.', 8000); };
  $('#closeTree').onclick = () => { play('close'); $('#treeSheet').classList.remove('open'); coachClear(); };
  $('#closeSet').onclick = () => { play('close'); $('#settings').classList.remove('open'); coachClear(); };
  $('#sndToggle').onchange = e => {
    setSoundEnabled(e.target.checked);
    if (e.target.checked) play('ui');            // let them hear the level
  };
  $('#sndVol').value = Math.round(getVolume() * 100);
  $('#sndVol').oninput = e => { setVolume(+e.target.value / 100); };
  $('#sndVol').onchange = () => play('coin');    // and again after a drag
  // Browsers will not start audio before a real gesture, so the context waits
  // for the player's first touch anywhere rather than at load.
  installArtSamples();   // any assets/sfx files override the synth cues
  unlockAudioOn(document);

  // a phone rotating, a URL bar collapsing, or a keyboard opening all change
  // the usable height — re-fit rather than letting the board fall off
  // THE PHONE CASE. A mobile browser can suspend or kill a backgrounded tab
  // without ever firing `beforeunload`, so that alone loses the session.
  // `visibilitychange` is the one event iOS reliably delivers, `pagehide` covers
  // the rest, and `beforeunload` is desktop belt-and-braces.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') autosave(true);
  });
  addEventListener('pagehide', () => autosave(true));
  addEventListener('beforeunload', () => autosave(true));

  const refit = () => { fitSig = ''; fitToScreen(); };
  addEventListener('resize', refit);
  addEventListener('orientationchange', () => setTimeout(refit, 120));
  visualViewport?.addEventListener('resize', refit);
  requestAnimationFrame(refit);
  $('#dbgToggle').onchange = e => {
    S.debug = e.target.checked;
    if (!S.debug){
      S.timeScale = 1;
      document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x.dataset.speed === '1'));
    }
    applyDebugVisibility();
  };
  for (const [id, kind, n] of [
    ['#giveC1', 'coins', 1e4], ['#giveC2', 'coins', 1e7], ['#giveC3', 'coins', 1e9],
    ['#giveG1', 'gems', 100],  ['#giveG2', 'gems', 1e4],  ['#giveG3', 'gems', 1e6],
    ['#giveB', 'boost', 20],   ['#giveT', 'tier', 1],
  ]) { const b = $(id); if (b) b.onclick = () => grant(kind, n); }
  { const chk = $('#devAutoMergeChk'); if (chk) chk.onchange = e => { devAutoMerge = e.target.checked; }; }

  $('#resetBtn').onclick = () => {
    reset();
    saveGame();                       // a reset run is the state that should persist
    $('#settings').classList.remove('open');
  };
  // TWO STEP. The first tap arms it and says so; the second wipes. This is the only
  // irreversible control in the game and it lives two taps from the board on a
  // phone — a bare button here is a lost save waiting to happen. It disarms itself
  // after five seconds so it cannot sit primed for a stray thumb.
  {
    const b = $('#wipeBtn');
    let armed = 0;
    const disarm = () => { armed = 0; b.classList.remove('arm'); b.textContent = 'Delete saved data'; };
    if (b) b.onclick = () => {
      if (!armed){
        armed = 1;
        b.classList.add('arm');
        b.textContent = 'Tap again to delete everything';
        play('nope');
        clearTimeout(b._t); b._t = setTimeout(disarm, 5000);
        return;
      }
      clearTimeout(b._t);
      disarm();
      wipeSave();
      reset();
      lastSaveAt = Date.now();        // do not let autosave immediately rewrite it
      play('unlock');
      toast('Saved data deleted', 'end');
      $('#settings').classList.remove('open');
    };
  }
  $('#pause').onclick = () => {
    S.paused = !S.paused;
    $('#pause').textContent = S.paused ? '▶' : '❚❚';
  };
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
    S.timeScale = +b.dataset.speed;
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#upgBtn').onclick    = () => { if (S.maxTier >= C.protoShopUnlockTier) openUpgrades(); };
  $('#closeUpg').onclick  = closeUpgrades;
  $('#upgDim').onclick    = closeUpgrades;
  const openShopGated = () => { if (S.maxTier >= C.protoShopUnlockTier) openShop(); };
  $('#coinPill').onclick  = openShopGated;
  $('#gemPill').onclick   = openShopGated;
  $('#closeShop').onclick = () => { $('#shop2').classList.remove('open'); coachClear(); };
  $('#tune').onclick       = () => $('#panel').classList.add('open');
  $('#closePanel').onclick = () => $('#panel').classList.remove('open');

  requestAnimationFrame(loop);
}

function buildPanel(){
  const host = document.querySelector('#handles');
  host.innerHTML = HANDLES.map(h => {
    if (h.length === 1) return `<div class="sect">${h[0]}</div>`;
    const [key, min, max, step, note] = h;
    return `<div class="h" data-k="${key}">
        <label>${key.replace(/^proto/, '').replace(/([A-Z])/g, ' $1').trim()}
          <b id="v_${key}"></b></label>
        <input type="range" min="${min}" max="${max}" step="${step}" id="s_${key}">
        ${note ? `<i>${note}</i>` : ''}
      </div>`;
  }).join('');

  HANDLES.filter(h => h.length > 1).forEach(([key]) => {
    const s = document.querySelector('#s_' + key);
    s.value = +C[key];
    document.querySelector('#v_' + key).textContent = fmtVal(C[key]);
    s.addEventListener('input', () => {
      C[key] = +s.value;
      document.querySelector('#v_' + key).textContent = fmtVal(C[key]);
      // A nest's LEVEL belongs to the coop slot, never to the hen — always go
      // through setNest so a live tweak cannot quietly wipe a coin purchase.
      if (key === 'maxNests'){
        while (S.nests.length < C.maxNests) S.nests.push({ tier: null, prog: 0, lvl: 0 });
        S.nestsOwned = Math.min(S.nestsOwned, C.maxNests);
        markDirty('nest');
      }
      refreshProjection();
    });
  });

  document.querySelector('#exportBtn').onclick = exportConfig;
  document.querySelector('#importBtn').onclick = importConfig;
  document.querySelector('#defaultsBtn').onclick = () => {
    C = structuredClone(DEFAULT_CONFIG);
    HANDLES.filter(h => h.length > 1).forEach(([k]) => {
      document.querySelector('#s_' + k).value = +C[k];
      document.querySelector('#v_' + k).textContent = fmtVal(C[k]);
    });
    refreshProjection();
  };
  refreshProjection();
}

const fmtVal = v => Number.isInteger(v) ? v : (+v).toFixed(v < 1 ? 3 : 2).replace(/0+$/, '').replace(/\.$/, '');

function refreshProjection(){
  const p = project(C);
  const warn = diagnose(C);
  // Board-lock check. diagnose() owns the verdict now, and the verdict changed:
  // a full board of unmergeable chickens is REACHABLE on the 8-cell starting
  // board (the floor is flat, so the merge window is the whole ladder). What
  // makes it survivable is breakLock() handing over a cell, and that only
  // terminates while the board can grow past the window — so all this adds is
  // the green line for the case where it can. It used to warn off BOARD_BASE
  // alone, which now fires on the shipped config and reads as a bug that isn't.
  {
    const win = C.tiersPerArea - HatchFloor(C, C.tiersPerArea) + 1;
    const maxCells = boardCells(BOARD_BASE, BOARD_MAX_LEVELS);
    window.__lockInfo = maxCells > win
      ? `board grows to ${maxCells} against a window of ${win} — board can never lock for good`
      : null;
  }
  // Kept as a seam. The projection models the special-egg faucet directly now,
  // so it and the build agree; if they drift again, say so rather than show a
  // wrong number.
  if (projectionIsStale(C))
    warn.unshift('PROJECTION IS STALE. The model and the live rules disagree. Treat ' +
                 'the numbers below as indicative only until the rebalance pass.');

  document.querySelector('#proj').innerHTML = `
    <div><span>Tier ${C.tiersPerArea}</span><b>${p.finalDay > 0 ? 'day ' + p.finalDay : 'not in 45d'}</b></div>
    <div><span>Day 30 tier</span><b>${p.tierAt30}</b></div>
    <div><span>Day 30 nests</span><b>${p.nestsAt30}/${C.maxNests}</b></div>
    <div><span>Day 30 coins</span><b>${fmt(p.coinsAt30)}</b></div>
    <div><span>Day 30 gems</span><b>${fmt(p.gemsAt30)}</b></div>`;

  document.querySelector('#warn').innerHTML =
    (warn.length ? warn.map(w => `<div>⚠ ${w}</div>`).join('') : '') +
    (window.__lockInfo && !warn.some(w => w.includes('BOARD CAN LOCK'))
      ? `<div class="okinfo">✓ ${window.__lockInfo}</div>` : '');

  // sparkline of tier by day
  const w = 260, h = 54, n = p.days.length;
  const pts = p.days.map((d, i) =>
    `${(i / (n - 1) * w).toFixed(1)},${(h - (d.tier / C.tiersPerArea) * h).toFixed(1)}`).join(' ');
  const x30 = (29 / (n - 1) * w).toFixed(1);
  document.querySelector('#spark').innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
      <line x1="${x30}" y1="0" x2="${x30}" y2="${h}" stroke="#ffffff40" stroke-dasharray="3 3"/>
      <polyline points="${pts}" fill="none" stroke="#FAC81E" stroke-width="2.5"
                stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="sparklab"><span>day 1</span><span>day 30</span><span>day ${n}</span></div>`;
}

/** Unity-schema fields only — proto handles are stripped. */
function unityConfig(){
  const out = {};
  for (const k of Object.keys(DEFAULT_CONFIG)) if (!k.startsWith('proto')) out[k] = C[k];
  out.label = 'tuned in M1 slice ' + new Date().toISOString().slice(0, 16).replace('T', ' ');
  return out;
}

async function exportConfig(){
  const json = JSON.stringify(unityConfig(), null, 2);
  const box = document.querySelector('#jsonbox');
  box.value = json;
  box.style.display = 'block';
  box.select();
  try { await navigator.clipboard.writeText(json); status('Copied to clipboard.'); }
  catch { status('Select the text above and copy it.'); }
}

function importConfig(){
  const box = document.querySelector('#jsonbox');
  box.style.display = 'block';
  if (!box.value.trim()){ box.placeholder = 'Paste an economy_config JSON here, then press Import again.'; box.focus(); return; }
  try {
    const parsed = JSON.parse(box.value);
    let n = 0;
    for (const k of Object.keys(DEFAULT_CONFIG))
      if (typeof parsed[k] === 'number'){ C[k] = parsed[k]; n++; }
    HANDLES.filter(h => h.length > 1).forEach(([k]) => {
      document.querySelector('#s_' + k).value = +C[k];
      document.querySelector('#v_' + k).textContent = fmtVal(C[k]);
    });
    refreshProjection();
    status(`Imported ${n} values.`);
  } catch (e){ status('Parse failed: ' + e.message); }
}

function status(msg){
  const el = document.querySelector('#pstatus');
  el.textContent = msg;
  clearTimeout(status._t);
  status._t = setTimeout(() => (el.textContent = ''), 5000);
}

</script>
