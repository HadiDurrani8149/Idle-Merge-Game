<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eggsplosion 2 — M1 slice</title>
<style>
  :root{
    /* Eatventure-derived. Grass field, a paved yard inset on all four sides, and
       a DIRT-coloured cell tile — a white tier-1 hen was 1.07:1 against the old
       near-white tile, which is why she vanished. Deepening the ground did not
       help, because a piece never touches the ground; it sits on a tile. */
    --grass:#8CC152; --grassD:#79AC43;
    --pave:#F0E0D2; --paveEdge:#DFC9B6;
    --tile:#E8D5CA; --tileEdge:#D3BCAE;
    --ink:#3A3A3A; --sub:#A3A3A3; --hint:#8A7565;
    --bar:#FFFFFF; --pill:#F6F1E9;
    --gold:#F7BE2E;
    /* VIOLET. As a blue diamond the gem read as a button, and blue is
       navigation-only now. */
    --gem:#9B4FDC; --ok:#46C97E;
    --blue:#3D9BF5; --blueD:#2B7FD4;
    /* Four buttons in the bottom bar, four tints of the ONE blue. The widest
       channel spans 29 of 255 across the four, so the bar still reads as a
       single band — but four IDENTICAL rectangles made it look like one wide
       control, and a player learning the layout had nothing to anchor "the egg
       one" to. The icon colour is still doing the real work; this is a nudge,
       not a signal, and it is measured as one (see 21c in test_loop.py). */
    --blueSpeed:#4AA3F7; --blueSpeedD:#2F84D6;   /* SPEED   — warmest, lightest */
    --blueMerge:#5296F2; --blueMergeD:#3878D1;   /* MERGE   — toward indigo */
    --blueEgg:#35A5EE;   --blueEggD:#2287CC;     /* BUY EGG — toward cyan */
    --blueShop:#3D93E9;  --blueShopD:#2A76C8;    /* SHOP    — deepest */
    --green:#46C97E; --greenD:#33A863;
    --grey:#D6D6D6; --greyD:#BEBEBE; --red:#E5372B;
    --star:#4FC3F7; --starOff:#E2E5E8;
    --orange:#FF9330; --orangeD:#E0771A;
    --sheet:#F6EADF;
    --card:#FFFFFF42;
    /* ONE stack, used by the CSS and by every <text> in the SVG art. Deliberately
       system-only: the game has to open from file:// with no network, so a webfont
       is not available to it. */
    --font:system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,
           "Helvetica Neue",Arial,sans-serif;
    --sand:#F0E0D2; --sand2:#E3CBB4;   /* kept: a few rules still reference these */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Form controls do NOT inherit the page font — a <button> falls back to the
     browser's own 13.3px Arial, which is how the gear in the HUD and every
     control in the settings sheet ended up in a face nothing else on screen
     uses. Family only: `font:inherit` would also resize them. */
  button,input,select,textarea{font-family:inherit}
  /* The board does not scroll. It is sized to the screen.
     100dvh, not 100vh: on mobile Safari and Chrome the URL bar collapses as you
     scroll, and 100vh is the TALLEST the viewport ever gets — so a 100vh layout
     is cut off by the browser chrome until you scroll, which is exactly the
     scrolling we are trying to remove. dvh tracks the live viewport. */
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;position:fixed;
            inset:0;width:100%}
  body{
    background:var(--grass);
    background-attachment:fixed;
    color:var(--ink);
    font:14px/1.35 var(--font);
    display:flex;justify-content:center;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
    /* touch-action:none, NOT manipulation. `manipulation` still lets the
       browser take a drag as a page pan, and the moment it does it fires
       pointercancel and the drag dies mid-gesture — the "dragging doesn't work
       on mobile" bug. Nothing here scrolls except the shop, which opts back in. */
    touch-action:none;
  }
  #app{width:100%;max-width:440px;height:100%;
       padding:8px 15px calc(6px + env(safe-area-inset-bottom));
       display:flex;flex-direction:column;gap:var(--gap,8px);overflow:hidden;
       position:relative}
  /* The paved yard the coop stands on. Inset on ALL FOUR sides so it reads as a
     patch sitting on grass rather than a floor that runs off the screen. Behind
     everything, hence the negative z-index. */
  /* --yardBottom is written by fitToScreen from the MEASURED bottom of the grid,
     so the concrete always ends just under the board instead of at a guessed
     offset — and the bottom bar always lands on the grass below it. */
  #app::before{content:'';position:absolute;left:6px;right:6px;
       top:calc(env(safe-area-inset-top) + 54px);
       bottom:var(--yardBottom, calc(96px + env(safe-area-inset-bottom)));
       background:var(--pave);border-radius:30px;z-index:-1;
       box-shadow:0 7px 0 var(--paveEdge),inset 0 0 0 3px #FFFFFF63}

  /* ── hud ── */
  /* Sticky, because by four nests the page is taller than a phone and the two
     things a player must always be able to reach — their balances at the top
     and Buy Egg at the bottom — would otherwise scroll off. The board is what
     scrolls; the controls do not. */
  /* A FULL band or none at all — a white bar with grass showing down both sides
     read as a floating panel that had lost its edges. The negative margins have
     to match #app's padding exactly (8px top, 15px sides). */
  /* FIVE things across 390px now — two wallets, the tier pill, tasks and the
     gear — where there used to be four. The band therefore has to be able to
     absorb pressure: the two wallet pills may shrink (min-width:0 + a truncating
     number), and only the two 34px buttons are immovable. Without this the gear
     was pushed off the right edge on a 390px phone. */
  #hud{display:flex;gap:5px;align-items:center;flex:0 0 auto;
       padding:calc(env(safe-area-inset-top) + 5px) 11px 7px;z-index:40;
       margin:-8px -15px 0;background:var(--bar);box-shadow:0 3px 0 #0000000f}
  .pill{background:var(--pill);border-radius:999px;padding:6px 10px 6px 7px;font-weight:900;
        display:flex;align-items:center;gap:5px;font-size:14.5px;color:var(--ink);
        box-shadow:none;min-width:0}
  #hud .pill>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the wallets give way first; the tier pill and the two buttons hold their size */
  #hud .pill:nth-child(1),#hud .pill:nth-child(2){flex:0 1 auto}
  #hud .tierpill{flex:0 0 auto}
  #hud .hudspace{flex:1 1 auto;min-width:8px}   /* pushes tasks + settings to the right */
  .pill small{font-weight:700;opacity:.55;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .dot{width:19px;height:19px;display:inline-block;line-height:0}
  .gemicon{width:19px;height:19px;display:inline-block;line-height:0}
  #gear{width:34px;height:34px;border-radius:50%;background:var(--pill);
        font-size:17px;line-height:1;padding:0;box-shadow:none;color:#8A8A8A}
  /* Height ZERO, not display:none. It is still the target of "tap anywhere else
     to dismiss the card" and still shows notes as they arrive; it just no longer
     reserves a row for a sentence you have read once. An FTUE popup replaces it. */
  #log{font-size:12.5px;font-weight:800;color:var(--hint);flex:0 0 auto;
       height:0;overflow:visible;padding:0;position:relative;z-index:6}
  #log.flash{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
  #dbgline{font-size:10.5px;opacity:.6;font-variant-numeric:tabular-nums;flex:0 0 auto}

  /* ── nests ── */
  /* flex, not a fixed 4-column grid: the row holds owned nests + one locked
     slot, so the count changes and a fixed grid leaves a dead wrapped row */
  /* flex so the row never wraps as the count changes, but capped at a quarter
     so owning one nest doesn't blow the tile up to half the screen */
  /* wrap-reverse: extra rows stack UPWARD, so unlocking a nest adds a row
     above the existing ones instead of shoving the whole board down */
  /* --nest and --cell are computed in JS from the space actually left over, so
     the whole board fits whatever phone it lands on instead of running off the
     bottom. Tiles are sized, not stretched — an aspect-ratio tile in a flex
     column grows to fill and then overflows. */
  /* hard cap of four across: the height budget is computed from ceil(tiles/4),
     so if a wide screen let five sit in a row the reserved space would be a row
     too tall and the board would come out smaller than it needed to be */
  /* Nests are one row of up to four, the same size as a board cell, and LEFT
     ALIGNED to the grid's own left edge — centring them under a 4-wide grid put
     two nests off the column rhythm and read as a mistake. Same width box as
     #grid, so the two are guaranteed to share an edge. */
  /* flex-start, NOT center. #grid stretches to the full content width while its
     four columns only occupy part of it, so its CELLS begin at the content's
     left edge — a centred nest row lined up with that edge only by coincidence
     at 390px wide and sat 23px inside it at 360px. */
  #nests{display:flex;gap:var(--gap,6px);flex:0 0 auto;align-self:center;
         justify-content:flex-start;
         /* the level chip hangs below each nest — clearance so it does not
            land on the first row of the board */
         margin-bottom:21px;
         width:calc(4 * var(--cell,80px) + 3 * var(--gap,6px))}
  #nests>*{flex:0 0 var(--cell,80px);width:var(--cell,80px);height:var(--cell,80px)}
  .nest{background:var(--tile);border-radius:16px;display:flex;align-items:center;
        justify-content:center;transition:transform .12s,background .12s;
        box-shadow:0 2px 0 #0000000d;touch-action:none;position:relative}

  /* ── ONE colour for buying ──
     Every button that spends currency is green. It used to be blue for a nest
     level, cream for a coin upgrade, pale blue for a gem upgrade, gold for the
     "best value" pack, purple for a video and white-with-tinted-text for an IAP
     — six palettes for one verb, so the colour carried no information at all.
     Green now means "this costs something and you can afford it", and grey means
     you cannot. Nothing else is allowed to be green.

     The currency icon gets a WHITE OUTLINE on green: a blue gem on green is two
     mid-tone colours fighting, and the coin's gold reads muddy. `paint-order`
     puts the stroke behind the fill so the gem keeps its shape. */
  .buyable{background:var(--green,#3FCE9A);color:#fff;
           box-shadow:0 3px 0 var(--greenD,#2AA87B)}
  .buyable.off,.buyable.broke{background:#C9C6D4;color:#FFFFFFB8;
           box-shadow:0 3px 0 #ABA8B8;cursor:default}
  /* the GEM gets its keyline from a path stroke; the coin brings its own ring,
     so `.gemsvg` scoping is what keeps white out of the coin's egg stamp */
  .onbuy .gemsvg path,.buyable .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}

  /* ── the nest level chip ──
     Just the level and an up-arrow when something is affordable. The numbers
     that used to live here moved into the card, because a pip wide enough to
     state a price and a percentage was wider than the nest it sat on and
     adjacent ones collided. */
  .lvchip{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);
          display:flex;align-items:center;gap:3px;padding:1px 7px 2px;
          border-radius:999px;border:2px solid #FFFFFF52;background:#2A2140E8;
          color:#fff;font-size:10px;font-weight:900;white-space:nowrap;z-index:4;
          box-shadow:0 2px 5px #0000003d;pointer-events:none}
  /* .lvup, NOT .up — the shop's upgrade card already owns `.up`
     (background:#fff;padding:9px 10px), which turned this 8px arrow into a 32px
     white blob covering the nest. One global stylesheet, so every class here is
     effectively a global name. */
  .lvchip .lvup{font-style:normal;font-size:8px;color:var(--gold,#FFC93C);line-height:1}
  .lvchip.afford{border-color:var(--gold,#FFC93C);background:#3C2F16F0}
  .lvchip.maxed{opacity:.6}
  .lvchip.nag{animation:chipnag 1s ease-in-out infinite}
  @keyframes chipnag{0%,100%{transform:translateX(-50%) scale(1)}
                     50%{transform:translateX(-50%) scale(1.16)}}
  .nest.picked{background:#FFFFFF7A}
  /* ONE look for "buy the next one", on the board and in the coop alike. The
     coop's version lost its styling entirely when the customer stall was removed —
     it had been inheriting `.buyslot` from `.order.buyslot` — and had been
     rendering as two bare inline spans ever since. */
  .nest.buyslot,.cell.buytile{background:#FFFFFF4A;box-shadow:none;
       border:2.5px dashed #C8AE99;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:2px}
  .nest.buyslot .plus,.cell.buytile .plus{font-size:22px;font-weight:900;
       color:#A98D77;line-height:1;opacity:1}
  .nest.buyslot .price,.cell.buytile .price{display:flex;align-items:center;gap:3px;
       font-size:12px;font-weight:900;color:#8A7565;opacity:1;line-height:1}
  .nest.buyslot.afford,.cell.buytile.afford{border-style:solid;border-color:var(--green);
       background:#46C97E2E}
  .nest.buyslot.afford .plus,.cell.buytile.afford .plus{color:#1E7A52}
  .nest.buyslot.afford .price,.cell.buytile.afford .price{color:#0E7A55}

  /* ── the nest upgrade card ──
     Same furniture as the shop reference: level, name, three stars, a progress
     bar, two stat readouts, one big button. It hangs BELOW the nest rather than
     above it — there is room down there since the stall went — and it is allowed
     to cover the board, because tapping anywhere else dismisses it. */
  #nestcard{position:fixed;z-index:70;width:232px;display:none;
            filter:drop-shadow(0 10px 22px #00000038)}
  #nestcard.open{display:block;animation:cardin .17s cubic-bezier(.2,1.4,.5,1)}
  @keyframes cardin{from{opacity:0;transform:translateY(-8px) scale(.94)}
                    to{opacity:1;transform:none}}
  .ncard{position:relative;background:#fff;border-radius:20px;padding:14px 16px 15px;
         text-align:center;color:#2A2140}
  /* the little pointer up at the nest it belongs to */
  .ncard::before{content:'';position:absolute;top:-9px;left:var(--arrow,116px);
                 transform:translateX(-50%);border:10px solid transparent;
                 border-top:0;border-bottom-color:#fff}
  /* NO bird on this card. A hen portrait at the top made it read as a bird
     upgrade, which is exactly backwards — the level belongs to the nest, and the
     hen can be swapped out of it at any time. The tier now lives ON the nest tile
     instead, which is where you want it anyway: visible without opening anything. */
  /* A small EMPTY nest, at the star tier you have earned. Not a hen: the hen made
     this read as a bird upgrade. An empty bowl says "this is the nest" and doubles
     as a preview of what the next star does to it. */
  .ncnest{display:flex;justify-content:center;margin:-3px 0 1px;line-height:0}
  .ncnest svg{width:44px;height:44px;overflow:visible}
  .nctitle{font-size:22px;font-weight:900;line-height:1.1}
  .ncname{font-size:13px;font-weight:800;color:var(--sub);margin-top:1px}
  .ncstars{display:flex;justify-content:center;gap:4px;margin:4px 0 7px}
  .ncstars i{font-style:normal;font-size:20px;color:var(--starOff);line-height:1}
  .ncstars i.on{color:var(--star)}
  .ncbar{height:13px;border-radius:99px;background:#ECEFF1;position:relative;
         box-shadow:inset 0 1px 2px #00000012}
  /* the egg you win, sitting on the far end of the bar. No disc behind it — a
     round white badge made an egg read as a coin. */
  .ncend{position:absolute;right:-9px;top:50%;transform:translateY(-50%);
         line-height:0;filter:drop-shadow(0 1px 2px #00000038)}
  .ncbar i{display:block;height:100%;border-radius:99px;background:#43A9F5;
           transition:width .2s}
  /* what filling the bar actually gets you — a bar with no stated prize is
     just a number going up */
  .ncgoal{margin-top:6px;font-size:11.5px;font-weight:800;color:#6E6A80}
  .ncstats{display:flex;justify-content:space-between;align-items:center;
           margin:11px 3px 12px;font-size:15.5px;font-weight:900}
  .ncstats span{display:flex;align-items:center;gap:4px}
  .ncstats .nctime{color:#6E6A80}
  .ncbuy{width:100%;border:none;border-radius:14px;padding:12px 8px;cursor:pointer;
         background:var(--green,#3FCE9A);box-shadow:0 4px 0 var(--greenD,#2AA87B);
         color:#fff;font:inherit;font-size:17px;font-weight:900;
         display:flex;align-items:center;justify-content:center;gap:6px}
  .ncbuy:active{transform:translateY(2px);box-shadow:0 2px 0 var(--greenD,#2AA87B)}
  .ncbuy .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  .ncbuy.free{font-size:14px}
  .ncbuy.broke,.ncbuy.maxed{background:#C9C6D4;box-shadow:0 4px 0 #ABA8B8}
  /* Boost button — the card's own shape (.ncbuy) in the game's SPEED-blue, so it
     reads as the same family as the Speed booster without inventing a new look. */
  .ncbuy.boost{margin-top:8px;font-size:15px;
               background:var(--blueSpeed,#4AA3F7);box-shadow:0 4px 0 var(--blueSpeedD,#2F84D6)}
  .ncbuy.boost:active{box-shadow:0 2px 0 var(--blueSpeedD,#2F84D6)}
  .ncbuy.boost b{font-variant-numeric:tabular-nums}
  .ncbuy.boost.on{animation:boostpulse 1s ease-in-out infinite}
  .ncbuy.maxed{font-size:14px}
  .ncnext{margin-top:7px;font-size:12px;font-weight:800;color:#8E8AA0}
  /* The hatch floor, stated plainly. It rises from tier 6 and silently changes
     what a NORMAL egg hatches into — which reads as a bug if nothing says so.
     This is the one place production numbers live, so it says it here. */
  .ncfloor{margin-top:5px;font-size:10.5px;font-weight:800;color:#B4B0C2;
           line-height:1.25}

  /* ── the crate's upgrade card ──
     Deliberately the SAME furniture as #nestcard: they are the same kind of object
     from the player's side — a thing on the board you pour a currency into — and
     two upgrade cards that looked different would imply a difference that is not
     there. Only the anchoring differs: a nest is always in the top row, a crate
     can be anywhere, so this one flips above the tile near the bottom of the
     screen. */
  /* FOUR anchored cards now — nest, crate, slime, row prize — and they are
     deliberately identical apart from their contents. They all mean the same thing
     to a player ("a thing on your board you can act on"), so three different card
     designs would imply three different systems. One rule set, four hosts. */
  #cratecard,#slimecard,#prizecard{position:fixed;z-index:70;width:232px;display:none;
             filter:drop-shadow(0 10px 22px #00000038)}
  #cratecard.open,#slimecard.open,#prizecard.open{display:block;
             animation:cardin .17s cubic-bezier(.2,1.4,.5,1)}
  /* flipped: the pointer moves to the bottom edge and points down at the tile.
     The nest card never needed this because nests are always in the top row; a
     crate or a slime can be anywhere, including the last row. */
  #cratecard.above .ncard::before,#slimecard.above .ncard::before,
  #prizecard.above .ncard::before{top:auto;bottom:-9px;border-bottom:0;
        border-top:10px solid #fff;border-bottom-color:transparent}
  /* the slime card's 2x2 stat block */
  .slstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0 11px}
  .slstats>div{background:#F4F1FA;border-radius:11px;padding:7px 6px;text-align:center}
  .slstats b{display:flex;align-items:center;justify-content:center;gap:4px;
             font-size:14px;font-weight:900;line-height:1.1}
  .slstats span{display:block;font-size:9px;font-weight:800;color:#8E8AA0;margin-top:2px}
  .hotx{font-style:normal;color:#E0771A}
  /* SELL is the one button in the game that pays you rather than charging you, so
     it is deliberately NOT the green every other buy button uses — green means
     "this costs something and you can afford it", and reusing it here would break
     the only colour rule the UI has. */
  .ncbuy.sell{background:var(--gem,#9B4FDC);box-shadow:0 4px 0 #7A34B8;
              position:relative;overflow:hidden}
  .ncbuy.sell .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  /* nowrap: the label plus a gem plus a number is wider than the button at 17px,
     and letting it wrap split "Hold to sell —" onto its own line with the price
     stranded to the right of the charge bar */
  .ncbuy.sell>span{position:relative;z-index:1;display:flex;align-items:center;
                   gap:5px;white-space:nowrap;font-size:15px}
  /* the charge. Width is written from a rAF rather than transitioned, so letting
     go snaps it back to zero instantly — a transition would animate the retreat and
     read as "it is still going". */
  .ncbuy.sell .holdfill{position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
                        background:#FFFFFF3D;border-radius:14px}
  .ncbuy.sell.holding{background:#B45BE8;box-shadow:0 2px 0 #7A34B8;
                      transform:translateY(2px)}
  /* past two-thirds it goes red: past this point you are about to lose the piece */
  .ncbuy.sell.nearly{background:var(--red,#E5372B);box-shadow:0 2px 0 #A81F16}
  .ncbuy.sell.nearly .holdfill{background:#FFFFFF5C}
  /* the slime card's coin bar */
  .ncbar.slime{margin-top:2px;height:11px}
  .ncbar.slime i{background:#FFB020}
  .ncbar.slime .ncend{right:-9px}
  .slnext{font-size:10px;font-weight:800;color:#8E8AA0;margin:6px 0 10px;line-height:1.3}
  .slnext b{color:#2A2140;font-variant-numeric:tabular-nums}
  /* the slime's dot ladder, in place of the nest's three stars */
  .ncstars i{font-style:normal}
  .ncard .ncstars i{font-size:20px}
  /* the green SECOND bar on the nest card — the current egg, not the star tier */
  .ncbar.egg{margin-top:7px;height:11px}
  .ncbar.egg i{background:var(--ok,#46C97E)}
  .ncbar.egg .ncend{right:-8px}
  .ncstats .nctime.hot{color:#E0771A}
  .ncstats .nctime b{font-variant-numeric:tabular-nums}
  /* a nest running its star boost. The bowl itself pulses, so the reward is
     visible on the object you spent the coins on rather than only in a toast. */
  .nest.hot{animation:nesthot .7s ease-in-out infinite}
  @keyframes nesthot{0%,100%{filter:none}
                     50%{filter:brightness(1.16) saturate(1.15)}}
  /* INSIDE the tile, not hanging off its top-left corner — out there it sat in
     the gap between two nests and read as belonging to whichever one you looked
     at first. */
  .nest .hotpip{position:absolute;left:2px;top:2px;z-index:5;font-size:12px;
        line-height:1;background:#1F6FBF;color:#FFD34D;border-radius:999px;
        padding:3px 5px;box-shadow:0 2px 4px #00000040;pointer-events:none}

  /* ── the slime aura, as a number ──
     The ring says "something is affecting this egg"; this says how much. Slime
     orange, so the cause is unambiguous even when the slime is diagonally
     adjacent and easy to miss. */
  .aurapct{position:absolute;right:-4px;bottom:-5px;z-index:6;pointer-events:none;
           background:#FF7A2AF0;color:#fff;font-size:9.5px;font-weight:900;
           letter-spacing:.01em;padding:2px 6px 3px;border-radius:999px;
           border:2px solid #FFFFFF4D;box-shadow:0 2px 4px #00000040;
           white-space:nowrap}

  /* ── HUD dropdowns ──
     One host, two panels, mutually exclusive. Anchored under the HUD band and
     right-aligned to the pill that opened them. */
  #huddrop{position:fixed;z-index:75;display:none;width:250px;
           filter:drop-shadow(0 12px 26px #0000003d)}
  #huddrop.open{display:block;animation:cardin .16s cubic-bezier(.2,1.4,.5,1)}
  .hdcard{background:#fff;border-radius:18px;padding:12px 13px 13px;color:#2A2140}
  .hdcard::before{content:'';position:absolute;top:-9px;left:var(--arrow,200px);
                  transform:translateX(-50%);border:10px solid transparent;
                  border-top:0;border-bottom-color:#fff}
  .hdhead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;
          letter-spacing:.1em;text-transform:uppercase;color:#9A96AC;margin-bottom:9px}
  .hdhead .hdtimer{margin-left:auto;font-variant-numeric:tabular-nums;color:#43A9F5;
                   letter-spacing:0;text-transform:none;font-size:11px}
  .hdrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:12px;
         background:#F4F1FA;margin-bottom:6px}
  .hdrow.done{background:#E9F8F0}
  .hdrow.claimed{opacity:.5}
  .hdi{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#FFE9B8;
       display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
  .hdtxt{flex:1;min-width:0}
  .hdtxt b{display:block;font-size:11.5px;font-weight:900;line-height:1.25}
  .hdbar{height:5px;border-radius:99px;background:#00000014;margin-top:4px;overflow:hidden}
  .hdbar i{display:block;height:100%;border-radius:99px;background:#43A9F5}
  .hdrow.done .hdbar i{background:var(--ok)}
  .hdnum{font-size:9.5px;font-weight:800;color:#8E8AA0;margin-top:2px;display:block}
  /* the claim chip. Green means collectable, and nothing else in the panel is
     allowed to be green — same rule the shop follows. */
  .hdclaim{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:5px 9px;
           border-radius:999px;font-size:11px;font-weight:900;background:#C9C6D4;
           color:#FFFFFFC7}
  .hdclaim.can{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--greenD);
               cursor:pointer;animation:chipnag 1.1s ease-in-out infinite}
  .hdclaim.got{background:transparent;color:var(--ok);box-shadow:none;font-size:14px}
  .hdbonus{margin-top:8px;border-radius:13px;padding:10px;text-align:center;
           font-weight:900;font-size:12.5px;background:#F4F1FA;color:#8E8AA0;
           display:flex;align-items:center;justify-content:center;gap:5px}
  .hdbonus.can{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--greenD);
               cursor:pointer}
  .hdbonus.got{background:#E9F8F0;color:#2AA87B}
  .hdbonus .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  /* the "what's coming" panel */
  .hdnext{display:flex;align-items:center;gap:10px;padding:8px;border-radius:13px;
          background:#F4F1FA;margin-bottom:6px}
  .hdnext.soon{background:#FFF4D9;box-shadow:inset 0 0 0 2px #FFD54A66}
  .hdnext .hdart{width:44px;height:44px;flex:0 0 44px;display:flex;
                 align-items:center;justify-content:center;line-height:0}
  .hdnext b{display:block;font-size:12px;font-weight:900;line-height:1.2}
  .hdnext span{display:block;font-size:10px;color:#8E8AA0;line-height:1.35;margin-top:2px}
  .hdtier{font-size:9.5px;font-weight:900;color:#43A9F5;letter-spacing:.06em}

  .hudbtn{position:relative;width:34px;height:34px;border-radius:50%;
          background:var(--pill);font-size:16px;line-height:1;padding:0;border:none;
          cursor:pointer;flex:0 0 auto;color:#8A8A8A}
  .hudbtn .pip{top:-4px;right:-4px;min-width:17px;height:17px;font-size:10px;
               background:#FF4D4D;color:#fff;box-shadow:0 2px 0 #C42D2D}
  #gear{margin-left:0}
  /* the tier pill is much narrower now that it states an unlock rather than a
     coin figure, which is what makes room for the tasks button */
  .tierpill{cursor:pointer;gap:4px;padding:6px 9px 6px 6px}
  /* profile avatar — leftmost HUD pill, shows your best hen on the grid */
  #hud .profilepill{flex:0 0 auto;width:40px;height:40px;padding:0;border-radius:50%;
                    overflow:hidden;justify-content:center;cursor:pointer;
                    box-shadow:0 0 0 2px #FFFFFFAA inset,0 2px 4px #0000001f}
  #hud .profilepill #nextChip{animation:none;width:100%;height:100%;
                              display:flex;align-items:center;justify-content:center;gap:0}
  #hud .profilepill #nextChip svg{width:36px;height:36px}
  /* 96px, not 74. At 74 "Daily tasks" truncated to "Daily ta…", which tells the
     player nothing and makes the pill look broken — the whole reason this pill
     stopped showing a coin figure was to name the thing that is coming. */
  #nextWhat{font-size:9.5px;font-weight:900;color:#8A5C08;line-height:1.15;
            max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── confetti for a special egg landing ── */
  .conf{position:fixed;width:7px;height:9px;border-radius:2px;z-index:97;
        pointer-events:none;animation:conffly .95s ease-out forwards}
  @keyframes conffly{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0);opacity:0}
    18%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx))
                            ,calc(-50% + var(--dy) + 26px))
                  scale(1) rotate(var(--rot));opacity:0}}

  /* ── the merge vanish ──
     The piece you dragged shrinks toward the one it merged into and fades, rather
     than being deleted between two frames. It is a throwaway copy on <body>, so it
     survives the board rebuild that is about to replace the tile it came from —
     see vanishGrid(). */
  /* 200ms, and IN PLACE. The drift toward the merge target pulled the eye away
     from the survivor's bounce, which is the animation that actually says what
     happened. Scale and fade on the spot, fast enough to read as consumption
     rather than as a piece leaving. */
  .vanish{position:fixed;pointer-events:none;z-index:95;line-height:0;
          transform-origin:50% 60%;
          animation:vanishOut .2s cubic-bezier(.4,0,.7,1) forwards}
  .vanish svg{width:100%;height:100%}
  @keyframes vanishOut{
    0%  {transform:scale(1);opacity:.95}
    100%{transform:scale(.24);opacity:0}}

  /* ── the fire slime ──
     Slow bounce, deliberately much slower than anything the hens do (they breathe
     on 3.4s and glance on 9s, but both are near-imperceptible) — the slime is the
     only thing on the board with real movement, which is what makes a new one
     catch your eye without a label. */
  .slimeidle{animation:slimebounce 2.2s ease-in-out infinite;
             transform-origin:52px 84px}
  @keyframes slimebounce{
    0%,100%{transform:translateY(0) scale(1,1)}
    28%    {transform:translateY(-5px) scale(.95,1.06)}
    52%    {transform:translateY(0) scale(1.07,.93)}
    74%    {transform:translateY(-2px) scale(.98,1.02)}}
  /* BOOSTED. A Speed booster doubles the slime's aura, and the slime is the only
     piece that reacts to a booster by changing rather than merely going faster —
     so it has to LOOK different, not just tick quicker. Three times the dance
     speed, and it burns brighter. */
  .cell.slimecell.hot .slimeidle{animation-duration:.72s}
  .cell.slimecell.hot{filter:brightness(1.14) saturate(1.3)
                      drop-shadow(0 0 8px #FF7A2A88)}
  /* its own coin cycle, across the foot of the tile. Same affordance a nest's lay
     bar uses, because it means the same thing: something is filling up. */
  .slbar{position:absolute;left:14%;right:14%;bottom:5%;height:7%;border-radius:99px;
         background:#00000020;overflow:hidden;pointer-events:none;z-index:3}
  .slbar i{display:block;height:100%;border-radius:99px;background:#FFB020}
  .cell.slimecell.hot .slbar i{background:#FFD34D}
  .cell.slimepay{animation:slimepay .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes slimepay{0%{transform:scale(1)}40%{transform:scale(1.13)}
                      70%{transform:scale(.97)}100%{transform:scale(1)}}
  /* an egg that a slime is touching. A faint warm ring, because the mechanic is
     about PLACEMENT and placement has to be legible — otherwise a player whose egg
     happens to sit next to a slime gets a faster hatch and no idea why. */
  .cell.egg.auralit{box-shadow:0 2px 0 var(--tileEdge),
                    inset 0 0 0 3px #FF7A2A66, 0 0 12px #FF7A2A3D}
  /* and while a booster is running, that ring GLOWS — the aura is doubled and the
     board should say so without the player having to read the pill. */
  .cell.egg.aurahot{animation:auraglow .9s ease-in-out infinite}
  @keyframes auraglow{
    0%,100%{box-shadow:0 2px 0 var(--tileEdge),
            inset 0 0 0 3px #FF7A2A99, 0 0 12px #FF7A2A66}
    50%    {box-shadow:0 2px 0 var(--tileEdge),
            inset 0 0 0 4px #FFB020EE, 0 0 22px #FF7A2ACC}}
  .cell.egg.aurahot .aurapct{background:#FFB020F0;color:#4A2A00}

  /* an overflow egg dropping into a crate */
  .cratein{position:fixed;pointer-events:none;z-index:97;line-height:0;
           transform:translate(-50%,-50%);
           animation:crateIn .5s cubic-bezier(.3,1.2,.5,1) forwards}
  @keyframes crateIn{
    0%  {transform:translate(-50%,-190%) scale(.75);opacity:0}
    25% {opacity:1}
    62% {transform:translate(-50%,-40%) scale(1.06);opacity:1}
    80% {transform:translate(-50%,-58%) scale(.9);opacity:.9}
    100%{transform:translate(-50%,-46%) scale(.35);opacity:0}}

  /* the row reward: JUST the crate, centred, no dashed box. The dashes said "a
     square you could buy", which is the wrong promise — this square is not for
     sale, it is where a prize will appear, and the box also made the row's last
     tile compete with the buy tile beside it. */
  .cell.prizeonly{background:none;box-shadow:none;border:none;cursor:pointer;
                  position:relative}
  .cell.prizeonly .rowprize{position:static;transform:none;right:auto;top:auto}
  .cell.prizeonly:active{transform:translateY(2px)}

  /* ── the crate ──
     Two targets on one tile. The tile releases; the chip in the corner spends
     gems. The chip is small on purpose — it must be hard to hit by accident,
     because the accident costs real currency. */
  .cell.crate{position:relative;cursor:pointer}
  .crup{position:absolute;right:-4px;bottom:-6px;display:flex;align-items:center;gap:2px;
        padding:2px 6px 3px;border-radius:999px;border:2px solid #FFFFFF52;
        background:#2A2140E8;color:#fff;font-size:9.5px;font-weight:900;
        white-space:nowrap;z-index:5;box-shadow:0 2px 5px #0000003d}
  .crup.afford{border-color:var(--green);background:#14503AF0}
  .crup.maxed{opacity:.55;background:#2A2140B0}
  /* the reward sitting on the end of a row of unlockable tiles, positioned exactly
     like the prize egg on the end of a nest's star bar — half off the right edge,
     vertically centred, so it reads as "the thing at the end of this bar" */
  .rowprize{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
            line-height:0;z-index:4;pointer-events:none;
            filter:drop-shadow(0 2px 4px #0000004d);
            animation:bob 1.8s ease-in-out infinite}
  .cell.locked,.cell.buytile{position:relative;overflow:visible}
  /* the tile the reward sits on. At the plain locked weight (#FFFFFF0D on the pale
     pave) it was invisible, so the crate looked like it was floating in space
     instead of marking the end of the row. */
  .cell.locked.prize{background:#FFFFFF33;border-color:#C8AE99;opacity:.9}

  .cell.egg{position:relative}
  /* ABSOLUTE. The cell is a centring flex box, so an inline label became a
     sibling of the egg and shoved it sideways. */
  .bonuslbl{position:absolute;left:50%;top:4px;transform:translateX(-50%);
            background:#3A3A3AF0;color:#FFD870;font-size:9px;font-weight:900;
            letter-spacing:.02em;padding:2px 7px;border-radius:99px;
            white-space:nowrap;z-index:6;pointer-events:none;
            box-shadow:0 1px 4px #00000045;
            animation:bonusin .3s cubic-bezier(.2,1.5,.4,1)}
  @keyframes bonusin{from{opacity:0;transform:translateX(-50%) translateY(-5px) scale(.8)}
                     to{opacity:1;transform:translateX(-50%)}}

  /* NO special tile background. The egg itself is gold or silver and that is the
     whole signal — a glowing plate under it was a second, louder one saying the
     same thing, and it turned the board into three kinds of surface. What stays
     is the pop when it lands and the confetti, because those are EVENTS.
     The sparkle inside the gold shell (drawn by eggSVG) also stays. */
  .eggshine{animation:twinkle 1.6s ease-in-out infinite;transform-origin:52px 40px}
  @keyframes twinkle{0%,100%{opacity:.55;transform:scale(.9)}
                     50%{opacity:1;transform:scale(1.1)}}
  .cell.egg.silverpop,.cell.egg.goldpop{animation:specialpop .55s cubic-bezier(.2,1.5,.4,1)}
  @keyframes specialpop{0%{transform:scale(.6)}55%{transform:scale(1.14)}100%{transform:scale(1)}}

  /* ── PNG asset layer (art.js) ──
     Every rule here is dormant until assets/ has files in it. The selectors sit
     alongside the existing `... svg` rules rather than replacing them, because
     the two render paths coexist: a half-finished art pass has painted chickens
     and drawn nests on the same board. */
  .artwrap{position:relative;display:block;line-height:0}
  /* Default to the width/height ATTRIBUTES. A blanket width:100% made every
     bare icon (gems in price pills, the buy tile) inflate to its container. */
  .artimg{display:block;object-fit:contain;
          user-select:none;-webkit-user-drag:none;pointer-events:none}
  .artwrap>.artimg{position:absolute;left:0;top:0;width:100%;height:100%}
  .cell .artwrap,.nest .artwrap{width:100%!important;height:100%!important}
  .artbadge{position:absolute;right:4%;bottom:2%;min-width:34%;text-align:center;
            font-size:calc(var(--cell,60px) * .30);font-weight:900;color:#fff;
            line-height:1.25;padding:0 4px;border-radius:999px;background:#0006;
            text-shadow:0 1px 2px #0009;pointer-events:none}
  /* the crack bar, kept as DOM because an image cannot tween a sub-segment */
  .artbar{position:absolute;left:13%;right:13%;bottom:5%;height:9%;
          display:flex;gap:4%;pointer-events:none}
  .artbar i{flex:1 1 0;border-radius:99px;background:#00000016;overflow:hidden;
            position:relative}
  .artbar i.on::after,.artbar i.live::after{content:'';position:absolute;
            left:0;top:0;bottom:0;border-radius:99px;background:#3FCE9A;
            width:calc(var(--f,1) * 100%)}
  .artbar i.on::after{--f:1}
  .artwrap.arteggwrap.g .artbar i.on::after,.artwrap.arteggwrap.g .artbar i.live::after{background:#2C97DA}
  .nestbarwrap{left:11%;right:11%;bottom:6%;height:16%}
  .nestbarwrap i{background:#0000001f}
  .nestbarwrap i::after{content:'';position:absolute;left:0;top:0;bottom:0;
            border-radius:99px;background:#3FCE9A;width:calc(var(--f,0) * 100%)}
  .art-nest-hen{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
                width:74%;height:74%;pointer-events:none}
  .art-nest-front{position:absolute;left:0;top:0}
  .artnestlab{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
              font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #0009;
              pointer-events:none;z-index:3}

  /* ── the hen, alive ──
     Three loops at different periods so they never line up into an obvious cycle:
     a slow breathe, an occasional glance, and a blink. All CSS, so they cost
     nothing per frame and survive every board redraw — a JS-driven version would
     be wiped by the next markDirty('nest'). */
  .henidle{animation:henbreathe 3.4s ease-in-out infinite,
                     henglance 9s ease-in-out infinite;
           transform-origin:52px 62px}
  @keyframes henbreathe{0%,100%{transform:translateY(0) scaleY(1)}
                        50%{transform:translateY(-1px) scaleY(1.025)}}
  @keyframes henglance{0%,58%,100%{rotate:0deg}
                       64%,72%{rotate:-4deg}
                       80%,88%{rotate:4.5deg}}
  .henblink{animation:henblink 4.6s steps(1,end) infinite}
  @keyframes henblink{0%,95.5%{opacity:0}96%,98.4%{opacity:1}98.9%,100%{opacity:0}}
  /* the hop when she lays. 4px, not 10 — a big jump became a tic within seconds */
  .nest.laid{animation:henlaid .4s cubic-bezier(.25,1.4,.4,1)}
  @keyframes henlaid{0%{transform:translateY(0)}
                     40%{transform:translateY(-4px) scaleY(1.03)}
                     100%{transform:translateY(0)}}

  /* ── grid ── */
  /* justify-content:START, matching #nests. It used to centre, which meant the
     two rows only lined up when their widths happened to be equal — at 360px
     the grid's cells sat 23px in from the nest row's edge. Anchoring both to the
     content's left edge makes the alignment structural instead of coincidental. */
  #grid{display:grid;grid-template-columns:repeat(4,var(--cell,88px));gap:var(--gap,7px);
        justify-content:start;flex:0 0 auto;align-self:center}
  /* Both rows are align-self:CENTER and both are exactly 4 cells + 3 gaps wide, so
     they centre together and still share a left edge. Left-aligning them instead
     left the board hugging one side whenever the cell size was height-bound
     rather than width-bound — i.e. on any tall narrow phone. */
  /* position:relative on EVERY cell, not just the egg. `.bonuslbl` is absolutely
     positioned and it is now used by three things — a bonus egg, a new crate and a
     fresh mutation — so a cell type without a positioning context sends the label
     off to #app's origin instead. That is exactly what happened to "Mutation!":
     the label rendered, just not anywhere near the slime. */
  .cell{width:var(--cell,88px);height:var(--cell,88px);
        border-radius:18px;display:flex;align-items:center;justify-content:center;
        background:var(--tile);transition:transform .12s,background .12s;
        box-shadow:0 2px 0 var(--tileEdge);
        position:relative;touch-action:none}
  .cell svg{width:90%;height:90%;pointer-events:none}
  .cell.empty{background:#00000010;box-shadow:inset 0 2px 0 #00000012}
  /* a cell the coop has not grown into yet */
  .cell.locked{background:#FFFFFF0D;box-shadow:none;border:2px dashed #FFFFFF3D;
               opacity:.55;pointer-events:none}
  /* The next square you can buy. Its LOOK is the shared .nest.buyslot/.cell.buytile
     rule up in the coop block — this is only what a board tile adds to it. The
     duplicate paint that used to live here (a 19px plus and a #12729E price) sat
     LATER in the sheet than the shared rule, so it quietly won: the two buy tiles
     were unified in one place and un-unified in another. */
  .cell.buytile{cursor:pointer;
                transition:transform .1s,background .12s,border-color .12s}
  .cell.buytile:active{transform:translateY(2px)}
  /* Same dirt tile as every other cell. It used to be a lighter white, which is
     exactly the white-on-white problem: an uncracked egg is #FFFCF4 and sat on
     #FFFFFF4D. All three variants share this — the egg's own colour is the signal. */
  .cell.egg{cursor:pointer;background:var(--tile)}
  .cell.chick{cursor:grab}
  .cell.dragging{opacity:.25}
  .cell.match{background:#3FCE9A66;box-shadow:inset 0 0 0 3px var(--ok)}
  /* A merge is the moment the whole game is built around, so it gets a real
     bounce rather than a scale-up: squash on landing, overshoot, settle. The
     ring is a separate element so it can expand past the tile without the tile
     itself having to overflow. */
  .cell.pop, .nest.pop{animation:pop .42s cubic-bezier(.2,1.5,.4,1)}
  .nope{animation:nope .3s}
  @keyframes pop{0%  {transform:scale(.66) translateY(4px)}
                 32% {transform:scale(1.22) translateY(-5px)}
                 58% {transform:scale(.94) translateY(2px)}
                 78% {transform:scale(1.06) translateY(-1px)}
                 100%{transform:scale(1) translateY(0)}}
  /* an egg arriving: drops in and settles, once, on the frame it appears */
  .cell.egg.fresh{animation:eggin .42s cubic-bezier(.2,1.35,.4,1)}
  @keyframes eggin{0%  {transform:translateY(-38%) scale(.72);opacity:0}
                   55% {transform:translateY(2%) scale(1.07);opacity:1}
                   78% {transform:translateY(0) scale(.97)}
                   100%{transform:none}}
  /* a crack: deliberately almost nothing. It fires up to four times an egg and
     anything with a real arc to it becomes a tic within about ten seconds. */
  .cell.egg.jolt{animation:jolt .16s ease-out}
  @keyframes jolt{0%{transform:none}
                  35%{transform:translate(1.5px,-2px) rotate(-1.6deg) scale(1.035)}
                  70%{transform:translate(-1px,0) rotate(.8deg)}
                  100%{transform:none}}
  /* the bird that comes out — a settle, not a fanfare; the feathers carry it */
  .cell.hatched{animation:hatched .46s cubic-bezier(.25,1.4,.4,1)}
  @keyframes hatched{0%  {transform:scale(.7)}
                     45% {transform:scale(1.11)}
                     72% {transform:scale(.97)}
                     100%{transform:scale(1)}}
  .feather{position:fixed;pointer-events:none;z-index:97;
           animation:featherOff 1.5s cubic-bezier(.25,.6,.4,1) forwards}
  @keyframes featherOff{0%  {transform:translate(0,0) rotate(0) scale(.7);opacity:0}
                        14% {transform:translate(calc(var(--fx) * .18),calc(var(--fy) * .42))
                                       rotate(calc(var(--fr) * .2)) scale(1);opacity:.95}
                        100%{transform:translate(var(--fx),calc(var(--fy) * -1 + 46px))
                                       rotate(var(--fr)) scale(.86);opacity:0}}
  .ring{position:fixed;pointer-events:none;z-index:96;border-radius:26px;
        border:3px solid var(--ok);opacity:.85;
        animation:ringout .46s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes ringout{0%{transform:scale(.72);opacity:.85}
                     100%{transform:scale(1.55);opacity:0}}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ── shop ── */
  /* flex, so hidden boost buttons collapse and Buy Egg simply takes the room */
  /* margin-top:auto pins the bar to the bottom of the viewport. The board is
     width-constrained on a phone, so removing the stall left vertical slack
     that the grid cannot absorb — top-packing it read as a broken layout.
     The band between board and bar is where the task panel goes next. */
  #shop{display:flex;gap:6px;flex:0 0 auto;z-index:40;margin-top:auto}
  #shop>*{flex:1 1 0;min-width:0}
  .buy{border:none;border-radius:16px;padding:10px 6px 9px;cursor:pointer;color:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:3px;font:inherit;font-weight:900;min-height:62px;
       transition:transform .09s,filter .12s}
  .buy:active{transform:translateY(2px)}
  /* overflow must stay VISIBLE or the pips (which sit at top:-6px) get clipped
     away entirely; the fill carries its own radius so it can't escape the
     button's rounded corners */
  .buy{position:relative;overflow:visible}
  .buy>*{position:relative;z-index:1}
  .bfill{position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;border-radius:16px;
         background:#FFFFFF2E;transition:width .15s linear}
  .buy .ico{font-size:22px;line-height:1}
  .buy .ico.art{line-height:0}
  .buy .t{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.92;
          white-space:nowrap;margin-top:1px}
  .buy .c{font-size:14px;display:flex;align-items:center;gap:4px;line-height:1}
  .freetag{font-size:12px;letter-spacing:.03em}
  .pip{position:absolute;top:-6px;right:-5px;min-width:22px;height:22px;border-radius:999px;
       background:#FFFFFF;color:#4A342A;font-size:11px;font-weight:900;display:flex;
       align-items:center;justify-content:center;padding:0 5px;z-index:2;
       box-shadow:0 2px 0 #00000026}
  .pip.running{background:#FFF3C4;color:#8A5C08}
  .pip.red{background:#FF4D4D;color:#fff;box-shadow:0 2px 0 #C42D2D}
  .buy.out{filter:grayscale(.55);opacity:.62}
  .buy.out .pip{background:#E8E0D8;color:#00000055}
  .buy.shopbtn{background:var(--blueShop);box-shadow:0 4px 0 var(--blueShopD);flex:0 0 56px;
               font-size:22px;padding:0}
  /* There is no CSS coin any more. Every coin on screen is coinSVG() — the HUD
     wallet, the shop rows, the buy buttons, the tap splash and the flyers — so
     `.coin` is only a legacy sizing box for anything that still wraps one. */
  .coin{display:inline-block;line-height:0;flex:0 0 auto}
  /* Buy Egg spends coins, so it is green like everything else that does.
     SPEED and MERGE keep their colours on purpose — they ACTIVATE boosters you
     already own (note the count pip), so they are not purchases. */
  /* ALL BLUE down here, told apart by the ICON colour inside. Green is reserved
     for the shop, where it means "this costs something and you can afford it".
     Buy Egg is a purchase, but it lives in the persistent bar, so it follows the
     bar's rule and its egg glyph does the work. */
  .buy.egg{background:var(--blueEgg);box-shadow:0 4px 0 var(--blueEggD)}
  .buy.shopbtn{color:#FFFFFF}
  /* The whole bar is ONE blue in four tints; the ICON inside still carries the
     identity. Four unrelated button colours down here competed with
     green-means-buy in the shop, which is why they were flattened in the first
     place — the tints keep that rule and only break up the silhouette. */
  .buy.boost{background:var(--blueSpeed);box-shadow:0 4px 0 var(--blueSpeedD)}
  .buy.boost .ico{color:#FFD34D}
  .buy.boost.merge{background:var(--blueMerge);box-shadow:0 4px 0 var(--blueMergeD)}
  .buy.boost.merge .ico{color:#C9A8FF}
  .buy.boost.active{background:#1F6FBF;box-shadow:0 4px 0 #14528F;
                    animation:boostpulse 1s ease-in-out infinite}
  @keyframes boostpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  .buy .c .rvtag2{font-size:9px;font-weight:900;background:#0000002E;border-radius:6px;
                  padding:2px 5px;margin-left:4px;letter-spacing:.04em}
  .buy .c .secs{font-size:15px}
  .buy.poor{filter:grayscale(.72) brightness(.9);opacity:.72}

  .buy .sub{font-size:9.5px;opacity:.85;font-weight:700}

  /* ── next-chicken chip, inside the tier pill ── */
  .tierpill{padding-right:9px}
  .tierpill .sep{width:1px;height:15px;background:#00000018;margin:0 2px}
  #nextChip{display:flex;align-items:center;gap:2px;animation:bob 1.8s ease-in-out infinite}
  #nextChip svg{opacity:1}
  #nextChip b{font-size:11px;font-weight:900;color:#8A5C08}
  #nextChip .alldone{font-size:10px;font-weight:900;opacity:.6}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  /* ── debug ── */
  #dbg{display:flex;gap:5px;align-items:center;flex-wrap:wrap;
       background:#00000012;border-radius:14px;padding:6px}
  #dbg button{font:inherit;font-weight:800;border:none;border-radius:9px;padding:7px 9px;
              background:#FFFFFF66;color:var(--ink);cursor:pointer;font-size:12px}
  #dbg button.on{background:var(--ink);color:#FFF3E6}
  #dbg button.wide{flex:1}

  /* ── collection feedback ── */
  .flyer{position:fixed;z-index:99;pointer-events:none;line-height:0;
         animation:fly .58s cubic-bezier(.35,0,.5,1) forwards}
  .flyer.out{animation-name:flyout}
  .flyer.grad svg{filter:drop-shadow(0 3px 4px #00000055)}
  @keyframes fly{0%{transform:translate(0,0) scale(.7);opacity:0}
                 18%{transform:translate(0,-10px) scale(1.15);opacity:1}
                 100%{transform:translate(var(--dx),var(--dy)) scale(.55);opacity:.25}}
  @keyframes flyout{0%{transform:translate(0,0) scale(1);opacity:1}
                    100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
  .splash{position:fixed;z-index:98;pointer-events:none;display:flex;align-items:center;
          gap:5px;transform:translate(-50%,-50%);animation:splash .78s ease-out forwards}
  .splash .gemsplash i{display:none}
  .gemsplash b{color:#8FE0FF}
  /* the splash coin is the SAME coinSVG the HUD draws — see coinSplash() */
  .splash i{display:inline-block;line-height:0;flex:0 0 auto}
  .splash b{font-size:19px;font-weight:900;color:#8A5C08;text-shadow:0 2px 0 #FFFFFFAA}
  @keyframes splash{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
                    22%{transform:translate(-50%,-62%) scale(1.28);opacity:1}
                    100%{transform:translate(-50%,-135%) scale(.95);opacity:0}}
  .pill.bump{animation:bump .32s ease-out}
  @keyframes bump{0%,100%{transform:scale(1)}45%{transform:scale(1.16)}}

  /* dancing chicken — the REWARDED video */
  .dancer{animation:dance .62s ease-in-out infinite;transform-origin:50% 85%}
  @keyframes dance{0%,100%{transform:rotate(-9deg) translateY(0)}
                   25%{transform:rotate(0deg) translateY(-8px)}
                   50%{transform:rotate(9deg) translateY(0)}
                   75%{transform:rotate(0deg) translateY(-8px)}}

  /* jumping monkey — the INTERSTITIAL. Deliberately a different mascot and a
     different motion so the two ad formats never read as the same thing. */
  .monkey{animation:mjump .78s cubic-bezier(.3,.7,.4,1) infinite;transform-origin:50% 95%}
  @keyframes mjump{0%,100%{transform:translateY(0) scaleY(1)}
                   14%{transform:translateY(4px) scaleY(.9)}
                   42%{transform:translateY(-30px) scaleY(1.06)}
                   70%{transform:translateY(0) scaleY(.94)}}
  .monkey .marms{animation:marms .78s ease-in-out infinite;transform-origin:50% 60%}
  @keyframes marms{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .monkey .mlegs{animation:mlegs .78s ease-in-out infinite;transform-origin:50% 74%}
  @keyframes mlegs{0%,100%{transform:scaleY(1)}42%{transform:scaleY(.72)}}
  .monkey .mshadow{animation:mshadow .78s cubic-bezier(.3,.7,.4,1) infinite}
  @keyframes mshadow{0%,100%{opacity:.15;transform:scale(1)}
                     42%{opacity:.06;transform:scale(.6)}}

  /* ── tutorial arrow: flowing dots along a bowed path ── */
  /* The FTUE pointer. Was a bowed dotted path with an arrowhead between two
     measured elements; it is one bouncing arrow above the thing to tap now.
     White fill with a grey outline so it reads over the board, a nest or the
     hint line without knowing what is behind it. */
  /* Short and stubby on purpose. A tall arrow with a long tail reached up into
     the coin pill — there is only ~30px of clear space between the hint line and
     the nest row, so the whole thing has to live inside that. */
  #tut{position:fixed;z-index:97;display:none;pointer-events:none;
       animation:tutbob 0.85s ease-in-out infinite;
       filter:drop-shadow(0 2px 3px #00000040)}
  #tut svg{overflow:visible;display:block}
  @keyframes tutbob{0%,100%{transform:translateY(0)}
                    50%{transform:translateY(9px)}}

  /* ── toasts ── */
  #toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:101;
          display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:#2E2119EE;color:#FFE9CF;font-weight:900;font-size:12.5px;
         padding:8px 15px;border-radius:999px;animation:toastin 2.2s ease-out forwards;
         box-shadow:0 4px 0 #00000022;white-space:nowrap}
  .toast.start{background:#2E7D52EE;color:#EAFFF3}
  .toast.end{background:#7A4A3AEE}
  @keyframes toastin{0%{opacity:0;transform:translateY(-10px) scale(.9)}
                     12%,80%{opacity:1;transform:none}
                     100%{opacity:0;transform:translateY(-8px)}}

  /* ── ghost + floats ── */
  /* left:0/top:0 and driven purely by TRANSFORM — see moveGhost(). Writing
     left/top on every pointermove invalidates layout for the whole document; a
     translate3d is composited and never touches layout at all. will-change gets
     the layer created up front rather than promoted mid-gesture, which is itself a
     visible hitch on the first move of a drag. */
  .ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:99;
         transform:translate3d(0,0,0) translate(-50%,-50%);
         will-change:transform;filter:drop-shadow(0 8px 10px #0003)}
  .float{position:fixed;pointer-events:none;z-index:98;font-weight:900;font-size:16px;
         transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;
         text-shadow:0 1px 0 #FFFFFFAA}
  .float.coin{color:#96650B} .float.gem{color:#12729E}
  @keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}

  /* ── shop: warm and light, not the dark tuning sheet ── */
  /* The sheet is a shade WARMER and flatter than before. It used to run
     #FFF6EA -> #FFEBD6, which is close enough to white that white cards sat on it
     invisibly — every card needed a border to exist. At #F6EADF the cards read as
     cards and the borders are decoration rather than load-bearing. */
  #shop2{background:var(--sheet,#F6EADF);color:var(--ink)}
  #shop2 h2 span{opacity:.4}
  /* balances live in the shop header: judging a price against your wallet
     should not require closing the sheet to go and look */
  #shop2 h2 .wallet{margin-left:auto;display:flex;gap:6px;opacity:1;align-items:center}
  #shop2 h2{align-items:center}
  /* the same white band + cream pills as the HUD */
  #shop2 h2{background:var(--bar);margin:-14px -14px 4px;padding:13px 14px;
         box-shadow:0 3px 0 #0000000f;border-radius:0}
  #shop2 h2 .wpill{margin-left:0;display:flex;align-items:center;gap:6px;background:var(--pill);
         border-radius:999px;padding:6px 12px 6px 8px;font-size:13.5px;font-weight:900;opacity:1;
         cursor:default}
  .wpill b{font-variant-numeric:tabular-nums}
  /* Both wallet glyphs are flat SVG now and want the same box — the coin used to
     be the CSS gradient sphere, which made the two pills look like two systems. */
  .wgem,.wcoin{width:16px;height:16px;display:inline-block;line-height:0;flex:0 0 auto}
  #shop2 h2 #closeShop{margin-left:10px;font-size:16px}
  #shopBody{overflow:auto;flex:1;padding-right:4px;display:flex;flex-direction:column;gap:13px;
            touch-action:pan-y;overscroll-behavior:contain}
  #shopBody .sec{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;
                 opacity:.45;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  /* pan-y, not pan-x: the pointer handler in buildDots owns the horizontal
     gesture (a mouse gets no native flick, and this build is played on both),
     so the browser must keep VERTICAL panning and stay out of the horizontal —
     otherwise the two scroll the same drag twice */
  /* NO css scroll-snap. It was the rubberband: releasing a short swipe restored
     `scroll-snap-type` and the browser instantly snapped to the nearest snap
     point — always the card you started on — cancelling the paging scroll
     before it could animate. The settle is done in JS, where a flick can
     commit to the next card instead of being rounded back to the current one. */
  .carousel{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;
            touch-action:pan-y;-webkit-overflow-scrolling:touch;cursor:grab;
            scrollbar-width:none}
  .carousel:active{cursor:grabbing}
  .carousel .offer{user-select:none}
  .carousel::-webkit-scrollbar{display:none}
  /* Deeper lip plus a real cast shadow, and a hairline of light along the top
     edge — three cheap moves that read as "product" rather than "div". */
  .offer{flex:0 0 88%;border-radius:22px;padding:13px 14px;position:relative;
         color:#fff;overflow:hidden;cursor:pointer;
         box-shadow:0 6px 0 rgba(0,0,0,.20),0 11px 22px rgba(0,0,0,.16),
                    inset 0 1px 0 rgba(255,255,255,.34)}
  .offer.best{background:linear-gradient(160deg,#FFB03A,#FF7A2E)}
  .offer.pig{background:linear-gradient(160deg,#FF8DC0,#E0559A)}
  .offer.noads{background:linear-gradient(160deg,#6FA8F5,#4B76E0)}
  .offer.gems{background:linear-gradient(160deg,#57C8F5,#2E86C8)}
  .offer:active{transform:translateY(2px)}
  .ribbon{position:absolute;top:11px;right:-30px;transform:rotate(40deg);background:#fff;
          color:#D9541F;font-size:8px;font-weight:900;letter-spacing:.06em;padding:3px 34px;
          box-shadow:0 1px 3px #0003}
  .oname{font-size:15px;font-weight:900}
  .orow{display:flex;gap:12px;align-items:center;margin-top:5px}
  .oart2{flex:0 0 100px;height:72px;display:flex;align-items:center;justify-content:center;gap:1px;
         background:#FFFFFF22;border-radius:15px}
  .bigemo{font-size:36px;line-height:1}
  .oli{font-size:10.5px;font-weight:700;opacity:.96;display:flex;align-items:center;gap:4px}
  .oli svg{flex:0 0 auto}
  /* scoped to .offer: unscoped, this white plate also landed behind the gem
     price on the buy-nest and buy-slot tiles, where it reads as a stray box */
  .offer .price{margin-top:9px;background:#fff;border-radius:12px;padding:7px 0;text-align:center;
         font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.13)}
  /* Four different text colours for one price is four different answers to
     "can I buy this". All green. */
  .offer .price{background:var(--green,#3FCE9A);color:#fff;
                box-shadow:0 3px 0 var(--greenD,#2AA87B)}
  /* the piggy's plate is a WATCH button, not a price, and it carries a gem glyph.
     gemSVG is display:block, so the plain centred-text plate broke the line and
     threw the gem out to the left of the button — this is a flex row instead. */
  .offer .price.rvprice{display:flex;align-items:center;justify-content:center;gap:6px}
  .offer .price.rvprice .dotsep{opacity:.55}
  .offer .price.rvprice .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  .offer .price.off{background:#C9C6D4;color:#FFFFFFD1;box-shadow:0 3px 0 #ABA8B8}
  .pigbar{margin-top:7px;height:8px;background:#FFFFFF33;border-radius:4px;overflow:hidden}
  .pigbar i{display:block;height:100%;background:#FFF0A0}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
  /* the dot is 6px but the tappable box around it is 20 — a dot you can see and
     cannot hit is worse than no dot */
  .dots i{width:6px;height:6px;border-radius:50%;background:#00000020;transition:width .2s;
          cursor:pointer;box-sizing:content-box;padding:7px 5px;background-clip:content-box}
  .dots i.on{background:#C79A5E;width:18px;border-radius:99px}
  .free{display:flex;gap:8px}
  .fcard{flex:1;background:linear-gradient(#FFFFFF,#FFF9F2);border-radius:18px;padding:11px 12px;
      box-shadow:0 4px 0 #E5D4C6,0 6px 14px #00000012,inset 0 1px 0 #FFFFFF;
         display:flex;flex-direction:column;gap:1px}
  .fcard .fi{font-size:25px;line-height:1}
  /* the free-coins card used the 🪙 emoji, which is a THIRD coin on a screen that
     is meant to have exactly one */
  .fcard .fi.coinart{display:flex;align-items:center;height:27px}
  .fcard b{font-size:13.5px}.fcard span{font-size:10px;opacity:.55;line-height:1.3}
  .fbtn{margin-top:7px;border-radius:11px;padding:8px 0;text-align:center;font-weight:900;
        font-size:12.5px;color:#fff;cursor:pointer}
  .fbtn.go{background:var(--green);box-shadow:0 3px 0 var(--greenD)}
  .fbtn.rv{background:var(--green);box-shadow:0 3px 0 var(--greenD)}
  .fbtn.off{background:#C9C6D4;color:#FFFFFFB8;box-shadow:0 3px 0 #ABA8B8;cursor:default}
  .cons{display:grid;grid-template-columns:1fr 1fr;gap:9px 8px}
  /* The same three moves as .up and .fcard, to the hex — a booster card that is
     two shades off the upgrade card next to it reads as a different set. */
  .cn{background:linear-gradient(#FFFFFF,#FFF9F2);border-radius:18px;padding:11px;
      box-shadow:0 4px 0 #E5D4C6,0 6px 14px #00000012,inset 0 1px 0 #FFFFFF;
      border:2.5px solid transparent;position:relative;transition:transform .1s}
  .cn.can{border-color:var(--ok)}
  .cnh{display:flex;align-items:center;gap:8px}
  .cni{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;
       justify-content:center;font-size:20px}
  /* the board's dirt tile, so the shop and the coop are made of the same stuff */
  .cni{background:var(--tile);box-shadow:0 2px 0 var(--tileEdge)}
  .cni.s{background:var(--tile)}.cni.m{background:var(--tile)}
  .cnn{font-size:12.5px;font-weight:900;line-height:1.15}
  .cnq{font-size:10px;opacity:.55;font-weight:800}
  /* one price per card now — a whole card is the tap target */
  .cnbuy1{margin-top:9px;border-radius:11px;padding:8px 0;text-align:center;font-weight:900;
          font-size:13px;background:var(--green,#3FCE9A);color:#fff;
          box-shadow:0 3px 0 var(--greenD,#2AA87B);
          display:flex;align-items:center;justify-content:center;gap:4px}
  .cnbuy1 .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  .cnbuy1.off{background:#C9C6D4;color:#FFFFFFB8;box-shadow:0 3px 0 #ABA8B8}
  .cn.can{cursor:pointer}
  .cn.can:active{transform:translateY(2px)}
  /* the "best value" pack used to go gold here — same verb, same colour now */
  .cnsave{position:absolute;top:-7px;right:-5px;background:var(--ok);color:#fff;
          border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:900;
          letter-spacing:.04em;box-shadow:0 2px 0 #2AA87A}
  .shopsec{margin-bottom:14px}
  .shophead{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;
            letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:7px}
  .upgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  /* The premium pass, and it is three things rather than more decoration: a
     top-light gradient so the card looks lit from above, a coloured LIP instead of
     a flat grey shadow, and a hairline highlight on the top edge. The same three
     moves on every card type, which is what makes them read as one set. */
  .up{background:linear-gradient(#FFFFFF,#FFF9F2);border-radius:18px;padding:10px 11px;
      box-shadow:0 4px 0 #E5D4C6,0 6px 14px #00000012,inset 0 1px 0 #FFFFFF;
      border:2.5px solid transparent;transition:transform .1s,border-color .12s;position:relative}
  .uptag{position:absolute;top:-8px;left:8px;background:var(--ok);color:#fff;border-radius:999px;
         padding:2px 8px;font-size:9px;font-weight:900;letter-spacing:.05em;
         box-shadow:0 2px 0 #2AA87A;white-space:nowrap}
  .uptag.gem{background:var(--gem);box-shadow:0 2px 0 #2A87BF;color:#06334D}
  /* a discount badge should look like one: gold, tilted, and catching light */
  .uptag.shiny{background:linear-gradient(100deg,#FF9330,#FFC93C 45%,#FF7A2E);
               color:#5A2E00;box-shadow:0 2px 0 #D9761A;letter-spacing:.06em;
               font-size:9.5px;padding:3px 9px;transform:rotate(-2.5deg);
               position:absolute;overflow:hidden}
  .uptag.shiny::after{content:"";position:absolute;top:-60%;left:-45%;width:34%;height:220%;
                      background:linear-gradient(100deg,#FFFFFF00,#FFFFFFCC,#FFFFFF00);
                      transform:rotate(18deg);animation:shine 2.6s ease-in-out infinite}
  /* The gold ring goes ON TOP of the card's lip, it does not replace it. Written
     before the premium pass, this rule dropped the lip, the cast shadow and the
     top highlight — so the one card wearing a "99% OFF" badge was also the only
     flat card in the sheet, and on a fresh save that is EVERY upgrade card. */
  .up.starter{border-color:var(--gold);
      box-shadow:0 4px 0 #E5D4C6,0 6px 14px #00000012,inset 0 1px 0 #FFFFFF,
                 0 0 0 4px #FFC93C22}

  /* buying something: the card flashes, throws light, and pays the wallet */
  .bought{animation:boughtpop .5s cubic-bezier(.2,1.45,.4,1)}
  @keyframes boughtpop{0%{transform:scale(1)}
                       28%{transform:scale(1.055)}
                       58%{transform:scale(.985)}
                       100%{transform:scale(1)}}
  /* The sweep used to be `.bought::before` — position:absolute, inset:0,
     translateX(-105% -> 105%). Nothing clipped it: shop cards want overflow
     visible for the "% OFF" tag hanging off the top edge, and the nest card's
     buy button never clipped either, so the white band sailed clear across the
     screen. Fix is a throwaway clip layer pinned over the card's rect, which
     also means overflow on the card itself is left alone. z-index sits above
     the shop sheet (100) and toasts (101), below sparks (130). */
  .shineclip{position:fixed;pointer-events:none;overflow:hidden;z-index:128}
  .shineclip i{position:absolute;inset:0;display:block;
               background:linear-gradient(100deg,#FFFFFF00 35%,#FFFFFFE0 50%,#FFFFFF00 65%);
               animation:sweep .55s ease-out forwards}
  @keyframes sweep{from{transform:translateX(-105%)}to{transform:translateX(105%)}}
  .ring.buyring{border-color:var(--gold);border-width:4px;animation-duration:.5s}
  .spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:130;
         animation:sparkOut .62s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes sparkOut{0%{transform:translate(0,0) scale(.4);opacity:0}
                      18%{transform:translate(calc(var(--sx) * .3),calc(var(--sy) * .3)) scale(1.2);opacity:1}
                      100%{transform:translate(var(--sx),calc(var(--sy) + 24px)) scale(.2);opacity:0}}
  /* a real-money purchase gets the whole screen for three quarters of a second */
  .glory{position:fixed;inset:0;pointer-events:none;z-index:129;
         background:radial-gradient(circle at 50% 50%,#FFD54A55,#FFD54A00 62%);
         animation:gloryOut .9s ease-out forwards}
  @keyframes gloryOut{0%{opacity:0;transform:scale(.6)}
                      22%{opacity:1;transform:scale(1)}
                      100%{opacity:0;transform:scale(1.25)}}
  .up.can{border-color:var(--ok);cursor:pointer}
  .up.can:active{transform:translateY(2px)}
  .up.maxed{opacity:.5}
  .uptop{display:flex;align-items:center;gap:7px}
  /* the board's dirt tile, so the shop and the coop are made of the same stuff */
  .upic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;
        justify-content:center;font-size:19px;flex:0 0 auto;
        background:var(--tile);box-shadow:0 2px 0 var(--tileEdge)}
  .upic.c,.upic.g{background:var(--tile)}
  .upname{font-size:12.5px;font-weight:900;line-height:1.15}
  .uplv{font-size:9.5px;opacity:.5;font-weight:800}
  .upunit{font-size:11px;font-weight:900;color:#C87A12;margin-top:6px}
  .upunit.g{color:#1E7FB8}
  .upbuy{margin-top:7px;border-radius:11px;padding:7px 0;text-align:center;font-weight:900;
         font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
  /* White pills, not gold/blue ones. A blue gem sitting on a blue button reads
     as one indistinct blob rather than a price — and the affordability signal
     is already carried by the card's green border. */
  .upbuy.c,.upbuy.g{background:var(--green,#3FCE9A);color:#fff;
                    box-shadow:0 3px 0 var(--greenD,#2AA87B)}
  /* the gem gets its white keyline from a path stroke; the coin carries its own
     (coinSVG's `ring` argument), so it needs nothing here */
  .upbuy.c .gemsvg path,.upbuy.g .gemsvg path{stroke:#FFFFFF;stroke-width:2.5;paint-order:stroke}
  .upbuy.off{background:#C9C6D4;color:#FFFFFFB8;box-shadow:0 3px 0 #ABA8B8}
  .upbuy.off svg{opacity:.72}

  /* ── modals ── */
  .modal{position:fixed;inset:0;background:#2A1F1ACC;z-index:120;display:none;
         align-items:center;justify-content:center;padding:22px;
         overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
  .modal.open{display:flex;animation:fadein .18s ease-out}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .pcard{background:linear-gradient(180deg,#FFF6EC,#FFE7CF);border-radius:24px;
         padding:18px 22px 16px;text-align:center;max-width:280px;width:100%;
         box-shadow:0 10px 0 #00000022;animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
  @keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .pkicker{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
           color:#B07A3E}
  .pcard .part{line-height:0;margin:2px 0 -4px;display:flex;justify-content:center}
  .ptier{font-size:19px;font-weight:900;color:var(--ink)}
  .pcoins{display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px;
          font-weight:900;color:#96650B;margin:4px 0 12px}
  .pcoins .coindot{display:inline-block;line-height:0;flex:0 0 auto}
  /* what this tier unlocked, if anything — a new verb reads differently from a
     bigger number and has to look different too */
  .unlocks{display:flex;flex-direction:column;gap:7px;margin:0 0 13px;text-align:left}
  .unlock{display:flex;gap:9px;align-items:center;background:#FFFFFFAB;border-radius:14px;
          padding:9px 11px;box-shadow:0 2px 0 #0000000d}
  @keyframes unlockin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  /* ── the staggered reveal ──
     Every row of the discovery card enters on its own beat, driven by a per-element
     --d delay set in renderPopup. `backwards` fill matters: without it each element
     is fully visible until its delay elapses and then jumps, which is worse than no
     animation at all. */
  .stag{animation:stagin .34s cubic-bezier(.2,1.3,.4,1) backwards;
        animation-delay:var(--d,0ms)}
  @keyframes stagin{from{opacity:0;transform:translateY(10px) scale(.96)}
                    to{opacity:1;transform:none}}
  /* the unlock pill is the one thing on this card the player MUST read — it is the
     only place the game ever says a new verb exists — so it gets a bigger entrance
     than everything else and a ring that flashes once it lands */
  .unlock.stag.pop{animation:unlockpop .52s cubic-bezier(.2,1.5,.4,1) backwards;
                   animation-delay:var(--d,0ms)}
  @keyframes unlockpop{
    0%  {opacity:0;transform:translateY(14px) scale(.82)}
    55% {opacity:1;transform:translateY(0) scale(1.06)}
    75% {transform:scale(.98)}
    100%{opacity:1;transform:none}}
  .unlock.stag.pop .ui2{animation:uiring .6s ease-out backwards;
                        animation-delay:calc(var(--d,0ms) + 260ms)}
  @keyframes uiring{0%{box-shadow:0 0 0 0 #FFC93CCC}
                    100%{box-shadow:0 0 0 14px #FFC93C00}}
  .pgift{font-size:11px;font-weight:800;color:#B07A3E;margin:-4px 0 10px}
  /* the control a gift just flew into */
  .gifted{animation:giftland .8s cubic-bezier(.2,1.4,.4,1)}
  @keyframes giftland{0%,100%{transform:none}
                      30%{transform:scale(1.14)}
                      55%{transform:scale(.96)}
                      78%{transform:scale(1.05)}}
  .unlock .ui2{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#FFE9B8;
               display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
  .unlock b{display:block;font-size:12.5px;line-height:1.2}
  .unlock span{display:block;font-size:10.5px;opacity:.62;line-height:1.35;margin-top:2px}
  .pcard button{border:none;border-radius:14px;background:var(--green);color:#fff;
       font:inherit;font-weight:900;font-size:15px;padding:11px 30px;cursor:pointer;
       box-shadow:0 4px 0 var(--greenD)}
  .pcard button:active{transform:translateY(2px)}
  .pcard button.x2{background:var(--orange);box-shadow:0 4px 0 var(--orangeD);
                   display:block;width:100%;margin-bottom:8px;font-size:14px}
  .pcard button.plain{background:#00000014;color:#8A6B52;box-shadow:none;
                      font-size:13px;padding:8px 20px}

  .ibody{background:#15181C;border-radius:18px;padding:14px;width:100%;max-width:330px;
         text-align:center;color:#DDE3EA}
  .itag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.62;margin-bottom:8px;
        display:flex;align-items:center;justify-content:space-between;gap:8px}
  .itag b{background:#FFFFFF1F;border-radius:6px;padding:3px 7px;letter-spacing:.1em}
  .iscreen{background:linear-gradient(140deg,#26303C,#3A2E4A);border-radius:12px;height:190px;
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
           overflow:hidden}
  .ifake{font-size:11px;opacity:.4;letter-spacing:.12em;text-transform:uppercase}
  #ibar{height:5px;border-radius:3px;background:#FFFFFF1A;overflow:hidden;margin-top:10px}
  #ibar i{display:block;height:100%;width:0;background:#FFC93C;border-radius:3px}
  #iclose{margin-top:11px;border:none;border-radius:11px;background:#FFFFFF1F;color:#DDE3EA;
          font:inherit;font-weight:900;padding:10px 26px;cursor:pointer;font-size:13px;
          transition:opacity .2s}
  #iclose[disabled]{opacity:.32;cursor:default}
  .ihint{font-size:10px;opacity:.4;margin-top:7px}
  /* ── the half-price no-ads window ── */
  .fcard2{background:linear-gradient(165deg,#3B4FC4,#7B3FD4 62%,#B33FC0);border-radius:24px;
          padding:20px 20px 16px;width:100%;max-width:320px;text-align:center;color:#fff;
          box-shadow:0 14px 0 #00000033;position:relative;overflow:hidden;
          animation:popin .34s cubic-bezier(.2,1.4,.4,1)}
  .fcard2 .fkick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
  .fcard2 h3{margin:4px 0 0;font-size:23px;line-height:1.1}
  .fcard2 .fsub{font-size:12px;opacity:.85;margin-top:5px;line-height:1.4}
  .fart{margin:12px 0 6px;display:flex;align-items:center;justify-content:center;gap:8px}
  .fart .bigemo{font-size:44px;line-height:1}
  .fslash{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
  .fslash s{opacity:.6;font-size:15px}
  .fslash b{font-size:28px;line-height:1}
  .fpct{background:#FFD54A;color:#5A3B00;border-radius:999px;padding:4px 11px;font-size:12px;
        font-weight:900;letter-spacing:.04em;display:inline-block;margin-top:2px;
        transform:rotate(-3deg)}
  .ftime{font-size:11px;opacity:.85;margin-top:9px;font-variant-numeric:tabular-nums}
  .ftime b{font-size:14px}
  /* the shine: a highlight that sweeps the button rather than a flashing colour,
     which reads as urgent without reading as broken */
  .fbuy{position:relative;overflow:hidden;margin-top:11px;width:100%;border:none;
        border-radius:15px;background:#FFD54A;color:#5A3B00;font:inherit;font-weight:900;
        font-size:17px;padding:14px 0;cursor:pointer;box-shadow:0 5px 0 #D9A400;
        animation:fpulse 1.7s ease-in-out infinite}
  .fbuy:active{transform:translateY(3px);box-shadow:0 2px 0 #D9A400}
  .fbuy::after{content:"";position:absolute;top:-60%;left:-40%;width:26%;height:220%;
               background:linear-gradient(100deg,#FFFFFF00,#FFFFFFD9,#FFFFFF00);
               transform:rotate(18deg);animation:shine 2.4s ease-in-out infinite}
  @keyframes shine{0%{left:-40%}55%{left:120%}100%{left:120%}}
  @keyframes fpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.026)}}
  .fskip{margin-top:9px;background:none;border:none;color:#FFFFFFB0;font:inherit;
         font-size:12px;font-weight:800;cursor:pointer;padding:6px 12px}

  /* the badge that keeps the offer alive over the board for ten minutes */
  #flashbadge{position:fixed;top:56px;right:10px;z-index:60;display:none;
              background:linear-gradient(150deg,#5B45D6,#B33FC0);color:#fff;border-radius:14px;
              padding:7px 10px;box-shadow:0 4px 0 #00000026;cursor:pointer;
              font-weight:900;line-height:1.15;text-align:right;
              animation:badgein .35s cubic-bezier(.2,1.4,.4,1)}
  #flashbadge.on{display:block}
  /* the hint line runs the full width, so give the badge its own lane rather
     than letting it sit on top of the words */
  body.hasflash #log{padding-right:136px;min-height:34px}
  #flashbadge .bt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  #flashbadge .bp{font-size:13px}
  #flashbadge .bc{font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}
  #flashbadge .bdot{position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;
                    background:#FFD54A;box-shadow:0 0 0 0 #FFD54A99;animation:bping 1.8s ease-out infinite}
  @keyframes bping{0%{box-shadow:0 0 0 0 #FFD54AAA}70%{box-shadow:0 0 0 11px #FFD54A00}
                   100%{box-shadow:0 0 0 0 #FFD54A00}}
  @keyframes badgein{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:none}}
  /* the same half-price treatment on the carousel card, so the two agree */
  .offer.deal{outline:3px solid #FFD54A;outline-offset:-3px}
  .offer .wasnow{display:flex;align-items:center;justify-content:center;gap:8px}
