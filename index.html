  .offer .wasnow s{opacity:.6}

  .ccard{background:linear-gradient(180deg,#FFF6EC,#FFE7CF);border-radius:22px;padding:18px 20px 16px;
         width:100%;max-width:300px;text-align:center;box-shadow:0 10px 0 #00000022;color:var(--ink);
         animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
  .cart{display:flex;align-items:center;justify-content:center;gap:2px;height:64px;margin:6px 0 2px}
  .cname{font-size:17px;font-weight:900}
  .clines{font-size:11px;opacity:.6;margin:5px 0 3px;line-height:1.45}
  .cprice{font-size:22px;font-weight:900;color:#D9541F;margin:8px 0 4px}
  .cnote{font-size:9.5px;opacity:.45;margin-bottom:11px}
  .crow{display:flex;gap:8px}
  .crow button{flex:1.35;border:none;border-radius:13px;background:var(--green);color:#fff;
                font:inherit;font-weight:900;font-size:13.5px;padding:11px 0;cursor:pointer;
                box-shadow:0 4px 0 var(--greenD)}
  .crow button.plain{flex:1;background:#00000012;color:#8A6B52;box-shadow:none}
  .rvbody{background:#15181C;border-radius:18px;padding:14px;width:100%;max-width:320px;
          text-align:center;color:#DDE3EA}
  .rvtag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;
         margin-bottom:8px}
  .rvscreen{background:linear-gradient(140deg,#26303C,#3A2E4A);border-radius:12px;
            height:150px;display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:8px}
  .rvplay{font-size:34px;opacity:.85}
  .rvfake{font-size:11px;opacity:.4;letter-spacing:.12em;text-transform:uppercase}
  #rvbar{height:6px;background:#FFFFFF1A;border-radius:3px;overflow:hidden;margin:10px 0}
  #rvbar i{display:block;height:100%;width:0;background:var(--gold)}
  #rvskip{border:none;border-radius:10px;background:#FFFFFF18;color:#DDE3EA;font:inherit;
          font-weight:800;padding:9px 22px;cursor:pointer;font-size:13px}

  /* ── overlays ── */
  /* the body sets touch-action:none so the BOARD can be dragged; every sheet
     has to opt back into vertical panning or its content can't be scrolled */
  .sheet{position:fixed;inset:0;background:#3A2A22F2;color:#FFF3E6;z-index:100;
         display:none;flex-direction:column;padding:14px;
         padding-top:calc(14px + env(safe-area-inset-top));
         padding-bottom:calc(14px + env(safe-area-inset-bottom));
         overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
  .sheet.open{display:flex}
  /* ── bottom Upgrades button + its scrollable half-sheet ── */
  .buy.upgbtn{background:var(--blueShop);box-shadow:0 4px 0 var(--blueShopD)}
  #hud .pill{cursor:pointer;position:relative}
  #shopPip{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:9px;
           background:#FF4D4D;color:#fff;font-size:11px;font-weight:900;display:none;
           align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 0 #C42D2D;z-index:3}
  #shopPip[style*="inline"],#shopPip:not([style*="none"]){display:flex}
  .sheetdim{position:fixed;inset:0;background:#00000066;z-index:100;opacity:0;pointer-events:none;
            transition:opacity .22s}
  .sheetdim.open{opacity:1;pointer-events:auto}
  .halfsheet{position:fixed;left:0;right:0;bottom:0;z-index:101;
             height:62vh;max-height:74vh;min-height:44vh;
             background:var(--sheet,#F6EADF);color:var(--ink);border-radius:20px 20px 0 0;
             box-shadow:0 -14px 40px #00000066;display:flex;flex-direction:column;
             padding:8px 14px calc(12px + env(safe-area-inset-bottom));
             transform:translateY(112%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
             touch-action:pan-y;overscroll-behavior:contain}
  .halfsheet.open{transform:translateY(0)}
  .halfsheet .grab{width:40px;height:5px;border-radius:3px;background:#00000022;
                   margin:2px auto 8px;flex:0 0 auto}
  .halfsheet h2{margin:0 0 8px;font-size:15px;letter-spacing:.05em;display:flex;
                align-items:center;flex:0 0 auto}
  .halfsheet h2 .wallet{margin-left:auto;display:flex;gap:6px;align-items:center}
  .halfsheet h2 .wpill{display:flex;align-items:center;gap:6px;background:var(--pill);white-space:nowrap;
                       border-radius:999px;padding:3px 9px 3px 7px;font-weight:900;font-size:12.5px}
  .halfsheet h2 .wpill b{font-variant-numeric:tabular-nums}
  .halfsheet h2 #closeUpg{margin-left:10px;cursor:pointer;opacity:.7}
  .upgbody{overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch;
           overscroll-behavior:contain;padding-bottom:6px}
  .sheet h2{margin:0 0 10px;font-size:15px;letter-spacing:.05em;display:flex}
  .sheet h2 span{margin-left:auto;cursor:pointer;opacity:.7}
  .sheet .row{display:flex;gap:6px;margin-top:8px}
  /* only exists once developer tools are switched on, same gate as the time
     controls and the tuning panel */
  #devgrants{display:none;border-top:1px solid #FFFFFF1A;margin-top:12px;padding-top:10px}
  #devgrants.on{display:block}
  .setlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;
            font-weight:900;margin-bottom:2px}
  #devgrants button{flex:1;font-size:12px;padding:9px 4px}
  .sheet button{font:inherit;background:#FFFFFF1F;color:#FFF3E6;border:none;
                border-radius:11px;padding:11px;flex:1;font-weight:800;cursor:pointer}
  /* the one irreversible control in the game */
  .sheet button.danger{background:#8A2A2A;color:#FFE2E2}
  .sheet button.danger.arm{background:var(--red,#E5372B);color:#fff;
                           animation:chipnag .8s ease-in-out infinite}
  .setrow{display:flex;align-items:center;gap:10px;background:#FFFFFF12;
          border-radius:12px;padding:12px;margin-bottom:8px}
  .setrow small{display:block;opacity:.6;font-size:11px;font-weight:600;margin-top:2px}
  .setrow input{width:20px;height:20px;accent-color:var(--gold)}
  .setrow.vol input[type=range]{width:100%;height:22px;margin-top:4px}

  #proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:5px;margin-bottom:6px}
  #proj div{background:#FFFFFF14;border-radius:9px;padding:5px 8px}
  #proj span{display:block;font-size:10px;opacity:.65}
  #proj b{font-size:14px;color:var(--gold)}
  #warn div{background:#F5A02026;color:#FFCE7A;border-radius:8px;padding:6px 8px;font-size:11px;margin-bottom:4px}
  #warn div.okinfo{background:#3FCE9A22;color:#A9EBCB}
  #spark{margin-bottom:6px}
  .sparklab{display:flex;justify-content:space-between;font-size:9px;opacity:.5}
  #handles{overflow:auto;flex:1;padding-right:4px}
  .sect{font-size:10px;letter-spacing:.09em;opacity:.55;margin:12px 0 5px;font-weight:800}
  .h{margin-bottom:9px}
  .h label{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
  .h label b{color:var(--gold);font-variant-numeric:tabular-nums}
  .h input[type=range]{width:100%;accent-color:var(--gold)}
  .h i{display:block;font-size:10px;opacity:.5;line-height:1.35;margin-top:2px}
  #jsonbox{display:none;width:100%;height:104px;margin-top:6px;font:11px/1.4 monospace;
           background:#0006;color:#DFE7C8;border:1px solid #FFFFFF20;border-radius:8px;padding:6px}
  #pstatus{font-size:11px;color:var(--ok);min-height:15px}

  /* ── just-in-time coach marks: small, non-blocking, one-time per mechanic ── */
  #coachwrap{position:fixed;left:0;right:0;
             top:calc(58px + env(safe-area-inset-top));
             z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;
             pointer-events:none;padding:0 12px}
  .coach{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;
         width:min(330px,calc(100vw - 28px));
         background:#FFF6EC;color:#3A2E27;border-radius:15px;
         padding:11px 12px 11px 11px;
         border:1px solid #E7D3C0;border-left:5px solid var(--gold);
         box-shadow:0 12px 28px #00000042,0 2px 0 #E7D3C0;
         font:600 12px/1.34 var(--font);
         transform:translateY(-14px);opacity:0;transition:transform .26s cubic-bezier(.2,.9,.3,1),opacity .26s}
  .coach.in{transform:translateY(0);opacity:1}
  /* ── first-time animated HAND pointer (buyEgg / tapEgg / merge) ── */
  #handhint{position:fixed;z-index:130;pointer-events:none;display:none;transform:translateX(-50%)}
  #handhint .handglyph{display:block;font-size:36px;line-height:1;text-align:center;
                       filter:drop-shadow(0 3px 3px #00000066)}
  #handhint .handlabel{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
                       background:#FFF6EC;color:#3A2E27;border:1px solid #E7D3C0;border-left:4px solid var(--gold);
                       border-radius:12px;padding:6px 10px;font:800 12px/1.2 var(--font);
                       box-shadow:0 8px 20px #0000003a}
  #handhint.up{transform:translateX(-50%)}
  #handhint.up .handlabel{top:46px}
  #handhint.down{transform:translate(-50%,-100%)}
  #handhint.down .handlabel{bottom:46px}
  #handhint.up .handglyph,#handhint.down .handglyph{animation:handtap 1s ease-in-out infinite}
  #handhint.drag .handglyph{animation:handdrag 1.5s ease-in-out infinite}
  @keyframes handtap{0%,100%{transform:translateY(0)}45%{transform:translateY(7px)}}
  @keyframes handdrag{0%,16%{transform:translate(0,0)}60%,100%{transform:translate(var(--dx,26px),var(--dy,0))}}
  .coach .cico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;
               background:#FFE9CF;display:flex;align-items:center;justify-content:center;
               font-size:17px;line-height:1}
  .coach .ctxt{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:1px}
  .coach .ctxt b{font-size:12.5px;font-weight:800;color:#2C231D;letter-spacing:.2px}
  .coach .ctxt span{color:#6B5748}
  .coach .cx{flex:0 0 auto;margin-left:2px;color:#B79E8B;font-size:12px;font-weight:800;
             cursor:pointer;padding:2px 3px;align-self:flex-start}
  .coach .cx:active{color:#8A7565}

  /* ── the rare-collection tree viewer (matches the game's warm UI) ── */
  .treesheet{align-items:stretch;background:#2A1E18}
  #treeBody{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
            touch-action:pan-y;padding-bottom:12px}
  .tinfo{display:flex;align-items:flex-start;gap:10px;padding:0 2px 9px;
         font-size:11px;line-height:1.4;color:#EAD9C8}
  .tinfo .tstats{margin-left:auto;text-align:right;white-space:nowrap;line-height:1.3}
  .tinfo .tstats b{font-size:13px;font-weight:800;color:var(--gold);
                   font-variant-numeric:tabular-nums}
  .tinfo .tstats i{font-style:normal;color:#C7A87E}
  .treemap{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div id="nestcard"></div>
<div id="cratecard"></div>

<script>
/* ─────────── chickens.js ─────────── */
/* chickens.js — original parametric flat-vector chicken art. V2: outline-free.
 *
 * Geometry is authored here from primitives. Nothing is traced or derived from
 * any existing game's assets — only the broad genre idiom (flat shapes, warm
 * palette) is shared, which is style, not expression.
 *
 * V2 changes:
 *   · No strokes anywhere. Shapes read by VALUE and HUE contrast instead.
 *     That is the whole difficulty of outline-free art: adjacent fills must
 *     differ enough in lightness to separate at 56px, so every secondary shape
 *     is derived from the body colour by a fixed shade offset rather than
 *     picked by eye.
 *   · A soft ground shadow does the job the outline used to do — anchoring the
 *     bird to the cell so it doesn't float.
 *   · Brighter, more saturated rarity ramp.
 *
 * Layout, in a 104x104 viewbox:
 *   ground y=88 · body ellipse (48,58) · head circle (66,32) · beak points right
 */

/* Candy-bright rarity ramp: bone → mint → teal → sky → violet → rose → coral → gold. */
const RARITY = [
  // T1 and T2 were both near-white and read as the same bird. T2 is now a
  // clearly separate hue so the first merge you ever do is visibly a change.
  // T4 and T5 were two near-identical greens; T5 now pushes to a warm lime so
  // adjacent early tiers separate on hue, not just lightness.
  '#FCFAF5', '#B9CBE6', '#CBEFB4', '#8FD97A', '#D9E24B',
  '#3FCE9A', '#2FC7C0', '#35B4E4', '#4E93F2', '#6E7BF5',
  '#8F68EE', '#AB59E2', '#C851D0', '#E24CB4', '#F04B92',
  '#F9506B', '#FF6B45', '#FF8C2E', '#FFB020', '#FFD01F',
];

const COMB   = '#FF6B6B';
const COMB_D = '#EF5252';
const BEAK   = '#FFC44D';
const BEAK_D = '#F0A62E';
const EYE    = '#3B3230';

const clampT = t => Math.max(1, Math.min(RARITY.length, Math.round(t)));
const tierColor = t => RARITY[clampT(t) - 1];

/** Lighten (+pct) or darken (-pct) a hex colour. */
function shade(hex, pct){
  const n = parseInt(hex.slice(1), 16), f = pct / 100;
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    const nv = f >= 0 ? v + (255 - v) * f : v * (1 + f);
    return Math.max(0, Math.min(255, Math.round(nv)));
  });
  return '#' + ch.map(v => v.toString(16).padStart(2, '0')).join('');
}

/** ONE font for the whole game, art included. Every <text> in here reads the
 *  same --font custom property the stylesheet does, so the two can never drift
 *  into "the UI in one face and the numbers on the art in another". The stack is
 *  repeated as the var() fallback so a piece of art still has a face if it is
 *  ever rendered outside the page, and it stays system-only: the game opens from
 *  file:// with no network, so a webfont is not available to it. */
const FONT = 'var(--font,system-ui,-apple-system,Segoe UI,Roboto,' +
                    'Helvetica Neue,Arial,sans-serif)';

/**
 * SVG markup for a chicken of the given tier.
 * @param {number}  tier   1..20
 * @param {number}  px     rendered pixel size
 * @param {boolean} badge  draw the numeric tier badge
 */
/** The tier mark. On the BODY, not in a corner chip: white with a grey outline so
 *  it reads against every colour in the ramp without needing a backing plate.
 *  Exported because the NEST has to draw it AFTER its bowl — spliced in with the
 *  rest of the hen it ended up behind the basket and you could not read it, which
 *  defeats the point of putting the number on the nest at all. */
const tierBadge = (t, maxed = false) => `<text x="46" y="65" text-anchor="middle"
    font-family="${FONT}"
    font-weight="900" font-size="${maxed ? 19 : t > 9 ? 25 : 28}" fill="#FFFFFF"
    stroke="#6E6560" stroke-width="3.4" paint-order="stroke"
    stroke-linejoin="round">${maxed ? 'MAX' : t}</text>`;

function chickenSVG(tier, px = 72, badge = true, blinkLid = false, opts = {}){
  const t = clampT(tier);
  // A maxed animal shows "MAX" in place of its tier number. For a rare breed the
  // cap is passed in via opts.maxed; a plain chicken caps at C.tiersPerArea.
  const maxed = opts.maxed != null ? opts.maxed : (t >= C.tiersPerArea);
  // PNG seam. The badge stays a DOM element on top rather than being baked in,
  // so an art pass is 20 files and not 40.
  // `opts` recolours the same silhouette for a rare breed — see rareSVG. When a
  // colour override is present we never take the PNG path: a rare has no PNG.
  if (!opts.body && ART.chicken[t])
    return `<span class="artwrap" style="width:${px}px;height:${px}px">` +
      artImg(ART.chicken[t], px, 'art-chick') +
      (badge ? `<b class="artbadge">${maxed ? 'MAX' : t}</b>` : '') + '</span>';
  const body  = opts.body || tierColor(t);
  const combC = opts.comb  || COMB;
  const combD = opts.combD || COMB_D;
  const beakC = opts.beak  || BEAK;
  const beakD = opts.beakD || BEAK_D;
  // Fixed offsets, not hand-picked: guarantees separation at every tier.
  const wing  = shade(body, -26);
  const tailA = shade(body, -14);
  const tailB = shade(body, -32);
  const belly = shade(body, 30);
  const foot  = shade(BEAK_D, -6);
  const legs  = shade(body, -44);

  const scale = 0.86 + 0.14 * ((t - 1) / 19);

  const combBumps = 2 + Math.min(2, Math.floor((t - 1) / 7));
  const tailCount = 2 + Math.min(2, Math.floor((t - 1) / 6));
  const hasWattle = t >= 3;
  const hasCheek  = t >= 7;
  const hasScarf  = t >= 11;
  const hasCrown  = t >= 16;

  const p = [];

  /* ground shadow — replaces the outline as the anchoring device.
     NOT in `p`, and so not in the keyline pass. It used to be the first thing
     pushed into `p`, which meant keyline()'s flat pass repainted it as solid
     #8A6A4E and stroked it 3.4 wide — a hard opaque brown puck under every hen,
     nothing like the 9% black the hex says. That is what read as "heavy". */
  const shadow = `<ellipse cx="50" cy="90" rx="23" ry="4.6" fill="#00000014"/>`;

  /* tail: oval feathers fanning up-left, behind everything */
  for (let i = tailCount - 1; i >= 0; i--){
    p.push(`<g transform="rotate(${-10 - i * 25} 30 56)">
      <ellipse cx="13" cy="56" rx="18" ry="8" fill="${i % 2 ? tailB : tailA}"/></g>`);
  }

  /* legs */
  for (const lx of [43, 57]){
    p.push(`<rect x="${lx - 2.4}" y="70" width="4.8" height="17" rx="2.4" fill="${legs}"/>`);
    p.push(`<path d="M${lx} 84 l-7.5 6.5 M${lx} 84 l7.5 6.5 M${lx} 84 v6.5"
            stroke="${foot}" stroke-width="4.6" stroke-linecap="round" fill="none"/>`);
  }

  /* body + belly */
  p.push(`<ellipse cx="48" cy="58" rx="25" ry="23" fill="${body}"/>`);
  p.push(`<ellipse cx="47" cy="66" rx="18" ry="13" fill="${belly}" opacity="${badge ? 0.55 : 1}"/>`);

  /* wing */
  p.push(`<path d="M38 52 q19 -3 23 12 q-14 10 -23 1 q-4 -7 0 -13 Z" fill="${wing}"/>`);

  /* comb — drawn before the head so the head crops its base */
  const combW = 9 + combBumps * 3;
  for (let i = 0; i < combBumps; i++){
    const cx = 63 - combW / 2 + (i + 0.5) * (combW / combBumps);
    const r  = 6.8 - Math.abs(i - (combBumps - 1) / 2) * 0.8;
    p.push(`<circle cx="${cx.toFixed(1)}" cy="11.5" r="${r.toFixed(1)}" fill="${combC}"/>`);
  }
  p.push(`<rect x="${(63 - combW / 2).toFixed(1)}" y="11" width="${combW}" height="10" fill="${combC}"/>`);

  /* wattle, behind the head */
  if (hasWattle) p.push(`<path d="M75 40 q8 7 4 13 q-8 1 -9 -9 Z" fill="${combD}"/>`);

  /* head */
  p.push(`<circle cx="66" cy="32" r="18" fill="${body}"/>`);
  /* soft top-light: the only shading, and it keeps the head from merging
     into the body when both are the same fill */
  p.push(`<path d="M48 32 a18 18 0 0 1 36 0 a18 12 0 0 0 -36 0 Z" fill="${shade(body, 16)}"/>`);

  if (hasCrown){
    p.push(`<path d="M55 12.5 l3 -8.5 l4.5 5 l4 -8 l4 8 l4.5 -5 l3 8.5 Z" fill="#FFD84D"/>`);
    p.push(`<rect x="55" y="10" width="22.5" height="4" rx="2" fill="#F5C226"/>`);
  }

  /* beak — two tones so the mandibles read without a line between them */
  p.push(`<path d="M82 28.5 l15 5.8 l-15 3 Z" fill="${beakC}"/>`);
  p.push(`<path d="M82 37.3 l15 -3 l-15 5.4 Z" fill="${beakD}"/>`);

  if (hasCheek) p.push(`<ellipse cx="59" cy="40" rx="6" ry="4.5" fill="${combC}" opacity="0.34"/>`);

  /* eye */
  p.push(`<circle cx="72" cy="29.5" r="4.6" fill="${EYE}"/>`);
  p.push(`<circle cx="73.6" cy="27.9" r="1.7" fill="#FFFFFF"/>`);
  // The eyelid, same colour as the head so a blink reads as the eye closing
  // rather than a black square appearing. Kept in the scaled group so it lands on
  // the eye at every tier. Animated by CSS; opacity 0 until then.
  if (blinkLid)
    p.push(`<rect class="henblink" x="66.8" y="24.4" width="10.4" height="10.2" rx="2.6"
            fill="${shade(body, 6)}" opacity="0"/>`);

  if (hasScarf){
    p.push(`<path d="M53 46.5 q13 9 25 1 l0 5 q-12 8 -25 -1 Z" fill="${shade(body, -46)}"/>`);
  }

  if (badge) p.push(tierBadge(t, maxed));

  // The badge is deliberately EXCLUDED from the keyline pass: it already carries
  // its own grey outline, and stacking a second one turns the digit to mush.
  const badgeMark = badge ? p.pop() : '';
  // A rare breed's identity mark, kept OUT of the keyline pass (it carries its
  // own outline) and drawn over the finished bird — see BRANCHES.
  const emblem = opts.emblem || '';
  return `<svg viewBox="0 0 104 104" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(52 56) scale(${scale.toFixed(3)}) translate(-52 -56)"
       >${shadow}${keyline(p.join(''))}${emblem}${badgeMark}</g>
  </svg>`;
}

/* ─────────────────── the fire slime (MUTATION) ───────────────────
 * A second breed, and it has to read as NOT-A-CHICKEN at 60px or the board turns
 * into a bag of coloured blobs you cannot parse. Three things separate it: the
 * silhouette is a dome rather than a bird, it has a flame tuft instead of a comb,
 * and it BREATHES on a slow 2.2s cycle while the hens hold still. The colour ramp
 * runs ember -> hot -> plasma so a tier-8 slime reads as the hottest thing on the
 * board rather than just a different hue.
 *
 * Same primitive-shape construction as the chickens, same keyline pass, same
 * viewbox, so a slime and a hen sit in an identical cell box.
 */
const SLIME_RAMP = ['#FF9A3C', '#FF7A2A', '#FF5722', '#F5333C',
                    '#FF2E7A', '#C044FF', '#4A93FF', '#63E8FF'];
const clampS = t => Math.max(1, Math.min(SLIME_RAMP.length, Math.round(t)));
const slimeColor = t => SLIME_RAMP[clampS(t) - 1];
const SLIME_TIERS = SLIME_RAMP.length;

/** The slime's tier mark. Sits UNDER the face rather than across it — the badge
 *  position the chickens use (y=65) lands right between a slime's eyes. */
const slimeBadge = (t, maxed = false) => `<text x="52" y="80" text-anchor="middle"
    font-family="${FONT}" font-weight="900" font-size="${maxed ? 15 : t > 9 ? 19 : 21}"
    fill="#FFFFFF" stroke="#6E6560" stroke-width="3.2" paint-order="stroke"
    stroke-linejoin="round">${maxed ? 'MAX' : t}</text>`;

function slimeSVG(tier = 1, px = 62, badge = true){
  const t = clampS(tier);
  const maxed = t >= slimeMaxTier();
  if (ART.slime && ART.slime[t])
    return `<span class="artwrap" style="width:${px}px;height:${px}px">` +
      artImg(ART.slime[t], px, 'art-slime') +
      (badge ? `<b class="artbadge">${maxed ? 'MAX' : t}</b>` : '') + '</span>';
  const body = slimeColor(t);
  const deep = shade(body, -30);
  const lit  = shade(body, 42);
  const p = [];
  /* the jelly: a dome with a heavy, slightly overhanging base so it reads as
     something soft resting on the tile rather than a painted semicircle */
  p.push(`<path d="M22 64 c0 -23 13 -40 30 -40 c17 0 30 17 30 40
                   c0 13 -9 20 -30 20 c-21 0 -30 -7 -30 -20 Z" fill="${body}"/>`);
  /* a darker belly band, which is what stops the blob looking flat without
     needing a gradient (gradients cost an id, and ids collide when the same art
     is stamped twenty times into one document) */
  p.push(`<path d="M23 70 c6 9 52 9 58 0 c0 10 -9 14 -29 14 c-20 0 -29 -4 -29 -14 Z"
          fill="${deep}"/>`);
  /* the wet highlight */
  p.push(`<ellipse cx="40" cy="45" rx="7.5" ry="11" fill="${lit}" opacity=".85"
          transform="rotate(-20 40 45)"/>`);
  p.push(`<circle cx="63" cy="41" r="3.2" fill="#FFFFFF" opacity=".7"/>`);
  /* the flame tuft — the one shape that says "fire" and the thing that reads
     instead of a comb at thumbnail size */
  p.push(`<path d="M52 8 c6 8 11 13 11 19 c0 6 -5 10 -11 10 c-6 0 -11 -4 -11 -10
                   c0 -6 5 -11 11 -19 Z" fill="#FFD34D"/>`);
  p.push(`<path d="M52 17 c3 4 5 7 5 10 c0 3 -2 5 -5 5 c-3 0 -5 -2 -5 -5
                   c0 -3 2 -6 5 -10 Z" fill="#FFF3C4"/>`);
  /* face */
  p.push(`<ellipse cx="43" cy="53" rx="4.4" ry="5" fill="${EYE}"/>`);
  p.push(`<ellipse cx="61" cy="53" rx="4.4" ry="5" fill="${EYE}"/>`);
  p.push(`<circle cx="44.4" cy="51.2" r="1.6" fill="#FFFFFF"/>`);
  p.push(`<circle cx="62.4" cy="51.2" r="1.6" fill="#FFFFFF"/>`);
  p.push(`<path d="M46 63 q6 6 12 0" stroke="${EYE}" stroke-width="2.6" fill="none"
          stroke-linecap="round"/>`);
  const shadow = `<ellipse cx="52" cy="88" rx="24" ry="5" fill="#00000018"/>`;
  /* `slimeidle` is the slow bounce, in CSS so it survives every board redraw */
  return `<svg viewBox="0 0 104 104" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">
    ${shadow}
    <g class="slimeidle">${keyline(p.join(''))}${badge ? slimeBadge(t, maxed) : ''}</g>
  </svg>`;
}

/* ═════════════════════ RARE BRANCHES — the tree ═════════════════════
 * A third way to be a breed. The fire slime proved the pattern: a separate
 * `kind`, its own ladder, its own art, and it ARRIVES as a bonus beside a merge
 * rather than being laid or bought. Rares are that pattern made data-driven and
 * made into a TREE — the hen trunk forks into rares, and a rare's own merges can
 * fork AGAIN into a sub-rare.
 *
 * Each row is one branch:
 *   from      the kind whose merge can drop this branch's tier-1 seed
 *   forkTier  the tier you must merge INTO for the roll to happen
 *   chance    probability of the drop on such a merge
 *   max       length of this branch's own ladder
 *   ramp      one body colour per tier (1..max)
 *   comb/beak optional accent overrides, to push identity past hue alone
 *   emblem    a small mark stamped on the bird so breeds separate at 60px
 *   glyph/name/short   used by toasts and the collection viewer
 *
 * TRIMMED v1: three trunk branches, and Galaxy forks once more into Nebula, so a
 * genuine branch-of-a-branch exists. Add rows here to grow the tree; nothing
 * else needs to change.
 */
const EMBLEM = {
  star:  `<g transform="translate(15 11)"><path d="M8 0 l2.1 5 5.4.5 -4.1 3.6 1.3 5.3 -4.7 -2.9 -4.7 2.9 1.3 -5.3 -4.1 -3.6 5.4 -.5 Z" fill="#FFE27A" stroke="#3B2A66" stroke-width="1.5" stroke-linejoin="round"/></g>`,
  flake: `<g transform="translate(21 15)" fill="none" stroke-linecap="round"><path d="M0 -9V9M-7.8 -4.5L7.8 4.5M-7.8 4.5L7.8 -4.5" stroke="#274a6e" stroke-width="3.6"/><path d="M0 -9V9M-7.8 -4.5L7.8 4.5M-7.8 4.5L7.8 -4.5" stroke="#F2FBFF" stroke-width="1.6"/></g>`,
  bolt:  `<g transform="translate(15 9)"><path d="M9 0 L2 12 L7.5 12 L4 21 L15 8 L9.5 8 Z" fill="#FFE24A" stroke="#2C2350" stroke-width="1.5" stroke-linejoin="round"/></g>`,
  spark: `<g transform="translate(16 11)"><path d="M6 0 L7.5 4.3 12 5.8 7.5 7.3 6 12 4.5 7.3 0 5.8 4.5 4.3 Z" fill="#FFD6F4" stroke="#5B2E7A" stroke-width="1.4" stroke-linejoin="round"/></g>`,
};

const BRANCHES = {
  galaxy: {
    name: 'Galaxy Rooster', short: 'Galaxy', glyph: '\u{1F30C}',
    from: 'chicken', forkTier: 3, chance: 0.04, max: 5,
    ramp: ['#4A2E8C', '#6A3FC0', '#8A54E6', '#A877F0', '#C9A6FF'],
    comb: '#FF6FB0', combD: '#E2559A', emblem: EMBLEM.star,
  },
  frost: {
    name: 'Frost Fowl', short: 'Frost', glyph: '\u{2744}',
    from: 'chicken', forkTier: 6, chance: 0.13, max: 4,   // tuned: T6 merges are ~8x rarer than T3, so the chance is raised to compensate
    ramp: ['#3E7FB8', '#4E96CE', '#69B2E2', '#8CCBEE', '#B0DEF6'],
    comb: '#CDEBFF', combD: '#96C9E6', emblem: EMBLEM.flake,
  },
  storm: {
    name: 'Storm Rooster', short: 'Storm', glyph: '\u{26A1}',
    from: 'chicken', forkTier: 9, chance: 0.32, max: 4,   // tuned: T9 merges are very rare events, so a high per-event chance keeps Storm actually reachable
    ramp: ['#37406B', '#464F86', '#5A63A8', '#7A6FD0', '#9E8CF0'],
    comb: '#FFD24A', combD: '#F0B41E', emblem: EMBLEM.bolt,
  },
  // The branch-of-a-branch: Galaxy roosters merged up can fork into Nebula.
  nebula: {
    name: 'Nebula Chick', short: 'Nebula', glyph: '\u{2728}',
    from: 'galaxy', forkTier: 2, chance: 0.22, max: 3,    // tuned: forks off Galaxy T2 (needs only 2 Galaxies) so the sub-rare is attainable
    ramp: ['#8A3E9E', '#B455C8', '#E07AE6'], emblem: EMBLEM.spark,
  },
};

const RARE_KEYS = Object.keys(BRANCHES);
const isRare = kind => Object.prototype.hasOwnProperty.call(BRANCHES, kind);
const isCreature = kind => kind === 'chicken' || kind === 'slime' || isRare(kind);
const branchesFrom = kind => RARE_KEYS.filter(k => BRANCHES[k].from === kind);
const rarePct = n => {
  const v = n * 100;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + '%';
};

/** A rare breed, drawn on the chicken silhouette in the branch's colours with
 *  its identity emblem stamped on. Reusing the hen construction is deliberate:
 *  that shape is already tuned to read at 60px, and a recolour keeps every rare
 *  sitting in an identical cell box to the hens and slimes. */
function rareSVG(kind, tier = 1, px = 62, badge = true){
  const b = BRANCHES[kind];
  const t = Math.max(1, Math.min(b.max, Math.round(tier)));
  return chickenSVG(t, px, badge, false, {
    body: b.ramp[t - 1],
    comb: b.comb, combD: b.combD, beak: b.beak, beakD: b.beakD,
    emblem: b.emblem,
    maxed: t >= b.max,
  });
}

/** One door for "draw whatever this cell is". */
function speciesSVG(kind, tier, px = 62, badge = true){
  if (kind === 'slime') return slimeSVG(tier, px, badge);
  if (isRare(kind))     return rareSVG(kind, tier, px, badge);
  return chickenSVG(tier, px, badge);
}

/* ─────────────────── the crate ───────────────────
 * Four board cells folded into one. It has to look like STORAGE and not like a
 * piece you can merge, so: hard straight edges where everything else in the game
 * is a rounded organic blob, and a visible fill gauge rather than a tier number.
 */
/** Mini egg shells for the crate's contents. Same three variant colours as the
 *  board eggs, so a gold egg you rescued from the carton is visibly still gold
 *  while it sits in storage — the whole point of a crate is that the egg is KEPT
 *  rather than converted, and that reads best when you can see which ones. */
const MINI_EGG = { normal: ['#FFFCF4', '#E7DFCE'], silver: ['#C4CBD4', '#9FB0C2'],
                   gold: ['#E8A427', '#BE7F14'], slime: ['#FF9A3C', '#D9721F'] };
const miniEgg = (x, y, r, kind) => {
  const [body, shade2] = MINI_EGG[kind] || MINI_EGG.normal;
  return `<g transform="translate(${x} ${y})">
    <path d="M0 ${-r * 1.32} c${r * .95} 0 ${r * 1.05} ${r * .95} ${r * 1.05} ${r * 1.5}
             c0 ${r * .72} -${r * .78} ${r * 1.14} -${r * 1.05} ${r * 1.14}
             c-${r * .27} 0 -${r * 1.05} -${r * .42} -${r * 1.05} -${r * 1.14}
             c0 -${r * .55} ${r * .1} -${r * 1.5} ${r * 1.05} -${r * 1.5} Z"
          fill="${body}" stroke="${shade2}" stroke-width="1.1"/></g>`;
};

function crateSVG(px = 62, count = 0, cap = 4, kinds = null){
  if (ART.ui.crate)
    return `<span class="artwrap" style="width:${px}px;height:${px}px">` +
      artImg(ART.ui.crate, px, 'art-crate') + '</span>';
  const WOOD = '#C08A4E', WOOD_D = '#9C6B37', WOOD_L = '#D9A868', BAND = '#8A5A2C';
  const full = count >= cap;
  const p = [];
  p.push(`<rect x="18" y="34" width="68" height="52" rx="5" fill="${WOOD}"/>`);
  /* planks: two grooves, so the box has thickness without an outline */
  p.push(`<rect x="18" y="34" width="68" height="9" rx="4" fill="${WOOD_L}"/>`);
  p.push(`<rect x="18" y="52" width="68" height="3.4" fill="${WOOD_D}"/>`);
  p.push(`<rect x="18" y="70" width="68" height="3.4" fill="${WOOD_D}"/>`);
  /* cross braces — the shape everybody reads as "crate" */
  p.push(`<path d="M22 82 L82 40 M22 40 L82 82" stroke="${WOOD_D}" stroke-width="5"
          stroke-linecap="round" fill="none" opacity=".55"/>`);
  p.push(`<rect x="18" y="34" width="68" height="52" rx="5" fill="none"
          stroke="${BAND}" stroke-width="4"/>`);
  const art = keyline(p.join(''), '#7A4E24', 3.2);
  /* THE EGGS, drawn OVER the box. An egg crate that does not visibly hold eggs is
     just a box, and the fill gauge underneath was doing all the work of telling you
     it had anything in it. Laid out in a fixed 4-wide grid so an egg always appears
     in the same cell as the crate fills — a re-flowing arrangement makes a single
     new egg look like the whole contents shifted.
     The grid is sized from CAPACITY, not from the count, for the same reason: an
     upgraded crate should visibly have more room, not the same eggs drawn bigger. */
  let eggs = '';
  if (count > 0){
    const cols = 4;
    const rows = Math.max(1, Math.ceil(Math.max(cap, 1) / cols));
    const boxX = 24, boxY = 40, boxW = 56, boxH = 40;
    const cw = boxW / cols, ch = boxH / rows;
    const r = Math.max(3.2, Math.min(cw, ch) * 0.38);
    for (let k = 0; k < Math.min(count, cap); k++){
      const cx = boxX + (k % cols + 0.5) * cw;
      const cy = boxY + (Math.floor(k / cols) + 0.55) * ch;
      eggs += miniEgg(cx.toFixed(1), cy.toFixed(1), r, kinds?.[k] || 'normal');
    }
  }
  /* the gauge. A count, not a tier: a crate is a container and the only thing
     you need off the tile is how much room is left in it. */
  const gauge = `<g>
    <rect x="20" y="88" width="64" height="13" rx="6.5" fill="#00000038"/>
    <rect x="20" y="88" width="${(64 * Math.min(1, cap ? count / cap : 0)).toFixed(1)}"
          height="13" rx="6.5" fill="${full ? '#FF9330' : '#3FCE9A'}"/>
    <text x="52" y="99" text-anchor="middle" font-family="${FONT}" font-size="12.5"
          font-weight="900" fill="#FFFFFF" stroke="#00000066" stroke-width="2.6"
          paint-order="stroke">${count}/${cap}</text>
  </g>`;
  return `<svg viewBox="0 0 104 104" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="52" cy="90" rx="26" ry="5" fill="#00000018"/>
    ${art}${eggs}${gauge}
  </svg>`;
}

/** A small crate, for the reward marker on the end of an unlockable board row.
 *  White keyline so it reads on the dashed locked tile it sits on. */
function crateBadgeSVG(px = 30){
  return `<svg viewBox="0 0 32 32" width="${px}" height="${px}" style="display:block">
    <rect x="3" y="7" width="26" height="21" rx="3" fill="#C08A4E"
          stroke="#FFFFFF" stroke-width="3" paint-order="stroke"/>
    <rect x="3" y="7" width="26" height="4.5" rx="2" fill="#D9A868"/>
    <path d="M5 26 L27 11 M5 11 L27 26" stroke="#9C6B37" stroke-width="2.4"
          stroke-linecap="round" opacity=".6"/>
  </svg>`;
}

/** Put a keyline around a piece of art.
 *
 *  Done as a SILHOUETTE PASS, not a stroke on every path: the art is drawn twice,
 *  the lower copy with every fill AND stroke forced to the keyline colour so the
 *  shapes merge into one solid blob slightly larger than the piece, then the real
 *  art on top. Stroking each path individually outlines the eye, the cheek and the
 *  belly highlight too, which reads as dirt around the beak — I tried it.
 *
 *  Why bother: a white tier-1 hen on a light tile is 1.07:1 against its own cell.
 *  Deepening the tile fixes that one case; a keyline makes every piece legible on
 *  ANY background, including whatever Area 2 turns out to be. */
function keyline(inner, colour = '#8A6A4E', w = 3.4){
  const flat = inner
    .replace(/fill="[^"]*"/g, `fill="${colour}"`)
    .replace(/stroke="[^"]*"/g, `stroke="${colour}"`)
    .replace(/opacity="[^"]*"/g, 'opacity="1"')
    .replace(/fill-opacity="[^"]*"/g, 'fill-opacity="1"');
  return `<g stroke="${colour}" stroke-width="${w}" stroke-linejoin="round"
             stroke-linecap="round">${flat}</g>${inner}`;
}

/** Egg with a segmented crack bar.
 *  Each segment is cleared by a tap OR by the auto timer — same visual either
 *  way, so tapping reads as "hurrying it along" rather than a separate action.
 *  The bar is horizontal and uses the nest colours so the two progress
 *  affordances in the game look like the same idea. */
/** Egg shells by variant. `kind` is 'normal' | 'silver' | 'gold' (a bare
 *  boolean still works and means gold, for anything that has not been updated).
 *  Gold gets the premium treatment — a warmer two-stop body, a bright rim, a
 *  sweeping specular highlight and a sparkle — but note the CELL BOX around it
 *  is deliberately unchanged, so the board reads as one grid of eggs with a
 *  rare beautiful one in it rather than three different objects. */
const EGG_SKIN = {
  normal: { body:'#FFFCF4', lit:'#FFFFFF', rim:null,      bar:'#3FCE9A', crack:null },
  silver: { body:'#C4CBD4', lit:'#EDF1F5', rim:'#FFFFFF', bar:'#8FA3B8', crack:'#7A8794' },
  gold:   { body:'#E8A427', lit:'#FFD870', rim:'#FFF3C4', bar:'#2C97DA', crack:'#A9741A' },
};

function eggSVG(px = 60, segsCleared = 0, segs = 4, frac = 0, kind = 'normal'){
  if (kind === true) kind = 'gold';
  if (kind === false) kind = 'normal';
  const skin = EGG_SKIN[kind] || EGG_SKIN.normal;
  const golden = kind === 'gold';
  const done = Math.max(0, Math.min(segs, segsCleared));
  {
    // PNG seam. The four crack stages become four sprites; the smooth
    // sub-segment fill stays a DOM bar because an image cannot tween.
    const art = eggArtFor(done, kind);
    if (art){
      const fr = Math.max(0, Math.min(1, frac));
      let b = '';
      for (let i = 0; i < segs; i++)
        b += `<i${i < done ? ' class="on"' : i === done ? ' class="live"' : ''}` +
             `${i === done ? ` style="--f:${fr.toFixed(3)}"` : ''}></i>`;
      return `<span class="artwrap arteggwrap ${kind}" style="width:${px}px;height:${px}px">` +
             artImg(art, px, 'art-egg') + `<span class="artbar">${b}</span></span>`;
    }
  }
  const f = Math.max(0, Math.min(1, frac));
  const gap = 3, W = 76, x0 = 14;
  const segW = (W - gap * (segs - 1)) / segs;
  let bar = '';
  for (let i = 0; i < segs; i++){
    const x = x0 + i * (segW + gap);
    bar += `<rect x="${x.toFixed(1)}" y="90" width="${segW.toFixed(1)}" height="9" rx="3"
             fill="#00000016"/>`;
    if (i < done)
      bar += `<rect x="${x.toFixed(1)}" y="90" width="${segW.toFixed(1)}" height="9" rx="3"
               fill="${skin.bar}"/>`;
    else if (i === done)
      // the live segment fills SMOOTHLY rather than snapping, so the bar shows
      // continuous progress and the tap reads as skipping ahead
      bar += `<rect class="eggpart" data-w="${segW.toFixed(1)}" x="${x.toFixed(1)}" y="90"
               width="${(segW * f).toFixed(2)}" height="9" rx="3" fill="${skin.bar}"/>`;
  }
  const cracks = [
    'M40 40 l7 5 l-5 6',
    'M62 36 l-6 6 l6 5',
    'M44 56 l8 4 l-4 7',
  ].slice(0, Math.max(0, done - 1));
  const SHELL = `<path d="M52 12 c13 0 23 17 23 31 c0 13 -10 23 -23 23 c-13 0 -23 -10 -23 -23 c0 -14 10 -31 23 -31 Z"
          fill="${skin.body}"/>`;
  return `<svg viewBox="0 0 104 104" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="52" cy="84" rx="19" ry="4.2" fill="#00000012"/>
    ${keyline(SHELL, '#8A6A4E', 3.2)}
    <path d="M52 12 c-13 0 -23 17 -23 31 c0 6 2 11 6 15 c-2 -4 -3 -9 -3 -14 c0 -14 8 -29 20 -32 Z"
          fill="${skin.lit}"/>
    ${skin.rim ? `<path d="M52 12 c13 0 23 17 23 31 c0 13 -10 23 -23 23 c-13 0 -23 -10 -23 -23 c0 -14 10 -31 23 -31 Z"
          fill="none" stroke="${skin.rim}" stroke-width="2" opacity=".55"/>` : ''}
    ${kind !== 'normal' ? `<path d="M44 21 c-5 5 -8 12 -9 19" stroke="${skin.rim}" stroke-width="4"
          fill="none" stroke-linecap="round" opacity=".9"/>` : ''}
    ${golden ? `<g class="eggshine">
        <path d="M60 16 c8 5 13 15 14 26" stroke="#FFF9E0" stroke-width="3" fill="none"
              stroke-linecap="round" opacity=".55"/>
        <path d="M38 30 l3.4 7 l7 3.4 l-7 3.4 l-3.4 7 l-3.4 -7 l-7 -3.4 l7 -3.4 Z"
              fill="#FFFBEA" opacity=".95"/>
      </g>` : ''}
    ${cracks.map(d => `<path d="${d}" stroke="${skin.crack || BEAK_D}" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
    <path d="M40 47 q6 -5 12 1 q6 6 12 -1" stroke="${BEAK_D}" stroke-width="3.4" fill="none"
          stroke-linecap="round" opacity="${(0.12 + (done / segs) * 0.88).toFixed(2)}"/>
    <g class="eggbar">${bar}</g>
  </svg>`;
}

/** The coin. FLAT, and the same footprint as the gem.
 *  It used to be a CSS radial-gradient sphere — the only 3D-shaded object in a
 *  game of flat shapes, and it made the two wallet pills look like different
 *  systems. The egg stamp is because this is an egg game; a plain disc reads as
 *  generic currency. */
function coinSVG(px = 16, ring = false){
  if (ART.ui.coin) return artImg(ART.ui.coin, px, 'art-coin');
  const art = `<circle cx="16" cy="16" r="15" fill="#D2941A"/>
    <circle cx="16" cy="16" r="12.4" fill="#F7BE2E"/>
    <path d="M16 3.6 A12.4 12.4 0 0 1 28.4 16 L16 16 Z" fill="#FFD86B"/>
    <path d="M16 8.6 c3.4 0 5.9 4.3 5.9 7.9 c0 3.3 -2.6 5.6 -5.9 5.6
             c-3.3 0 -5.9 -2.3 -5.9 -5.6 c0 -3.6 2.5 -7.9 5.9 -7.9 Z"
          fill="#C9891A" opacity=".62"/>`;
  // `ring` is the white keyline the coin wants on a green or blue button. It has
  // to live INSIDE the svg: the old sphere was a border-radius circle so a CSS
  // box-shadow ringed it neatly, but a square <svg> box gets a square halo.
  // Ring is laid down first and the art, scaled in, covers its inner half.
  // `.coinsvg` exists so the button rules that stroke a GEM's paths white can
  // say `.gemsvg path` and leave the coin's highlight and egg stamp alone.
  return `<svg class="coinsvg" viewBox="0 0 32 32" width="${px}" height="${px}"
               xmlns="http://www.w3.org/2000/svg" style="display:block">
    ${ring ? `<circle cx="16" cy="16" r="14.4" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
              <g transform="translate(16 16) scale(.855) translate(-16 -16)">${art}</g>`
           : art}
  </svg>`;
}

/** The gem. A DIAMOND, everywhere it appears — HUD, buttons, reward labels.
 *  One symbol, one meaning; a circle in one place and a rhombus in another
 *  reads as two different currencies. */
function gemSVG(px = 16){
  if (ART.ui.gem) return artImg(ART.ui.gem, px, 'art-gem');
  return `<svg class="gemsvg" viewBox="0 0 32 32" width="${px}" height="${px}"
               xmlns="http://www.w3.org/2000/svg" style="display:block">
    <path d="M16 2 L30 16 L16 30 L2 16 Z" fill="#9B4FDC"/>
    <path d="M16 2 L30 16 L16 16 Z" fill="#D9A8FF"/>
    <path d="M16 2 L2 16 L16 16 Z" fill="#B571EC"/>
    <path d="M2 16 L16 30 L16 16 Z" fill="#9B4FDC"/>
    <path d="M30 16 L16 30 L16 16 Z" fill="#7A34B8"/>
  </svg>`;
}

/** Nest — empty, or cradling a chicken, with a lay-progress bar. */
/** The bowl upgrades with every star, so how far a nest has come is readable
 *  across the board without opening its card. Three fills and two stitch strokes. */
const BOWL_BY_STAR = [
  { base:'#B98A52', lit:'#CBA070', stitch:'#96662E' },   // bare twigs
  { base:'#E0A85C', lit:'#F0C078', stitch:'#C98A3C' },   // woven straw
  { base:'#EBC489', lit:'#FADDAE', stitch:'#D2A257' },   // pale reed
  { base:'#EFC65C', lit:'#FFE9A8', stitch:'#C79A24' },   // gilded
];

function nestSVG(px = 92, tier = null, progress = 0, label = '', stars = 0,
                        kind = 'chicken'){
  // `kind` is the OCCUPANT's species. A slime can sit in a nest and lay its own
  // breed, so the bowl has to be able to cradle either — and it must be visibly
  // a slime in there, or a nest laying ten-times-slower eggs looks broken.
  const slimed = kind === 'slime';
  const rareK  = isRare(kind);
  const occupant = (t, size, badge) =>
    slimed ? slimeSVG(t, size, badge) : rareK ? rareSVG(kind, t, size, badge) : chickenSVG(t, size, badge);
  // The SVG version splices the chicken INSIDE itself so the bowl paints over
  // her legs. Images cannot be spliced, so the PNG path stacks three layers:
  // back bowl, hen, front bowl — which is why assets/nests wants nest_bowl.
  if (ART.nest.empty){
    const q = Math.max(0, Math.min(1, progress));
    return `<span class="artwrap nest" style="width:${px}px;height:${px}px">` +
      artImg(ART.nest.empty, px, 'art-nest-back') +
      (tier != null ? `<span class="art-nest-hen">${occupant(tier, Math.round(px * 0.74), false)}</span>` : '') +
      (ART.nest.bowl ? artImg(ART.nest.bowl, px, 'art-nest-front') : '') +
      `<span class="artbar nestbarwrap"><i style="--f:${q.toFixed(3)}"></i></span>` +
      (label ? `<b class="artnestlab">${label}</b>` : '') + '</span>';
  }
  const q = Math.max(0, Math.min(1, progress));
  const bowl = BOWL_BY_STAR[Math.max(0, Math.min(3, stars | 0))];
  // FULL SIZE and drawn first, so the bowl paints over her lower half and she
  // reads as sitting IN the nest rather than perched on top of a bowl. The
  // shrunk-and-lifted version made every hen look like an ornament.
  // `henidle` drives the breathe / glance loop and `henblink` the eyelid — both
  // in CSS, so they cost nothing per frame and survive every board redraw. The
  // hop on laying is a class the game adds to the tile (see queueFx 'laid').
  // A slime is spliced in the same way but drawn by slimeSVG, and it keeps its own
  // `slimeidle` bounce rather than borrowing the hen's breathe/glance loop.
  const inner = tier && slimed
    ? `<g transform="translate(0 -6) scale(0.92) translate(4 4)">
         ${(ART.slime && ART.slime[clampS(tier)]
        ? `<image href="${ART.slime[clampS(tier)]}" x="16" y="8" width="72" height="72"
                 preserveAspectRatio="xMidYMid meet"/>`
        : slimeSVG(tier, 104, false).replace(/<\/?svg[^>]*>/g, ''))}
       </g>`
    : tier && rareK
    ? `<g class="henidle" transform="translate(0 -4)">${rareSVG(kind, tier, 104, false).replace(/<\/?svg[^>]*>/g, '')}</g>`
    : tier
    ? `<g class="henidle" transform="translate(0 -4)">
         ${(ART.chicken[clampT(tier)]
        // A PNG hen cannot be spliced into the nest's SVG the way the vector
        // one is — the stripped markup is HTML and an <svg> will not render it,
        // which showed up as a nest with a timer and no bird. <image> is the
        // SVG-native equivalent and keeps the bowl painting over her legs.
        ? `<image href="${ART.chicken[clampT(tier)]}" x="16" y="8" width="72" height="72"
                 preserveAspectRatio="xMidYMid meet"/>`
        : chickenSVG(tier, 104, false, true).replace(/<\/?svg[^>]*>/g, ''))}
       </g>`
    : '';
  return `<svg viewBox="0 0 104 104" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">
    ${inner}
    <path d="M13 61 q39 -14 78 0 l-9 24 q-30 8 -60 0 Z" fill="${bowl.base}"/>
    <path d="M13 61 q39 -14 78 0 l-2 6 q-37 -12 -74 0 Z" fill="${bowl.lit}"/>
    <path d="M22 72 q30 -9 60 0" stroke="${bowl.stitch}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M32 79 q20 -6 40 0" stroke="${bowl.stitch}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    ${stars >= 3 ? '<path d="M13 61 q39 -14 78 0 l-9 24 q-30 8 -60 0 Z" fill="none" stroke="#FFF3C9" stroke-width="2.5" opacity=".9"/>' : ''}
    ${tier ? `<g transform="translate(0 -6)">${
        // tierBadge for BOTH species, deliberately. slimeBadge sits low on the
        // slime's body (y=80) so that on the board it clears the face — but the
        // bowl covers everything below y=61, so in a nest that position is hidden

               : tierBadge(clampT(tier), tier >= speciesMax(kind))}</g>` : ''}

        font-family="${FONT}" font-size="16.8" font-weight="900"
