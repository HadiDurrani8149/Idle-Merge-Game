/* ─────────── art.js ─────────── */
/* art.js — the PNG seam.
 *
 * Deliberately modelled on the SAMPLES seam in sound.js, which already works
 * this way: put a file in the registry and it replaces the generated version;
 * leave the slot empty and the parametric SVG draws as it always did.
 *
 * You never edit this file to add art. `build.js` scans ../assets/ and injects
 * the manifest at /*__ASSETS__*\/ below, so adding a PNG is: drop the file in
 * the right folder with the right name, rebuild. A slot with no file falls back
 * to SVG, so a half-finished art pass renders fine — three painted chickens and
 * seventeen drawn ones is a valid build.
 *
 * ── naming ────────────────────────────────────────────────────────────────
 *   assets/chickens/chicken_01.png … chicken_20.png    one per tier
 *   assets/slimes/slime_01.png … slime_08.png          one per SLIME tier
 *   assets/eggs/egg_whole.png                          no cracks yet
 *   assets/eggs/egg_c1.png … egg_c4.png                1-4 segments cracked
 *   assets/eggs/egg_golden.png                         gold shell, uncracked
 *   assets/eggs/egg_golden_c1.png … _c4.png            gold, cracked
 *   assets/nests/nest_empty.png                        the bowl, no hen
 *   assets/nests/nest_bowl.png                         the bowl FRONT layer,
 *                                                      painted over the hen
 *   assets/ui/gem.png  ui/coin.png  ui/feather.png  ui/crate.png
 *   assets/sfx/<cue>.mp3   (or .ogg/.wav) — cue names are in CUE_NAMES
 *
 * Square images. 256px is plenty; the largest on-screen use is 132px at 2x.
 * Transparent background. The tier badge is NOT baked in — it stays a DOM
 * element, so you do not need a second set of twenty without it.
 *
 * ── the three things PNGs cannot do that the SVG did ──────────────────────
 * 1. The nest splices the chicken INSIDE its own SVG so the bowl paints over
 *    her legs. With images that is two stacked layers, which is why there is a
 *    separate `nest_bowl` front plate above.
 * 2. Chicken colour, shading and a 0.86->1.00 size ramp were all computed from
 *    the tier at draw time. Pre-bake them: what you supply is what shows.
 * 3. The ad monkey animates its arms, legs and shadow as separate SVG groups.
 *    It has no PNG slot and stays vector.
 */

const ART = {
  chicken: {},      // tier -> url
  slime:   {},      // tier -> url   (assets/slimes/slime_01.png … slime_08.png)
  egg:     {},      // 'whole' | 'c1'..'c4' | 'silver' | 'silver_c1'.. | 'gold' | 'gold_c1'..
  nest:    {},      // 'empty' | 'bowl'
  ui:      {},      // 'gem' | 'coin' | 'feather' | 'crate'
  sfx:     {},      // cue name -> url, copied into SAMPLES at boot
};

Object.assign(ART, {
  "chicken": {},
  "slime": {},
  "egg": {},
  "nest": {},
  "ui": {},
  "sfx": {}
});

/** An <img> that obeys the same sizing contract the SVGs did.
 *  `.artimg` is styled alongside every `... svg` rule in the template, so a
 *  swapped asset lands in exactly the box its SVG occupied. draggable=false
 *  matters: a native image drag hijacks pointer capture and kills the merge
 *  gesture on desktop. */
const artImg = (src, px, cls = '') =>
  `<img class="artimg ${cls}" src="${src}" width="${px}" height="${px}"
        draggable="false" alt="">`;

/** Which egg asset a given crack state wants, or null to fall back to SVG.
 *  `kind` is 'normal' | 'silver' | 'gold'. Crack sprites are optional — supply
 *  just the three whole eggs and every stage reuses them. */
function eggArtFor(done, kind = 'normal'){
  const stem = kind === 'gold' ? 'gold' : kind === 'silver' ? 'silver' : '';
  const pre = stem ? stem + '_' : '';
  return (done > 0 ? ART.egg[`${pre}c${done}`] : null)
      || ART.egg[stem || 'whole']
      || (stem ? null : ART.egg.whole)
      || null;
}

/** Copy any supplied sound files into sound.js's SAMPLES seam.
 *  Called once at boot. Unset cues keep synthesising, exactly as before. */
function installArtSamples(){
  if (typeof SAMPLES === 'undefined') return;
  for (const [cue, url] of Object.entries(ART.sfx)) SAMPLES[cue] = url;
}


/* ─────────── economy.js ─────────── */
/* economy.js — JS port of EconomyMath.cs.
 *
 * Reads the SAME economy_config JSON schema as the Unity build and the
 * workbook. Verified against both by verify_parity.py — 155 checks.
 * If you change a curve here, change it in EconomyMath.cs too.
 */

const DEFAULT_CONFIG = {
  schemaVersion: "1.0.0",
  label: "default (model-fitted)",

  // session & time
  sessionsPerDay: 3.5,
  activeMinutesPerSession: 5.0,
  offlineCapHours: 2.0,
  offlineRate: 0.40,

  // ladder
  // TWENTY, and there is no win any more. V31 ended the run at tier 10 with an
  // AREA COMPLETE screen; V4 removes the win condition entirely and lets the
  // ladder run the full length of the authored art (RARITY in chickens.js is
  // exactly 20 colours, so 20 is where "endless" actually stops being drawable).
  // Nothing gates the player out at the top — a tier-20 bird simply has nothing
  // left to merge with, the same way it always did at 10.
  tiersPerArea: 20,
  mergeRatio: 2,
  // The floor MUST rise once per tier, not once per two. At every-2 the merge
  // window widens without bound (tier 20 costs 8,192 floor-hatches), which the
  // 30-day spreadsheet absorbs because it assumes thousands of eggs a day — but
  // a hand-played 16-cell board walls hard at tier 8, so the high-tier
  // customers and their big gem payouts are never reachable. At every-1 the
  // window stays bounded and the ladder completes.
  // Two consequences, both deliberate and both for the rebalance pass:
  //   1. Per-tier cost is now FLAT at 2^floorRiseStartsAtTier, so late-game
  //      difficulty has to come from production and economy, not the ladder.
  //   2. Cumulative cost to tier 20 drops from 48,639 to 6,143 — about 8x
  //      faster than the modelled 30-day curve. That is on purpose for a
  //      vertical slice: the whole ladder needs to be reachable in one
  //      sitting or you cannot judge how selling feels at every tier.
  // ELEVEN. It used to mean "the floor never rises", because the run ended at
  // tier 10. Now the ladder runs to 20 and the floor rising at 11 is what makes
  // the back half PAYABLE: per-tier cost is 2^(tier - floor(tier-1)), so with a
  // flat floor tier 20 would want 524,288 hatches. Rising once per tier from 11
  // caps per-tier cost at 2^10 = 1,024 and the top half stays reachable.
  // The first ten tiers are unchanged — every hatch still comes out at tier 1 —
  // so the opening game reads exactly as it did, and "the floor rises" becomes a
  // real tier-11 unlock (see UnlocksAtTier) rather than dead config.
  //
  // This was 6 for one round, to keep an 8-cell board out of the lock state, and
  // that was the wrong trade: it silently changed what a NORMAL egg hatches into
  // (tier 5 by the end of a run), which reads as a bug and cost the early game
  // its whole sense of building up from tier 1.
  //
  // The lock is handled where it belongs instead — see `boardLocked()` in
  // game.js. The window is 10 and the board reaches 20, so above 10 cells a lock
  // is arithmetically impossible; below it the game hands out a free cell rather
  // than relying on the player having gone shopping.
  //
  // Bonus, and it is a large one: with the floor at 1 the ladder costs
  // 1,023 hatches to tier 10 instead of 319 — a 3.2x longer run.
  floorRiseStartsAtTier: 11,
  floorRisesEveryNTiers: 1,

  // production
  // ── V4: THE WHOLE GAME IS HALF SPEED ──
  // Progression in this game is board throughput, and board throughput is set by
  // exactly two numbers: how often a nest lays (baseLayTimeSeconds) and how long
  // an egg holds a cell (protoAutoHatchSeconds). Both are doubled, and so are the
  // two terms that shape the lay curve, so lay time is EXACTLY 2x at every tier
  // rather than 2x at tier 1 and 1.9x at tier 20:
  //     40 - (t-1)*2  ==  2 * (20 - (t-1))
  // Halving throughput halves the ladder, the coin faucet and the gem faucet
  // together, which is the only way to slow progression without the currencies
  // drifting apart from each other. Nothing else in the file is touched for this.
  baseLayTimeSeconds: 40.0,
  speedStepPerLevel: 0.10,
  maxSpeedLevel: 20,
  nestOutputGrowthPerTier: 1.12,
  nestChickenTierLag: 2,
  startingNests: 1,
  // Four, not eight. Nests stopped being a quantity problem the moment they
  // became the gem engine: a nest's LEVEL is what matters now, so eight of them
  // would be eight parallel upgrade tracks all reading the same number.
  // Production is unaffected where it counts — at eight nests the coop already
  // out-produced the board by ~60x, so at four it is still ~30x and the BOARD
  // remains the ceiling exactly as before. Only the opening minutes get slower,
  // which is where a 12-cell board wants fewer eggs anyway.
  maxNests: 4,

  // coins
  // 100, so one of an egg's four segments pays 25 at hatch floor 1.
  coinsPerEggBase: 100.0,
  coinValueGrowthPerFloor: 1.26,
  mergeBonusBase: 40.0,
  mergeBonusGrowth: 1.42,
  firstExtraNestCost: 900.0,
  nestCostGrowth: 2.70,
  speedLevel1Cost: 250.0,
  speedCostGrowth: 1.48,
  coinSplitToNests: 0.55,

  // gem tree
  gemUpgradeBaseCost: 60.0,
  gemUpgradeCostGrowth: 1.28,
  gemUpgradeBonusPerLevel: 0.05,

  // ── prototype-only handles (not in the Unity schema) ──
  // Auto-hatch must be a LARGE fraction of lay time or the egg phase does not
  // exist: steady-state eggs on board = nests x (autoHatch / layTime). What
  // matters is the RATIO, not the number — 12s against a 210s lay meant eggs
  // were visible 0% of the time; 12s against a 15s lay is 0.8 and healthy.
  // Doubled with lay time — see the V4 note above. The RATIO to lay time is what
  // decides whether an egg phase exists at all, and doubling both keeps it at the
  // same healthy 1.2 it was at 24/20.
  protoAutoHatchSeconds: 48.0,
  // ── golden eggs: the gem faucet ──
  // Customers are gone, and with them the only exponential gem payout in the
  // game. Gems now come off the production line instead: a laid egg has a
  // chance to come out golden, each of its four cracks pays gems, and it
  // hatches ABOVE the floor.
  //
  // The value is FLAT and that is the whole point. The old curve paid 1 gem at
  // tier 3 and 131,072 at tier 20 — a 130,000x spread that forced every gem
  // price in the game to be exponential just to keep up. A flat payout makes
  // gem income scale with BOARD THROUGHPUT instead, which is already the real
  // ceiling, so the whole gem price list collapses into a ~20x band a player
  // can actually reason about.
  // Every term here is the V27 value x0.9 — a flat 10% cut to gem income,
  // applied to the CHANCE rather than the payout so the numbers on an egg
  // stay the round 6 and 10 a player can hold in their head.
  protoSpecialBaseChance: 0.018,   // a bare level-0 nest
  // (cap - base) / protoNestLevelMax, so the LAST level is the one that hits
  // the cap. At 0.0108 across 18 levels the cap arrived at level 13 and the
  // final five bought nothing at all.
  protoSpecialChancePerLevel: 0.008,
  protoSpecialChancePerTier: 0.0036, // a better hen lays more of them
  // Hard cap, and it is doing more work than it looks like. Golden chance
  // drives TWO accelerating levers at once — gem income, and (because golden
  // eggs hatch above the floor) ladder speed. The handover measured that going
  // from 25 to 30 board cells cost four days off the 30-day curve; hatching
  // above the floor is the same class of shortcut. This is now the most
  // sensitive single number in the file.
  protoSpecialChanceCap: 0.162,
  // ZERO, and the model is why. 98% of eggs overflow, so paying even one gem
  // for a crated golden egg made overflow the dominant faucet — 190,000 crated
  // against 4,300 cracked on the board, which is 40x the income coming from the
  // thing the player never sees. That destroys the entire point of the design:
  // gems are supposed to scale with BOARD THROUGHPUT.
  // The feel-bad I was worried about does not exist, because an overflow egg is
  // never drawn. The player does not watch it go — same as the 98% of eggs that
  // already crate silently into coins.
  protoSpecialCratedGems: 0,
  protoSpecialUnlockTier: 2,       // one merge in, so the first one lands early
  protoFirstSpecialEgg: 3,         // Nth egg of a fresh save is forced silver

  // ── nest levels: the coin sink this game has never had ──
  // 97-98% of eggs crate into coins and nothing could absorb them — the
  // handover swept board price across open, base, growth and level cap and
  // moved the 30-day curve by zero, because coins are effectively infinite.
  // Nest levels are where they go. A level buys GOLDEN CHANCE, never lay
  // speed, so the loop reads: coins -> gem generation -> gems -> board cells
  // -> throughput -> coins. Two currencies, two jobs, neither redundant.
  // Sized to a FOUR-SESSION run, not a thirty-day one. At the old
  // 2000 x1.70 a single nest wanted 2.3M coins and four wanted 6.6M — money a
  // 12-minute run never sees. See the run-length note in the README.
  protoNestLevelMax: 18,
  // Three STAR TIERS, four levels each. The progress bar shows the current
  // tier only — filling it earns the star and resets the bar — so a nest reads
  // as three short climbs rather than one twelve-step slog. Filling a tier pays
  // out a free egg (see protoStarReward), which is what makes the bar worth
  // watching rather than just a number going up.
  // 4 / 6 / 8 levels per star tier, not a flat 4. The first star should land
  // fast enough to teach that stars exist; the later ones are meant to be a
  // climb, and an identical span for all three made star 3 feel like star 1.
  protoNestStarLevels: [4, 10, 18],
  protoStarRewards: ['silver', 'silver', 'gold'],
  // Earning a star also puts THAT NEST on a 3x lay boost for half a minute. The
  // free egg is a prize you carry away; this is a reward you can watch happen, on
  // the exact object you spent the coins on. It reuses protoSpeedBoostMult so a
  // star burst and a Speed booster feel like the same force applied at different
  // scopes — one nest versus the whole coop.
  protoStarBoostSeconds: 30,
  protoNestTutorialTier: 3,         // tap-the-nest tutorial fires here
  protoBonusLabelMs: 3600,          // how long "Bonus egg" stays on a star reward
  protoFirstNestUpgradeFree: true,
  protoNestLevelBase: 150,
  protoNestLevelGrowth: 1.28,
  // Each nest is dearer to level than the one before it: nest 2's levels cost
  // 2.2x nest 1's, nest 3's 2.2x nest 2's. Without this all four nests were
  // priced identically, so "which nest do I pour coins into" had no answer and
  // the right play was simply to spread evenly. Now nest 1 is the cheap one you
  // push hardest and nest 4 is a long-term project.
  // 2.2, up from 1.55. A newly bought nest arriving at 1.55x was cheap enough
  // that the right play was still to level it immediately alongside nest 1 —
  // three nearly-equal tracks rather than a decision. At 2.2 the compounding is
  // 2.2 / 4.8 / 10.6x across the four, so opening a nest is a commitment: you are
  // buying production now and an expensive upgrade track later.
  protoNestCostPerNest: 2.2,
  protoNestTierChanceRef: 1,       // hen tier at which the per-tier term is 0

  protoTutorialGapPx: 46,
  protoNestTapSeconds: 2,
  // ── Nest tap-boost (replaces the instant one-tap egg jump) ───────────────
  // Tapping the Boost button in the nest card adds protoTapBoostSeconds to that
  // nest's boost timer, capped at protoTapBoostCap. While it runs the nest lays
  // at protoTapBoostMult, COMPOUNDING with the star boost and the coop-wide
  // Speed booster (see the production tick). REVERT: set protoNestInstantHurry
  // back to true to restore the original one-tap hurry — nothing else to touch.
  protoNestInstantHurry: false,
  protoTapBoostSeconds: 1.5,
  protoTapBoostCap: 20,
  protoTapBoostMult: 5,
  protoNestHintSeconds: 10,
  // Both doubled with baseLayTimeSeconds so the lay curve is a clean 2x scale of
  // the V31 one rather than a differently-shaped curve that happens to start 2x.
  protoLaySecondsPerTier: 2,
  protoMinLaySeconds: 2,
  protoBoostSeconds: 30,
  protoBoostGemCost: 6,        // flat base price of ONE booster, in gems
  protoBoostAnchorTier: 4,     // DEAD. Kept so a V31 config still imports.
  protoSpeedUnlockTier: 4,
  // SEVEN, after the shop rather than before it. Auto-merge is the one unlock
  // that removes work instead of adding a choice, and handing it over at tier 5 —
  // while the player is still learning to merge by hand — taught the board to play
  // itself before they had formed an opinion about playing it. It now arrives
  // after the shop, as the reward for having learned all three earlier verbs.
  protoMergeUnlockTier: 7,
  // Arriving with it: two free Speed boosters. Auto-merge is the second booster
  // TYPE, so this is the moment the bottom bar goes from one consumable to two,
  // and a player who has spent their three starting Speeds has an empty shelf
  // exactly when the game wants to teach that the shelf has two sections.
  protoMergeUnlockSpeedGift: 2,
  // Ten free eggs at the tier-4 chicken. Timed to land WITH the speed booster, so
  // the first thing you own a booster for is a board you can actually fill. They
  // surface on the Buy Egg button through the FREE xN tag that already exists for
  // the Starter Pack, so there is no new affordance to learn.
  protoFreeEggTier: 4,
  protoFreeEggGift: 10,
  // Tier 8 is where interstitials begin, i.e. the one tier whose "reward" is
  // something being taken away. Eight gems is the apology, and it lands on the same
  // popup so the two are read together rather than the ad arriving alone.
  protoFreeGemTier: 8,
  protoFreeGemGift: 8,
  // The shop comes LAST of the three verbs, after speed and auto-merge. It is
  // the only one that asks the player to leave the board and read a menu, and
  // handing it over while they are still learning to merge buries the two
  // unlocks that actually change how the board plays.
  protoShopUnlockTier: 6,
  protoStartBoosts: 3,
  protoBoostPackSmall: 3,
  protoBoostPackLarge: 10,
  protoPackSmallDiscount: 0.83,
  protoPackLargeDiscount: 0.70,
  protoDailyCoinSales: 40,      // free coins = this many eggs' worth
  protoDailyGemEggs: 3,         // free gems = this many golden eggs' worth.
                                // A good session cracks roughly 20-90 golden
                                // eggs, so the video is worth a tenth of one
                                // session at the start and far less later — a
                                // real hook that always loses to playing.
  protoDailyStreakStep: 0.15,
  protoDailyStreakCap: 7,
  protoPiggyShare: 0.35,   // of every golden egg's gems, not of a sale
  // ── V4: the piggy is a REWARDED VIDEO, once a day, hard-capped at 30 gems ──
  // It used to be a $4.99 IAP with a cap derived from silver-egg value
  // (EggGems('silver') x 20), which scaled with Rich seams and drifted from
  // anything a player could hold in their head. A flat 30 is a number you can
  // read off the bar, and because it is FLAT it stops being a faucet the moment
  // gem income gets real — which is what keeps a once-a-day video from competing
  // with actually playing.
  protoPiggyGemCap: 30,
  protoPiggyCooldownHours: 24,
  // Kept so an imported V31 config still parses; nothing reads it any more.
  protoPiggyCapGoldenEggs: 20,
  protoInterstitialSeconds: 180,
  protoInterstitialAdSeconds: 5,   // how long the spot itself runs before it
                                   // closes ITSELF — an interstitial you have
                                   // to dismiss is a second tax on top of the
                                   // first, and the real SDKs auto-dismiss too
  // One past the shop unlock, not level with it. The first interstitial leads
  // straight into the half-price no-ads offer, and that offer sends the player
  // to the shop when they dismiss it — so the shop has to already exist.
  // EIGHT, moved up one. Auto-merge now lands on tier 7, and stacking the first
  // full-screen ad onto the same tier as a major unlock spends the unlock: the
  // player dismisses the tier popup straight into an interstitial and remembers
  // the ad. One tier of clear air between them.
  protoInterstitialFromTier: 8,
  // ── V4: A PRICE ONLY EVER RISES FROM BUYING THE SAME THING ──
  // Boosters were the one line in the game that broke that rule. Their price was
  //     protoBoostGemCost x 2^(maxTier - protoBoostAnchorTier)
  // so it DOUBLED every tier — meaning merging two chickens, or buying anything
  // that got you to the next tier, silently repriced the booster shelf. At the
  // new 20-tier ladder that formula asks 65,536 gems for one booster at the top,
  // which is not a price, it is a wall.
  // It is now a flat base that climbs only with boosters you have actually
  // bought, of that kind, and it is capped. Known trade-off, stated plainly: a
  // flat price means boosters go cheap relative to late-game gem income, so they
  // stop being a gem sink after the first hour. That is the correct half of the
  // trade — a sink that reprices itself off your progress is not a sink, it is a
  // tax — but it does mean the late-game gem sink is now the coop and the crate.
  protoBoostGemGrowth: 1.035,   // per BOOSTER bought of that kind
  protoBoostPriceCapMult: 10,   // and never more than 10x the base price
  protoSpeedBoostMult: 3.0,
  protoAutoMergeEverySeconds: 1.0,
  protoRewardedVideoSeconds: 3,
  // 200. The first bought egg is 25 coins and the step is 75, so 200 buys egg
  // one and most of egg two — enough that the opening minute is something you
  // ACT on rather than something you watch, which matters more now that a nest
  // takes forty seconds to lay.
  protoStartingCoins: 200,
  protoSpeedLevelsMax: 20,
  // Three egg variants. Per-segment time is IDENTICAL across all three, so the
  // segment count alone sets the hatch time: silver takes 1.5x as long as a
  // normal egg and gold takes 3x, which is exactly the ratio asked for and it
  // needs no second timing constant to drift out of sync.
  protoEggSegments: 4,          // normal — pays coins, hatches at the floor
  protoSilverSegments: 6,       // 1.5x the time
  protoGoldSegments: 12,        // 3x the time
  // Specials pay GEMS AND NO COINS. A gold egg holds a cell for three times as
  // long as a normal one, so paying coins on top would make it strictly better
  // than the thing it displaces and there would be no decision in it.
  protoSilverGems: 6,
  protoGoldGems: 10,
  protoSilverHatchBonus: 1,     // tiers above the floor
  protoGoldHatchBonus: 2,       // floor+2 — "a tier 3 chicken" while the floor is 1
  // Of every special egg, this fraction is GOLD and the rest silver. One knob:
  // the nest level buys total special chance, this splits it. At an 18% cap
  // that is ~2.2% gold and ~15.8% silver.
  protoGoldShareOfSpecial: 0.12,
  protoBuyEggBase: 25,
  protoBuyEggStep: 75,
  // Only three of these are ever bought now (maxNests 4). They are the FIRST
  // thing gems buy, so they are priced at a couple of sessions of golden eggs
  // rather than the old 1/4/16, which a flat faucet clears in ninety seconds.
  // 8 / 30 / 120. The last nest is a real target rather than a rounding error on
  // a good session, and the step from nest 3 to nest 4 (4x) is the largest in the
  // game — the fourth nest should be the thing you are saving for, not the thing
  // you buy on the way to something else.
  protoNest2Gems: 8,
  protoNest3Gems: 30,
  protoNest4Gems: 120,
  protoNestGemGrowth: 3.2,
  protoDoubleRewardFromTier: 4,
  protoDiscoveryBase: 400,
  protoDiscoveryGrowth: 1.55,

  /* ─────────────────── MUTATION: the fire slime ───────────────────
   * A second breed, and the first thing in this game that arrives WITHOUT being
   * produced. It is not laid, not bought and not merged into existence — it falls
   * out of a chicken merge, which means the only way to farm it is to do the
   * thing the game is already about.
   *
   * Chance is 1% x the tier you merged INTO, capped. That shape matters: a
   * tier-3 merge is 3% and a tier-15 merge is 15%, so mutation gets denser
   * exactly as merges get rarer, and the expected slimes per SESSION stays
   * roughly flat instead of collapsing late.
   *
   * What it does is an AURA, not a payout. A slime speeds up every egg touching
   * it, which makes WHERE you put things matter for the first time — the board
   * has been a bag of pieces until now, and this is the change that gives it
   * geography. Higher slime tiers add coin and then gem multipliers on top.
   */
  protoSlimeUnlockTier: 3,            // no mutations from merges below this
  protoMutationChancePerTier: 0.01,   // x the tier merged INTO
  protoMutationChanceCap: 0.15,
  protoSlimeMaxTier: 8,               // eight slime colours are authored
  protoSlimeHatchBoostBase: 0.05,     // +5% crack speed to touching eggs at t1
  protoSlimeHatchBoostPerTier: 0.05,  // and +5% per slime tier after
  protoSlimeHatchBoostCap: 0.60,      // per slime; auras from several still add
  protoSlimeCoinBonusFromTier: 3,     // t3+ also pays touching eggs more coins
  protoSlimeCoinBonusPerTier: 0.10,
  protoSlimeGemBonusFromTier: 5,      // t5+ also pays touching specials more gems
  protoSlimeGemBonusPerTier: 0.10,
  // A slime CAN sit in a nest and lay its own breed, but ten times slower than a
  // hen of the same tier. That is the trade the mechanic needs: a nest holding a
  // slime is a nest not laying eggs, so farming slimes costs you the coin and gem
  // faucet the nest would otherwise be running.
  protoSlimeLayMult: 10,
  protoSlimeSegments: 6,              // taps to crack a slime egg
  protoSlimeMergeBonusShare: 0.5,     // of a chicken merge's coin bonus
  protoRareLayMult: 0.6,              // a NESTED rare lays this x a hen's time (below 1 = faster premium factory)
  protoRareHatchBonus: 2,             // hens from a rare nest hatch this many tiers above the normal floor
  protoGraduateGemsPerMax: 10,        // gems paid when a rare breed is completed (x its max tier)
  // ── the slime as a COIN ENGINE ──
  // Until now a slime was pure aura: it made other things better and did nothing
  // itself, which meant a board with one slime and no eggs beside it was a board
  // with a dead square on it. It now runs its own little cycle — ten seconds, then
  // a coin payout you can tap to hurry — so it is never doing nothing, and so the
  // tap verb the whole game is built on works on every piece rather than just eggs.
  protoSlimeCoinSeconds: 10,
  protoSlimeCoinBase: 300,            // at tier 1
  protoSlimeCoinPerTier: 1.6,         // and x this per tier
  protoSlimeTapSeconds: 1,            // seconds one tap shaves off the cycle
  // A Speed booster doubles the aura, on top of its usual effect on laying and
  // cracking. The slime is the only piece that reacts to a booster by CHANGING
  // rather than just going faster, which is what makes a boost worth aiming: you
  // want your eggs sitting next to slimes when you press it.
  protoSlimeBoostMult: 2,
  // Selling one back for gems. Deliberately steep per tier and small at the bottom:
  // a tier-1 slime is worth almost nothing, so the only way to make selling pay is
  // to have built something worth giving up.
  protoSlimeSellBase: 2,
  protoSlimeSellGrowth: 1.8,
  // Selling is the only irreversible action you can take on a piece, and its button
  // sits under the same finger that taps the slime to hurry its coins. Three
  // seconds of hold, with the button visibly charging, is the difference between a
  // deliberate sale and a destroyed tier-8 slime.
  protoSlimeSellHoldMs: 3000,

  /* ─────────────────── CRATE ───────────────────
   * Four board cells folded into one, with the hatching switched off. An egg that
   * would have been sold into the carton lands in a crate instead, and sits there
   * until you tap it out. That is the whole design: it does not make you money and
   * it does not hatch, it converts OVERFLOW — which the model says is 97-98% of
   * every egg laid — back into something you can choose to play.
   *
   * Priced in gems and upgraded one slot at a time, so it is the late-game gem
   * sink the booster shelf just stopped being.
   */
  protoCrateBase: 4,                  // slots in a fresh crate
  protoCrateMax: 12,                  // one more per upgrade, to twelve
  protoCrateGemBase: 4,               // gems for the first extra slot
  protoCrateGemGrowth: 1.42,          // and per slot after that

  /* ─────────────────── DAILY TASKS ───────────────────
   * Six a day, one gem each, four more for clearing the set, on a 24-hour reset.
   *
   * Two things decide whether this is a feature or a nuisance, and both are here:
   *
   * 1. A task must be POSSIBLE. Every entry in TASK_POOL carries a gate, and the
   *    roll only draws from entries whose gate is met. "Buy something in the shop"
   *    is unreachable before tier 6 and "merge two slimes" before you have seen
   *    one; offering either is a checklist the player cannot clear and a bonus
   *    that is a lie.
   * 2. Exactly one slot is a RETENTION task — something that wants a second
   *    session rather than more of this one. That is the only kind of task a daily
   *    list is uniquely good at, and without it this is just an achievements
   *    panel with a timer on it.
   *
   * The payout is 10 gems a day against the piggy's 30 and a good session's
   * several hundred from special eggs, so it is a nudge, not a faucet.
   */
  protoTaskCount: 6,
  protoTaskGem: 1,
  protoTaskAllBonus: 4,
  protoTaskResetHours: 24,
  // FIVE, which is also the one empty early tier — the gap between the Speed
  // booster and the shop. A daily list handed to a player who has not yet met a
  // booster, the shop or a nest upgrade is a list of words about systems they have
  // not seen; at tier 5 every early task in the pool is something they have done.
  protoTaskUnlockTier: 5,
  // Every target x1.2. Applied at read time rather than baked into TASK_POOL so the
  // pool stays a description of goals and the difficulty stays one number you can
  // move. BINARY tasks (need 1) are left alone — "use a booster" cannot be 20%
  // harder, and scaling it to 2 silently changes what the task is.
  protoTaskDifficulty: 1.2,
  // The gap the "come back later" task wants between two bouts of play. One hour
  // is long enough to be a genuine second session and short enough to happen
  // inside an evening.
  protoTaskReturnMinutes: 60,
};

/* ─────────────────── the task pool ───────────────────
 * `value` reads live state, `gate` decides whether the task can be offered at
 * all, and progress is always measured against a snapshot taken when the list
 * was rolled — so a task counts what you did TODAY, not what you have ever done.
 *
 * Targets are deliberately small. A daily task is a reason to open the game, not
 * a second progression system; anything that takes more than a couple of minutes
 * of ordinary play stops being a nudge and starts being a job.
 */
const TASK_POOL = [
  // ── the four you asked for ──
  { id: 'merge',    label: 'Merge 10 chickens',        need: 10, icon: '↻',
    value: s => s.stats.merged },
  { id: 'booster',  label: 'Use a booster',            need: 1,  icon: '⚡',
    value: s => s.stats.boosts,     gate: (s, c) => s.maxTier >= c.protoSpeedUnlockTier },
  { id: 'shopbuy',  label: 'Buy something in the shop', need: 1, icon: '\u{1F6D2}',
    value: s => s.stats.shopBuys,   gate: (s, c) => s.maxTier >= c.protoShopUnlockTier },
  { id: 'nestlvl',  label: 'Upgrade a nest',           need: 1,  icon: '\u{1FAB9}',
    value: s => s.stats.nestLevels },

  // ── the ten new ones ──
  { id: 'hatch',    label: 'Hatch 12 eggs',            need: 12, icon: '\u{1F423}',
    value: s => s.stats.hatched },
  { id: 'taps',     label: 'Crack 60 eggs by tapping', need: 60, icon: '\u{1F446}',
    value: s => s.stats.taps },
  { id: 'special',  label: 'Crack 3 special eggs',     need: 3,  icon: '\u{1F31F}',
    value: s => s.stats.silver + s.stats.gold,
    gate: (s, c) => s.maxTier >= c.protoSpecialUnlockTier },
  { id: 'gems',     label: 'Earn 15 gems',             need: 15, icon: '\u{1F48E}',
    value: s => s.stats.gemsEarned,
    gate: (s, c) => s.maxTier >= c.protoSpecialUnlockTier },
  { id: 'buyegg',   label: 'Buy 2 eggs',               need: 2,  icon: '\u{1F95A}',
    value: s => s.stats.bought },
  { id: 'cell',     label: 'Add a square to the coop', need: 1,  icon: '\u{1F3E0}',
    value: s => s.stats.cellsBought },
  { id: 'discover', label: 'Discover a new chicken',   need: 1,  icon: '\u{1F414}',
    value: s => s.seen.size },
  { id: 'nested',   label: 'Put a hen in a nest',      need: 1,  icon: '\u{1F423}',
    value: s => s.stats.nested },
  { id: 'spend',    label: 'Spend 2,000 coins',        need: 2000, icon: '\u{1FA99}',
    value: s => s.stats.coinsSpent },
  { id: 'hurry',    label: 'Hurry a hen 20 times',     need: 20, icon: '\u{1F44B}',
    value: s => s.stats.hurries },

  // ── the spares: real tasks, but each needs something owned first ──
  { id: 'star',     label: 'Earn a nest star',         need: 1,  icon: '★',
    value: s => s.stats.stars },
  { id: 'slime',    label: 'Merge two fire slimes',    need: 1,  icon: '\u{1F525}',
    value: s => s.stats.slimeMerged, gate: s => s.slimeSeen },
  { id: 'crate',    label: 'Tip a crate out',          need: 1,  icon: '\u{1F4E6}',
    value: s => s.stats.crateReleases, gate: s => s.stats.crates > 0 },

  /* ── RETENTION. Exactly one of these is always in the list. ──
   * These are the only tasks that ask for a SECOND SESSION rather than more of
   * this one, which is the whole reason a daily list exists. `retention: true` is
   * what reserves the slot; everything else fills the other five. */
  { id: 'comeback', retention: true, icon: '⏰',
    label: 'Come back after an hour away', need: 1,
    value: s => s.stats.returned },
  { id: 'dailyvid', retention: true, icon: '▶',
    label: 'Claim your free daily gems',   need: 1,
    value: s => s.stats.dailyGemClaims },
  { id: 'piggy',    retention: true, icon: '\u{1F437}',
    label: 'Fill and smash the piggy bank', need: 1,
    value: s => s.stats.piggySmashes,
    gate: (s, c) => s.maxTier >= c.protoSpecialUnlockTier },
];

/** Can this task be offered to a player in this state? */
const taskAvailable = (t, s, c) => !t.gate || t.gate(s, c);

/** The live target for a task, difficulty applied.
 *  Nothing reads `t.need` directly — this is the only way to ask, so moving
 *  protoTaskDifficulty moves the whole list and the UI at once. */
const TaskNeed = (c, t) => {
  const base = t?.need ?? 1;
  if (base <= 1) return 1;              // a binary task cannot be 20% harder
  return Math.max(base + 1, Math.round(base * (c.protoTaskDifficulty ?? 1)));
};

/** Gems a completed set is worth end to end. */
const TaskDayValue = c => c.protoTaskCount * c.protoTaskGem + c.protoTaskAllBonus;

/** Gem price of ONE booster of a given kind.
 *
 *  Depends on exactly one thing: how many boosters OF THAT KIND you have already
 *  bought. Not your tier, not your other purchases, not what is in the shop next
 *  to it. This is the invariant the whole V4 pricing pass exists to establish —
 *  a price in this game rises because you bought that thing, or it does not rise.
 *  Capped at protoBoostPriceCapMult so a long session cannot price you out of a
 *  consumable you are supposed to keep using. */
const BoostGemCost = (c, boughtOfKind = 0) =>
  Math.max(1, Math.round(
    c.protoBoostGemCost *
    Math.min(c.protoBoostPriceCapMult ?? 10,
             Math.pow(c.protoBoostGemGrowth, Math.max(0, boughtOfKind)))));

/* ─────────────────── egg variants ───────────────────
 * The gem faucet. Three kinds come off the production line:
 *
 *            taps   time    pays            hatches at
 *   normal     4      1x    coins           floor
 *   silver     6    1.5x    6 gems          floor + 1
 *   gold      12      3x    10 gems         floor + 2
 *
 * Specials pay no coins at all. A gold egg holds a board cell for three times
 * as long as a normal one, and the board — not production — is the ceiling in
 * this game, so if it paid coins too it would strictly dominate the egg it
 * displaced and there would be no decision in it.
 */

const EGG_KINDS = ['normal', 'silver', 'gold', 'slime'];
const isSpecial = kind => kind === 'silver' || kind === 'gold';

/** How many taps this variant takes. Per-segment time never varies, so this
 *  number alone sets the hatch duration — 6 segments IS 1.5x, 12 IS 3x. */
const EggSegments = (c, kind) =>
  Math.max(1, kind === 'gold'   ? c.protoGoldSegments
             : kind === 'silver' ? c.protoSilverSegments
             : kind === 'slime'  ? c.protoSlimeSegments
             : c.protoEggSegments);

/** Total gems a variant pays if you crack every segment yourself. */
const EggGems = (c, kind, gemUpgLevel = 0) => {
  const base = kind === 'gold' ? c.protoGoldGems : kind === 'silver' ? c.protoSilverGems : 0;
  return base ? Math.max(1, Math.round(base * gemMult(gemUpgLevel))) : 0;
};

/** Gems for the Nth tap (0-based) of a variant.
 *  Spread so the parts sum to EXACTLY the total, whatever the ratio: gold pays
 *  10 gems over 12 taps, which cannot be one-per-tap, so two of the twelve pay
 *  nothing rather than the total silently becoming 12. */
function EggTapGems(c, kind, tapIndex, gemUpgLevel = 0){
  const total = EggGems(c, kind, gemUpgLevel);
  if (!total) return 0;
  const segs = EggSegments(c, kind);
  const k = Math.max(0, Math.min(segs - 1, tapIndex));
  return Math.floor((k + 1) * total / segs) - Math.floor(k * total / segs);
}

/** Tiers above the hatch floor this variant lands on. `Rich yolks` raises both
 *  specials — the line buys DEPTH, since the variants already guarantee it. */
const EggHatchBonus = (c, kind, richYolks = 0) =>
  kind === 'gold'   ? c.protoGoldHatchBonus   + Math.max(0, richYolks)
: kind === 'silver' ? c.protoSilverHatchBonus + Math.max(0, richYolks)
: 0;

/** Does this variant pay coins? Only a normal egg does.
 *  A SLIME egg pays nothing either — it holds a cell for six segments and what it
 *  pays out is the slime, which is the whole point. Paying coins on top would
 *  make farming slimes strictly better than laying eggs. */
const EggPaysCoins = kind => kind !== 'silver' && kind !== 'gold' && kind !== 'slime';

/** Chance a freshly laid egg is SPECIAL (either kind).
 *  Two inputs, both player-controlled: the nest's LEVEL (bought with coins) and
 *  the TIER of the hen in it. Capped hard, because this one number drives both
 *  gem income and — through the hatch bonus — ladder speed. */
const SpecialChanceFor = (c, nestLevel = 0, henTier = 1) =>
  Math.min(c.protoSpecialChanceCap,
    c.protoSpecialBaseChance
    + c.protoSpecialChancePerLevel * Math.max(0, nestLevel)
    + c.protoSpecialChancePerTier  * Math.max(0, henTier - c.protoNestTierChanceRef));

/** Of that, the gold slice and the silver remainder. */
const GoldChanceFor = (c, nestLevel = 0, henTier = 1) =>
  SpecialChanceFor(c, nestLevel, henTier) * c.protoGoldShareOfSpecial;
const SilverChanceFor = (c, nestLevel = 0, henTier = 1) =>
  SpecialChanceFor(c, nestLevel, henTier) * (1 - c.protoGoldShareOfSpecial);

/** Average gems one laid egg is worth — what the model and the pip read. */
const ExpectedEggGems = (c, nestLevel = 0, henTier = 1, gemUpg = 0) =>
  GoldChanceFor(c, nestLevel, henTier)   * EggGems(c, 'gold', gemUpg) +
  SilverChanceFor(c, nestLevel, henTier) * EggGems(c, 'silver', gemUpg);

/** Where a nest sits inside its CURRENT star tier.
 *  The bar shows this tier only — fill it, earn the star, bar resets — so twelve
 *  levels read as three short climbs. `prev`/`next` are the tier's bounds. */
function NestStarProgress(c, level){
  const marks = c.protoNestStarLevels;
  const stars = marks.filter(l => level >= l).length;
  const prev  = stars > 0 ? marks[stars - 1] : 0;
  const next  = marks[stars] ?? marks[marks.length - 1];
  const span  = Math.max(1, next - prev);
  return { stars, prev, next, span,
           frac: Math.max(0, Math.min(1, (level - prev) / span)),
           maxed: stars >= marks.length };
}

/** The free egg filling a star tier pays out. */
const StarReward = (c, starIndex) =>
  c.protoStarRewards[Math.max(0, Math.min(c.protoStarRewards.length - 1, starIndex))];

/** Which star tier a nest level has earned, 0..3. */
const NestStars = (c, level) =>
  c.protoNestStarLevels.filter(l => level >= l).length;
/** Level the next star needs, or null at full marks. */
const NestNextStar = (c, level) =>
  c.protoNestStarLevels.find(l => level < l) ?? null;

/* ─────────────────── nest levels ─────────────────── */

/** Coin price of a nest's next level. Exponential against a coin income that
 *  is only ~1.26x per hatch-floor, so it stays a real decision all game
 *  instead of going free the way every previous coin sink did. */
const NestLevelCost = (c, level, nestIndex = 0) =>
  level >= c.protoNestLevelMax ? Infinity
    : Math.round(c.protoNestLevelBase
                 * Math.pow(c.protoNestLevelGrowth, Math.max(0, level))
                 * Math.pow(c.protoNestCostPerNest, Math.max(0, nestIndex)));

function CumulativeNestLevelCost(c, level, nestIndex = 0){
  let s = 0;
  for (let l = 0; l < Math.min(level, c.protoNestLevelMax); l++) s += NestLevelCost(c, l, nestIndex);
  return s;
}

/** Coin price of an instant egg: a flat ramp of +step per purchase made.
 *  NOTE: linear escalation against exponential coin income means this stops
 *  biting in the late game. Flagged for the rebalance pass. */
const BuyEggCost = (c, timesBought) =>
  Math.round(c.protoBuyEggBase + c.protoBuyEggStep * Math.max(0, timesBought));

/** Gem price of the next nest. Nests are the gem sink that gives selling a point. */
const NestGemCost = (c, nestIndex) => {
  if (nestIndex <= c.startingNests) return 0;
  const set = [c.protoNest2Gems, c.protoNest3Gems, c.protoNest4Gems];
  if (nestIndex - 2 < set.length) return set[nestIndex - 2];
  return Math.ceil(c.protoNest4Gems * Math.pow(c.protoNestGemGrowth, nestIndex - 4));
};

/** Coins for cracking one segment of an egg. Four segments = one CoinsPerEgg. */
/** Rounded, so a tap always pays a whole visible number rather than a value
 *  the display quietly floors. */
const SegmentCoins = (c, tier) =>
  Math.round(CoinsPerEgg(c, tier) / Math.max(1, c.protoEggSegments));

/** One-off bonus the first time a tier is ever reached: base, then +step per
 *  tier. Linear against an exponential economy, so it matters most early —
 *  which is where a new chicken feels like the biggest event anyway. */
/** Gently geometric rather than a flat +1000: coin income itself compounds, so
 *  a linear discovery bonus quietly becomes pocket change by the top tiers. */
const DiscoveryBonus = (c, tier) =>
  Math.round(c.protoDiscoveryBase * Math.pow(c.protoDiscoveryGrowth, Math.max(0, tier - 1)) / 10) * 10;

const HatchFloor = (c, tier) =>
  tier < c.floorRiseStartsAtTier
    ? 1
    : 1 + Math.floor((tier - c.floorRiseStartsAtTier) / Math.max(1, c.floorRisesEveryNTiers));

function HatchesToReachTier(c, tier){
  if (tier <= 0) return 0;
  if (tier === 1) return 1;
  return Math.pow(c.mergeRatio, tier - HatchFloor(c, tier - 1));
}

function CumulativeHatches(c, tier){
  let s = 0;
  for (let t = 1; t <= tier; t++) s += HatchesToReachTier(c, t);
  return s;
}

function TierFromBank(c, bank){
  let sum = HatchesToReachTier(c, 1);
  if (bank < sum) return 1;
  let best = 1;
  for (let t = 2; t <= c.tiersPerArea; t++){
    sum += HatchesToReachTier(c, t);
    if (bank >= sum) best = t; else break;
  }
  return Math.max(1, Math.min(c.tiersPerArea, best));
}

const ProductionMinutesPerDay = c =>
  c.sessionsPerDay * c.activeMinutesPerSession +
  Math.min(c.offlineCapHours * c.sessionsPerDay, 24) * 60 * c.offlineRate;

const SpeedMultiplier = (c, lvl) => 1 + c.speedStepPerLevel * lvl;

/** Seconds for ONE nest holding a tier-N chicken to lay one egg.
 *  LINEAR: every tier shaves a fixed second off, floored so it never hits zero.
 *  Note this diverges from the projection, which still models the old
 *  geometric nestOutputGrowthPerTier — one more entry on the rebalance list.
 *  Worth knowing: a linear subtraction accelerates hard at the very top
 *  (tier 19 -> 20 nearly doubles throughput), which is exactly the inversion
 *  the panel warns about, just localised to the last few tiers. */
function LayTimeSeconds(c, nestTier, speedLevel = 0){
  const linear = c.baseLayTimeSeconds - (nestTier - 1) * c.protoLaySecondsPerTier;
  const base = Math.max(c.protoMinLaySeconds, linear);
  return base / Math.max(1e-6, SpeedMultiplier(c, speedLevel));
}

const EggsPerMinute = (c, nests, speedLevel, nestTier) =>
  nests * (60 / c.baseLayTimeSeconds) * SpeedMultiplier(c, speedLevel) *
  Math.pow(c.nestOutputGrowthPerTier, Math.max(0, nestTier - 1));

const EggsPerDay = (c, nests, speedLevel, nestTier) =>
  EggsPerMinute(c, nests, speedLevel, nestTier) * ProductionMinutesPerDay(c);

const NestCost = (c, n) =>
  n <= c.startingNests ? 0
    : c.firstExtraNestCost * Math.pow(c.nestCostGrowth, n - (c.startingNests + 1));

function CumulativeNestCost(c, n){
  let s = 0;
  for (let k = c.startingNests + 1; k <= n; k++) s += NestCost(c, k);
  return s;
}

const SpeedCost = (c, l) =>
  l <= 0 ? 0 : c.speedLevel1Cost * Math.pow(c.speedCostGrowth, l - 1);

function CumulativeSpeedCost(c, l){
  let s = 0;
  for (let k = 1; k <= l; k++) s += SpeedCost(c, k);
  return s;
}

const CoinsPerEgg = (c, tier) =>
  c.coinsPerEggBase * Math.pow(c.coinValueGrowthPerFloor, HatchFloor(c, tier) - 1);

const MergeBonus = (c, tier) =>
  c.mergeBonusBase * Math.pow(c.mergeBonusGrowth, tier);

const GemUpgradeCost = (c, l) =>
  l <= 0 ? 0 : c.gemUpgradeBaseCost * Math.pow(c.gemUpgradeCostGrowth, l - 1);

/** Structural warnings — same checks as the Unity panel. */
function diagnose(c){
  const out = [];
  const mergeGrowth = Math.pow(c.mergeRatio, 1 - 1 / Math.max(1, c.floorRisesEveryNTiers));
  if (c.nestOutputGrowthPerTier >= mergeGrowth)
    out.push(`Nest growth ${c.nestOutputGrowthPerTier.toFixed(2)} >= merge cost growth ` +
             `${mergeGrowth.toFixed(2)} — progression will ACCELERATE to completion.`);
  if (c.protoSpecialChanceCap >= 0.5)
    out.push(`Special chance cap ${(c.protoSpecialChanceCap*100).toFixed(0)}% — special eggs ` +
             'drive gem income AND ladder speed, so above ~50% the ladder runs away.');
  if (SpecialChanceFor(c, c.protoNestLevelMax, c.tiersPerArea) < c.protoSpecialChanceCap)
    out.push('Special chance never reaches its cap — the last nest levels buy nothing.');
  // THE LOCK. A full board with every cell a different tier cannot merge and has
  // no room for an egg. It is arithmetically impossible once the board exceeds
  // the merge window — but the STARTING board is deliberately smaller than that
  // now, so the guarantee comes from `boardLocked()` in game.js handing out a
  // free cell instead of from the geometry. What has to hold is that the board
  // can always GROW past the window; otherwise the escape has nowhere to go.
  {
    const window = c.tiersPerArea - HatchFloor(c, c.tiersPerArea) + 1;
    const maxCells = BOARD_BASE + BOARD_MAX_LEVELS;
    if (maxCells <= window)
      out.push(`BOARD CAN LOCK PERMANENTLY: it maxes at ${maxCells} cells against ` +
               `a merge window of ${window}. Raise BOARD_MAX_LEVELS.`);
    else if (BOARD_BASE <= window)
      out.push(`Board starts inside the lockable range (${BOARD_BASE} cells vs a ` +
               `window of ${window}) — boardLocked() must stay wired up.`);
  }
  // The floor deliberately does NOT rise in a 10-tier run, so the old
  // "top tiers unreachable" warning would fire on the shipped config. What
  // actually matters is whether the ladder stays payable: per-tier cost is
  // 2^(tier-1) with a flat floor, so tier 20 would want 524,288 hatches.
  if (c.floorRiseStartsAtTier >= c.tiersPerArea && c.tiersPerArea > 12)
    out.push(`Floor never rises across ${c.tiersPerArea} tiers — the top ones cost ` +
             `${Math.pow(2, c.tiersPerArea - 1).toLocaleString()} hatches each.`);
  return out;
}

/** True while the live rules and the projection's assumptions disagree.
 *  Was set while orders paid gems and the projection modelled coins. The order
 *  system is gone and the projection now models the golden-egg faucet directly,
 *  so the two agree again. Kept as a seam for the next time they drift. */
const projectionIsStale = c => false;

/** 45-day projection — identical logic to EconomyProjection.Run. */
function project(c, horizon = 45){
  let nests = c.startingNests, speed = 0, nestTier = 1, tier = 1;
  let cumEggs = 0, cumOrd = 0, cumCoins = 0, cumGems = 0, finalDay = -1;
  const days = [];
  for (let i = 0; i < horizon; i++){
    const d = i + 1;
    if (d > 1){
      const nb = cumCoins * c.coinSplitToNests, sb = cumCoins * (1 - c.coinSplitToNests);
      nests = c.startingNests;
      for (let n = c.startingNests + 1; n <= c.maxNests; n++){
        if (CumulativeNestCost(c, n) <= nb) nests = n; else break;
      }
      speed = 0;
      for (let l = 1; l <= c.maxSpeedLevel; l++){
        if (CumulativeSpeedCost(c, l) <= sb) speed = l; else break;
      }
      nestTier = Math.max(1, tier - c.nestChickenTierLag);
    }
      const eggs = EggsPerDay(c, nests, speed, nestTier);
    cumEggs += eggs;
    const bank = Math.max(0, cumEggs - cumOrd);   // cumOrd is 0 now — nothing drains the board but merging
    tier = TierFromBank(c, bank);
    if (tier >= c.tiersPerArea && finalDay < 0) finalDay = d;
    cumCoins += eggs * CoinsPerEgg(c, tier) + MergeBonus(c, tier);
    cumGems  += eggs * ExpectedEggGems(c, 0, nestTier, 0);
    days.push({ day: d, tier, nests, speed, eggs, coins: cumCoins, gems: cumGems });
  }
  return { days, finalDay, tierAt30: days[29]?.tier, nestsAt30: days[29]?.nests,
           coinsAt30: days[29]?.coins, gemsAt30: days[29]?.gems };
}


/* ───────────────────────── shop ─────────────────────────
 * Sized against model.mjs, not guessed. By day 30 a player earns roughly
 * 1B coins and 7M gems, while every sink in the game before this shop cost
 * 6,013 gems total — a ~1200x oversupply. These curves exist to absorb that.
 *
 * The single most valuable line is BOARD SIZE, because the 16-cell board is
 * the real throughput ceiling: at 8 nests the coop out-produces what the
 * board can process by 60x, so more cells convert directly into ladder
 * progress in a way more nests simply cannot.
 */
/* ONE cell per level, not a jump to the next rectangle.
 *
 * The old ladder bought whole rows — 16, 20, 25, 30, 36 over four levels — so
 * the line was a four-purchase endgame item at 12k / 4M / 36M / 324M. Bought
 * one cell at a time it becomes something you top up all game, which is what a
 * board upgrade should be. Same 16 → 36 ceiling, so the throughput the 30-day
 * model was fitted against is unchanged; only the granularity and the total
 * price moved.
 *
 * Columns still step in thresholds rather than tracking the count, and the
 * thresholds are chosen so widening happens BEFORE a new row is added:
 *   17 cells is 5 across x 4 rows, not 4 across x 5 rows.
 * Otherwise buying a single cell would add a whole row of height for one usable
 * square, shrinking every tile — a +1 that makes the board look smaller.
 * A part-filled last row simply centres itself.
 */
/* FOUR COLUMNS, ALWAYS. The board grows downward in rows, never sideways, so
 * a cell is the same size on the first screen and the last — the old ladder
 * widened to 6 columns and every tile shrank as a reward for progressing.
 * 4x2 = 8 to start, 4x5 = 20 at full size.
 * BOARD_BASE 8 sits INSIDE the merge window (10, because the floor never rises),
 * so a full board of unmergeable chickens is reachable there. What makes it
 * survivable is boardLocked()/breakLock() in game.js handing over a cell, and
 * what makes that terminate is BOARD_BASE + BOARD_MAX_LEVELS being past the
 * window — which is the pair diagnose() checks. */
const BOARD_COLS = 4;
const BOARD_BASE = 8;                     // 4 x 2 to start
const BOARD_MAX_LEVELS = 12;              // 8 -> 20 (5 rows)
const boardCells   = (base, lv) =>
  BOARD_BASE + Math.max(0, Math.min(BOARD_MAX_LEVELS, lv | 0));
/* Column count for a given number of squares. Taken from the count rather than
 * the level so the BUY TILE can be included — the drawn rectangle has to hold
 * the squares you own plus the one you're being offered, or at exactly 4x3
 * there is nowhere to put the offer. */
/* ── crate rewards at the end of every unlockable ROW ──
 * The coop is four wide, so cells 9-12, 13-16 and 17-20 are three whole rows you
 * buy one tile at a time. Completing a row pays a CRATE, and the reward is drawn
 * sitting on the last tile of the row you are currently working through — the
 * same device as the egg on the end of a nest's star bar. A row of prices with
 * nothing at the end of it is a bill; a row with a prize on the end is a goal. */
const CRATE_ROW_EVERY = BOARD_COLS;
/** Board level (1-based) whose purchase completes a row and pays a crate. */
const CrateAtBoardLevel = lv =>
  lv > 0 && (BOARD_BASE + lv) % CRATE_ROW_EVERY === 0;
/** The next such level at or above the current one, or null past the last row. */
const NextCrateBoardLevel = lv => {
  const next = (Math.floor(Math.max(0, lv) / CRATE_ROW_EVERY) + 1) * CRATE_ROW_EVERY;
  return next <= BOARD_MAX_LEVELS ? next : null;
};

const boardColsFor = () => BOARD_COLS;
const boardRowsFor = n => Math.ceil(n / boardColsFor(n));
const boardCols    = lv => boardColsFor(boardCells(BOARD_BASE, lv));
const boardRows    = lv => boardRowsFor(boardCells(BOARD_BASE, lv));

const UPGRADES = [

    blurb: 'Every segment you crack pays more.',
    max: 12, open: 250, base: 5e3, growth: 1.46 },
  { icon: '\u{1F95A}', id: 'eggval',   cur: 'coins', name: 'Prize eggs',      unit: '+12% egg coins',
    blurb: 'Raises what every egg is worth, crated or hatched.',
    max: 12, open: 350, base: 7e3, growth: 1.48 },

/** Levels it takes for the cheap opener to catch back up with the real curve. */
const UPGRADE_RAMP = 1;

/* RAMP = 1, so the discount applies to level 0 and nothing else:
 *   factor(n) = min(1, (open/base) * (base/open)^(n/RAMP))
 * factor(0) = open/base exactly, factor(1) = 1 exactly.
 * That is deliberate and it was measured. Spreading the discount over five
 * levels instead undercut the whole early curve — Bigger coop level 1 fell
 * from 36M to 345k — and since board size IS the throughput ceiling, the
 * 30-day ladder collapsed to day 15. One cheap step in, then the real price.
 * (model.mjs --sessions 2/3/4 -> tier 16 at d30 / day 30 / day 23.)
 */
const UpgradeCost = (u, level) => {
  const n = Math.max(0, level);
  // a line that switches currency prices the gem half on its own curve, from
  // the level the switch happens rather than from the line's level 0
  if (u.gemsFrom != null && n >= u.gemsFrom)
    return Math.max(1, Math.ceil(u.gemBase * Math.pow(u.gemGrowth, n - u.gemsFrom)));
  // Hand-set prices beat a curve when the exact feel of each purchase is the
  // thing being designed. `steps` covers the whole line; `coinSteps` is the
  // older name and only ever covered the opening run.
  const steps = u.steps || u.coinSteps;
  if (steps && n < steps.length) return steps[n];
  const full = u.base * Math.pow(u.growth, n);
  if (!u.open) return Math.ceil(full);
  const dr = Math.pow(u.base / u.open, 1 / UPGRADE_RAMP);
  const factor = Math.min(1, (u.open / u.base) * Math.pow(dr, n));
  return Math.max(1, Math.ceil(full * factor));
};

/** Which currency a given level of a line is paid in. */
const UpgradeCur = (u, level) =>
  (u.gemsFrom != null && Math.max(0, level) >= u.gemsFrom) ? 'gems' : u.cur;

/** Total of every level of every line — what the shop can absorb in full. */
function shopCapacity(){
  const out = { coins: 0, gems: 0 };
  for (const u of UPGRADES)
    for (let l = 0; l < u.max; l++) out[UpgradeCur(u, l)] += UpgradeCost(u, l);
  return out;
}


/* effect helpers — one place, so the game and the model agree */
/* The board grows in whole rectangles rather than by a flat +4, because a
 * ragged last row looks broken and 8 rows of 4 does not fit a phone. Adding
 * COLUMNS as well as rows keeps the total height bounded — the cells shrink
 * as the grid widens. */
const crackMult    = lv => Math.pow(0.92, lv);
const tapMult      = lv => Math.pow(1.15, lv);
const eggMult      = lv => Math.pow(1.12, lv);
const layMult      = lv => Math.pow(0.94, lv);
const gemMult      = lv => Math.pow(1.10, lv);
const boostAdd     = lv => 5 * lv;   // seconds added to every booster


/* ─────────────────── consumables, dailies, offers ─────────────────── */

/** One booster of a kind, given how many of that kind you have bought. */
const BoostUnitCost = (c, boughtOfKind = 0) => BoostGemCost(c, boughtOfKind);

const BoostPackCost = (c, boughtOfKind, qty) => {
  const unit = BoostUnitCost(c, boughtOfKind);
  const disc = qty >= c.protoBoostPackLarge ? c.protoPackLargeDiscount
             : qty >= c.protoBoostPackSmall ? c.protoPackSmallDiscount : 1;
  return Math.max(1, Math.round(unit * qty * disc));
};

/** Free coins, scaled to what an egg is worth right now. */
const DailyCoins = (c, maxTier) =>
  Math.round(CoinsPerEgg(c, maxTier) * c.protoDailyCoinSales);

/** Free gems for a video. Scales with tier — a flat number is worthless
 *  within days in an economy that doubles per tier — plus a streak bonus. */
const DailyGems = (c, maxTier, streak = 0, gemUpgLevel = 0) =>
  Math.max(1, Math.round(
    EggGems(c, 'silver', gemUpgLevel) * c.protoDailyGemEggs *
    (1 + c.protoDailyStreakStep * Math.min(streak, c.protoDailyStreakCap))));

/** Piggy ceiling. FLAT — see protoPiggyGemCap. The old signature is kept so
 *  every existing call site still compiles; both arguments are ignored. */
const PiggyCap = (c, _maxTier, _gemUpgLevel = 0) =>
  Math.max(1, Math.round(c.protoPiggyGemCap));

/* ─────────────────── mutation / slime ─────────────────── */

/** Chance a merge into `tier` also spits out a slime. */
const MutationChance = (c, tier) =>
  tier < c.protoSlimeUnlockTier ? 0
    : Math.min(c.protoMutationChanceCap, c.protoMutationChancePerTier * tier);

/** Fraction knocked off the crack time of every egg TOUCHING one slime. */
const SlimeHatchBoost = (c, tier) =>
  Math.min(c.protoSlimeHatchBoostCap,
           c.protoSlimeHatchBoostBase +
           c.protoSlimeHatchBoostPerTier * Math.max(0, tier - 1));

/** Extra coins a touching egg pays. Zero until protoSlimeCoinBonusFromTier. */
const SlimeCoinBonus = (c, tier) =>
  tier < c.protoSlimeCoinBonusFromTier ? 0
    : c.protoSlimeCoinBonusPerTier * (tier - c.protoSlimeCoinBonusFromTier + 1);

/** Extra gems a touching SPECIAL egg pays. Zero until protoSlimeGemBonusFromTier. */
const SlimeGemBonus = (c, tier) =>
  tier < c.protoSlimeGemBonusFromTier ? 0
    : c.protoSlimeGemBonusPerTier * (tier - c.protoSlimeGemBonusFromTier + 1);

/** Coins one payout of a tier-N slime is worth. Geometric, so merging slimes is
 *  worth doing for the income alone even before the aura improves. */
const SlimeCoinValue = (c, tier) =>
  Math.round(c.protoSlimeCoinBase *
             Math.pow(c.protoSlimeCoinPerTier, Math.max(0, tier - 1)) / 10) * 10;

/** Gems a slime of this tier sells for. */
const SlimeSellGems = (c, tier) =>
  Math.max(1, Math.round(c.protoSlimeSellBase *
            Math.pow(c.protoSlimeSellGrowth, Math.max(0, tier - 1))));

/** Seconds for a NESTED slime of this tier to lay one slime egg. Ten times a
 *  hen's, because a nest holding a slime is a nest not running the gem faucet. */
const SlimeLayTimeSeconds = (c, tier, speedLevel = 0) =>
  LayTimeSeconds(c, tier, speedLevel) * c.protoSlimeLayMult;

/* ─────────────────── crate ─────────────────── */

/** How many eggs a crate at this upgrade level holds. */
const CrateSlots = (c, lvl = 0) =>
  Math.min(c.protoCrateMax, c.protoCrateBase + Math.max(0, lvl | 0));

/** Upgrade levels a crate can still buy. */
const CrateMaxLevel = c => Math.max(0, c.protoCrateMax - c.protoCrateBase);

/** Gem price of a crate's next slot, or Infinity when full. */
const CrateUpgradeCost = (c, lvl = 0) =>
  lvl >= CrateMaxLevel(c) ? Infinity
    : Math.max(1, Math.round(c.protoCrateGemBase *
        Math.pow(c.protoCrateGemGrowth, Math.max(0, lvl))));

/* ── merging two crates ──
 * CAPACITIES ADD, capped at protoCrateMax. That is the only rule that makes the
 * trade honest in both directions:
 *
 *   two fresh crates  ->  4 + 4 = 8 slots, and you get a board cell back
 *   three fresh crates ->  12 slots, exactly a full-size crate
 *
 * So the three row rewards merge into precisely one maxed crate, and merging never
 * destroys storage you paid for — it converts a board cell into consolidation.
 * Adding LEVELS instead would have made two fresh crates (level 0 each) merge into
 * a level-0 crate, i.e. you pay a crate to gain nothing, which is a trap.
 * Anything over the cap is refunded as eggs, not silently lost — see mergeCrates().
 */
const CrateMergedLevel = (c, lvlA, lvlB) =>
  Math.min(CrateMaxLevel(c),
           CrateSlots(c, lvlA) + CrateSlots(c, lvlB) - c.protoCrateBase);

/** What each tier hands you besides a prettier bird. A tier that only raises a
 *  number is a number going up; a tier that hands you a NEW VERB is the thing
 *  that makes twenty of them worth climbing — so the popup has to say which
 *  kind you just got, in one line, or the difference is invisible.
 *  Keyed by tier; read through UnlocksAtTier so the tier numbers stay in config. */
function UnlocksAtTier(c, tier){
  const out = [];
  if (tier === c.protoSpecialUnlockTier)
    out.push({ icon: '\u{1F31F}', name: 'Silver eggs', line: 'Some eggs come out silver. Every crack pays gems.' });
  if (tier === c.protoSpeedUnlockTier)
    out.push({ icon: '⚡', name: 'Speed boost', line: 'Hens lay and eggs crack 3× faster for 30 seconds.' });
  if (tier === c.protoShopUnlockTier)

  if (tier === c.protoMergeUnlockTier)

               line: 'Merges can now throw out a fire slime. Keep it — it speeds up every egg it touches.' });

/* ─────────── sound.js ─────────── */
/* sound.js — a soft ASMR-ish audio layer, synthesised rather than sampled.
 *
 * WHY SYNTHESIS AND NOT FILES
 * The deliverable is one self-contained HTML file you can mail to anyone and
 * open with a double click. Audio files would have to be base64'd into it, and
 * a dozen short ASMR cues at a listenable bitrate is roughly 1-3 MB of base64 —
 * more than ten times the size of the entire game. Synthesis costs nothing,
 * ships nothing, and is tunable from the settings panel while you listen.
 *
 * SWAPPING IN REAL FILES
 * Every cue goes through play(name). Drop a URL (or a base64 data URI) into
 * SAMPLES for any cue and that cue plays the file instead of the synth, at the
 * same bus and the same volume. Cues with no entry keep synthesising. So a
 * handful of real recordings can replace the ones that matter most and the
 * rest stay as they are — no all-or-nothing switch.
 *
 *   SAMPLES.merge = 'sounds/merge.mp3';
 *
 * DESIGN RULES, since "subtle" is a spec and not a vibe
 *   · Nothing above about -14 dBFS, and the loudest cue (a tier discovery) is
 *     still quieter than a system notification.
 *   · Every cue lands within 3.2 dB of every other. MEASURED, not judged — see
 *     the LOUD table and normalize.js.
 *   · Soft attacks. A click is an attack of 0 ms; ASMR is 8-30 ms.
 *   · Low-passed. Sharpness lives above 4 kHz, so most cues are filtered down
 *     to 1.2-3 kHz, which is what makes a sound feel close rather than loud.
 *   · Pitch rises with the tier on merges, so progress is audible.
 *   · Repeated cues detune slightly per fire. Identical repeats are what turns
 *     a pleasant sound into an irritating one after ninety seconds.
 *   · Hard cap on concurrent voices, so a boosted board cannot turn into a
 *     wall of noise.
 */

const SAMPLES = {};          // cue name -> URL, empty = synthesise

const MAX_VOICES = 8;

let ctx = null, bus = null, comp = null;
let voices = 0;
let enabled = true;
/* 0.85, not 0.5. The cues are written quiet on purpose (peaks around 0.07),
 * and a phone speaker is roughly 20 dB down on a laptop — at the old default
 * the whole layer was inaudible on the device it is meant for. TRIM lifts every
 * cue together so the mix between them is untouched; the compressor above
 * catches the moments they stack. */
let volume = 1.0;
const TRIM = 2.2;
const buffers = new Map();
const sampleGain = new Map();       // url -> measured level match, see playSample

/* ── per-cue loudness match ────────────────────────────────────────────
 * The cues were written one at a time, each with a `gain:` picked by ear
 * against whatever was playing that day. That does not survive twenty-one
 * cues: the gains span 0.016 to 0.075, and the ones built from four stacked
 * tones are louder again than the number suggests, while the ones sitting at
 * 147 Hz are quieter than it — a phone speaker barely reproduces them.
 *
 * So the levels are not guessed any more, they are MEASURED. `normalize.js`
 * renders every cue in an OfflineAudioContext, runs it through the ITU-R
 * BS.1770 K-weighting filters (which is what "same loudness" means in a spec
 * rather than a vibe — equal RMS at 150 Hz does NOT sound equal to 1.5 kHz),
 * takes the loudest 100 ms window, and solves for the multiplier that lands
 * every cue on its target. Run `node normalize.js --write` after touching a cue
 * and it rewrites the table below in place.
 *
 * Measured, the spread was 14.6 dB. It is now 3.2 dB — not zero, on purpose:
 * normalize.js sorts the cues into three classes 1.6 dB apart by how OFTEN they
 * fire, because `tap` a few thousand times a session and `discover` a dozen
 * times a run cannot want the same level. Flattening it completely makes the tap
 * fatiguing and the discovery stop landing. Set CLASS_DB to all zeros in
 * normalize.js and rerun for a literally-flat mix.
 *
 * The base target is the MEDIAN of the measured set, so the mix as a whole stays
 * where it was and only the outliers move. The cue trim multiplies the per-layer
 * gains INSIDE a cue, so a cue's internal balance is untouched. */
const LOUD = {
  tap:        1.688,    // -36.9 LUFS raw
  hatch:      0.828,    // -29.1 LUFS raw
  merge:      0.686,    // -27.5 LUFS raw
  nest:       0.631,    // -26.8 LUFS raw
  unnest:     1.000,    // -30.8 LUFS raw
  sale:       0.663,    // -27.2 LUFS raw
  coin:       1.671,    // -36.8 LUFS raw
  gem:        1.088,    // -33.1 LUFS raw
  buy:        1.672,    // -35.3 LUFS raw
  boost:      0.942,    // -30.3 LUFS raw
  // The two named booster cues are built from the same primitives at the same
  // gains as `boost`, so they inherit its normalisation rather than getting a
  // guessed one. Re-measure alongside the rest if the loudness pass is ever redone.
  boostSpeed: 0.942,
  boostMerge: 0.942,
  boostEnd:   1.251,    // -32.7 LUFS raw
  discover:   0.697,    // -26.1 LUFS raw
  unlock:     1.027,    // -29.4 LUFS raw
  ui:         1.070,    // -33.0 LUFS raw
  open:       1.257,    // -34.4 LUFS raw
  close:      1.980,    // -38.3 LUFS raw
  nope:       1.502,    // -35.9 LUFS raw
  bought:     0.569,    // -24.3 LUFS raw
  purchase:   0.534,    // -23.7 LUFS raw
  offer:      1.140,    // -30.3 LUFS raw
  ad:         1.180,    // -33.8 LUFS raw
};

/** The cue currently being fired, so tone()/noise() can apply its trim. */
let cueTrim = 1;

/** Browsers refuse to start audio before a gesture, so the context is created
 *  on the first real interaction rather than at load. */
function ensure(){
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  bus = ctx.createGain();
  bus.gain.value = volume;
  // gentle glue so a burst of simultaneous cues ducks instead of clipping
  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -22;
  comp.knee.value = 26;
  comp.ratio.value = 5;
  comp.attack.value = 0.006;
  comp.release.value = 0.22;
  bus.connect(comp).connect(ctx.destination);
  return ctx;
}

function resumeAudio(){
  const c = ensure();
  if (c && c.state === 'suspended') c.resume();
  return !!c && c.state === 'running';
}

/* ── unlocking on a phone ─────────────────────────────────────────────
 * This is the whole reason sound was silent on mobile, and it is three
 * separate problems wearing one coat:
 *
 * 1. A context created OUTSIDE a user gesture starts suspended, and on iOS
 *    calling resume() later — also outside a gesture — is ignored. It has to
 *    be created and resumed synchronously inside the handler.
 * 2. iOS additionally wants a buffer to actually PLAY inside that gesture
 *    before it considers the context unlocked. Resuming alone is not enough;
 *    a zero-length silent buffer is the standard handshake.
 * 3. A backgrounded tab suspends the context again, and coming back does not
 *    resume it, so it has to be re-armed on visibility change.
 *
 * Listening on pointerdown alone is also not enough on older iOS, where
 * touchstart/touchend are what carry the gesture privilege — so all of them
 * are attached and every one of them is removed on the first success.
 */
function unlockAudioOn(target){
  const EVENTS = ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown', 'click'];
  const done = () => EVENTS.forEach(e => target.removeEventListener(e, tryUnlock, true));
  function tryUnlock(){
    const c = ensure();
    if (!c) return done();
    if (c.state === 'suspended') c.resume();
    // the silent-buffer handshake — must happen inside the gesture
    try {
      const b = c.createBuffer(1, 1, 22050);
      const s = c.createBufferSource();
      s.buffer = b;
      s.connect(c.destination);
      s.start(0);
    } catch (_){ /* nothing to do but carry on */ }
    if (c.state === 'running') done();
  }
  EVENTS.forEach(e => target.addEventListener(e, tryUnlock, true));
  // a tab that goes to the background comes back suspended
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx && ctx.state === 'suspended') ctx.resume();
  });
}

/** Is audio genuinely producing sound right now? Used by the settings panel so
 *  a player who hears nothing is told why instead of guessing. */
function audioState(){
  if (!enabled) return 'off';
  if (!ctx) return 'waiting';
  return ctx.state === 'running' ? 'on' : 'blocked';
}

function setSoundEnabled(v){ enabled = !!v; }
function isSoundEnabled(){ return enabled; }
function setVolume(v){
  volume = Math.max(0, Math.min(1, v));
  if (bus) bus.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
}
function getVolume(){ return volume; }

/* ── building blocks ─────────────────────────────────────────────── */

function voice(node, stopAt){
  voices++;
  node.onended = () => { voices--; };
  if (stopAt != null) node.stop(stopAt);
}

/** One filtered, enveloped sine/triangle blip. The workhorse. */
function tone({ freq = 440, dur = 0.14, type = 'sine', gain = 0.09,
                attack = 0.012, cut = 2600, glide = 0, delay = 0, q = 0.7 } = {}){
  const c = ensure(); if (!c) return;
  const t = c.currentTime + delay;
  const osc = c.createOscillator();
  const g = c.createGain();
  const f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = q;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + glide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain * TRIM * cueTrim, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(f).connect(g).connect(bus);
  osc.start(t);
  voice(osc, t + dur + 0.02);
}

let noiseBuf = null;
/* Chosen so the noise layers keep the level the old `* 3.2` averaged out to —
 * the point of this constant is that it does not vary, not that it is 0.29. */
const NOISE_RMS = 0.29;
function noise({ dur = 0.12, gain = 0.05, cut = 1400, type = 'lowpass',
                 attack = 0.008, delay = 0, q = 0.9, sweep = 0 } = {}){
  const c = ensure(); if (!c) return;
  if (!noiseBuf){
    noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    // brownish noise: softer and closer than white, which is the whole point
    let last = 0;
    for (let i = 0; i < d.length; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last;
    }
    // Normalise it to a FIXED rms. The generator is a leaky integrator over
    // Math.random(), i.e. a random walk, so its level came out different every
    // session — measured, about 0.5 dB of wander in the buffer's overall rms,
    // which meant `tap` was quietly a different sound on Tuesday. The old
    // hardcoded `* 3.2` was a guess at the average of that walk.
    // The other half of the wander is WITHIN the buffer — a 75 ms slice of a
    // random walk varies by another dB or so — and normalising cannot fix that,
    // which is why normalize.js averages five renders per cue.
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / d.length) || 1;
    const k = NOISE_RMS / rms;
    for (let i = 0; i < d.length; i++) d[i] *= k;
  }
  const t = c.currentTime + delay;
  const src = c.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const f = c.createBiquadFilter();
  f.type = type; f.frequency.setValueAtTime(cut, t); f.Q.value = q;
  if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, cut + sweep), t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain * TRIM * cueTrim, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(bus);
  src.start(t);
  voice(src, t + dur + 0.02);
}

/* Pentatonic, so anything that plays at once still agrees. */
const SCALE = [523.25, 587.33, 698.46, 783.99, 880.00];
const scaleNote = i => {
  const oct = Math.floor(i / SCALE.length);
  return SCALE[((i % SCALE.length) + SCALE.length) % SCALE.length] * Math.pow(2, oct);
};
// a few cents of drift per fire, so the hundredth tap is not the first tap
const drift = () => 1 + (Math.random() - 0.5) * 0.012;

/* ── the cues ────────────────────────────────────────────────────── */

const CUES = {
  /* tapping an egg: a soft dry shell knock, no pitch to speak of.
     +25% on both layers, and the body tone moved up out of 240 Hz — a phone
     speaker rolls off hard below ~400 Hz, so a low "knock" is exactly the part
     of a cue that does not survive the trip to the device. */
  tap: (n = 0) => {
    noise({ dur: 0.075, gain: 0.069, cut: 1000 + n * 110, q: 1.6, attack: 0.004, sweep: -340 });
    tone({ freq: 430 * drift() + n * 34, dur: 0.07, gain: 0.035, cut: 1500, attack: 0.004 });
  },
  /* the shell finally giving: knock plus a tiny upward breath */
  hatch: () => {
    noise({ dur: 0.16, gain: 0.07, cut: 1500, q: 1.1, sweep: -700 });
    tone({ freq: 392 * drift(), dur: 0.2, gain: 0.05, glide: 180, cut: 2200, attack: 0.014 });
    tone({ freq: 587 * drift(), dur: 0.26, gain: 0.032, cut: 2600, attack: 0.02, delay: 0.05 });
  },
  /* merging: pitch climbs with the tier, so the ladder is audible */
  merge: (tier = 1) => {
    const i = Math.max(0, tier - 1);
    tone({ freq: scaleNote(i) * drift(), dur: 0.2, gain: 0.055, cut: 3000, attack: 0.01 });
    tone({ freq: scaleNote(i + 2) * drift(), dur: 0.26, gain: 0.036, cut: 3200, attack: 0.016, delay: 0.055 });
    noise({ dur: 0.1, gain: 0.022, cut: 2200, sweep: 900, attack: 0.012 });
  },
  /* A hen settling into a nest. This one was inaudible on a phone rather than
     missing: it sat at 174 Hz under a 700 Hz filter, which is squarely in the
     range a phone speaker physically cannot reproduce. Same shape — a soft
     shuffle and a warm settle — moved up an octave and a half and given a
     falling third on top so the gesture reads as completed. */
  nest: () => {
    noise({ dur: 0.2, gain: 0.075, cut: 1500, q: 0.9, attack: 0.016, sweep: -700 });
    tone({ freq: 466 * drift(), dur: 0.24, gain: 0.062, cut: 1900, attack: 0.02 });
    tone({ freq: 349 * drift(), dur: 0.3, gain: 0.042, cut: 1700, attack: 0.026, delay: 0.075 });
  },
  /* pulling a hen back OUT — the same idea inverted, so the pair is a matched
     put-down / pick-up rather than one sound doing double duty */
  unnest: () => {
    noise({ dur: 0.13, gain: 0.05, cut: 900, q: 0.9, attack: 0.01, sweep: 900 });
    tone({ freq: 349 * drift(), dur: 0.2, gain: 0.05, glide: 130, cut: 1900, attack: 0.012 });
  },
  /* a sale: the most rewarding routine sound in the game, so it gets a chord */
  sale: (tier = 3) => {
    const i = Math.max(0, tier - 3);
    tone({ freq: scaleNote(i) * drift(), dur: 0.28, gain: 0.05, cut: 3000, attack: 0.012 });
    tone({ freq: scaleNote(i + 2) * drift(), dur: 0.32, gain: 0.04, cut: 3200, attack: 0.014, delay: 0.06 });
    tone({ freq: scaleNote(i + 4) * drift(), dur: 0.42, gain: 0.032, cut: 3400, attack: 0.02, delay: 0.12 });
  },
  /* coins landing in the wallet */
  coin: () => {
    tone({ freq: 1046 * drift(), dur: 0.1, gain: 0.028, type: 'triangle', cut: 3600, attack: 0.005 });
    tone({ freq: 1568 * drift(), dur: 0.13, gain: 0.018, type: 'triangle', cut: 4200, attack: 0.006, delay: 0.03 });
  },
  gem: () => {
    tone({ freq: 1318 * drift(), dur: 0.22, gain: 0.03, type: 'triangle', cut: 4800, attack: 0.006 });
    tone({ freq: 1975 * drift(), dur: 0.26, gain: 0.016, type: 'triangle', cut: 5200, attack: 0.01, delay: 0.05 });
  },
  /* buying an egg: a small paper-and-shell rustle, +25% */
  buy: () => {
    noise({ dur: 0.13, gain: 0.056, cut: 1900, q: 0.7, attack: 0.01, sweep: -800 });
    tone({ freq: 415 * drift(), dur: 0.12, gain: 0.033, cut: 1700, attack: 0.01 });
  },
  /* a booster winding up, and letting go.
     `boost` is the generic fallback and is still what anything unrecognised
     plays. The two named cues below exist because the bottom bar now holds TWO

  boost: () => {
    tone({ freq: 330, dur: 0.34, gain: 0.042, glide: 560, cut: 3000, attack: 0.03 });
    noise({ dur: 0.3, gain: 0.022, cut: 700, sweep: 2400, attack: 0.04 });
  },
  /* SPEED: a hard upward whoosh. Rising pitch and rising filter together, which
     is the shape everything fast in this game already uses. */
  boostSpeed: () => {
    tone({ freq: 300, dur: 0.4, gain: 0.05, glide: 900, cut: 3400, attack: 0.015 });
    tone({ freq: 600, dur: 0.34, gain: 0.026, glide: 1100, cut: 4200,
           attack: 0.02, delay: 0.05 });
    noise({ dur: 0.36, gain: 0.03, cut: 600, sweep: 4200, attack: 0.02 });
  },
  /* AUTO-MERGE: a two-note spin-up rather than a sweep. Deliberately NOT a
     whoosh — auto-merge does not make anything faster, it makes something happen
     repeatedly, so it gets a repeating figure instead of a glide. */
  boostMerge: () => {
    [0, 3, 5].forEach((s, k) =>
      tone({ freq: 392 * Math.pow(2, s / 12), dur: 0.2, gain: 0.04 - k * 0.006,
             cut: 3000, attack: 0.012, delay: k * 0.07 }));

  },

    tone({ freq: 660, dur: 0.34, gain: 0.03, glide: -300, cut: 2200, attack: 0.02 });
  },

  unlock: () => {
