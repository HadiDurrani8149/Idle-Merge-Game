}

function renderShop(){
  const free = S.freeEggs > 0;
  const eggCost = free ? 0 : BuyEggCost(C, S.stats.bought);
  const costEl = $('#eggCost');
  if (costEl) costEl.innerHTML = free
    ? `<span class="freetag">FREE \u00d7${S.freeEggs}</span>`
    : `${coinSVG(15, true)}${fmt(eggCost)}`;
  $('#buyEgg')?.classList.toggle('poor', !free && S.coins < eggCost);

  const eggEl = $('#eggArt');
  if (eggEl && !eggEl.dataset.done){ eggEl.innerHTML = eggSVG(26, 2, 4); eggEl.dataset.done = '1'; }

  for (const [kind, id] of [['speed', '#boostSpeed'], ['merge', '#boostMerge']]){
    const el = $(id);
    if (!el) continue;
    const locked = !boostUnlocked(kind);
    el.style.display = locked ? 'none' : '';
    if (locked) continue;
    const active = S.boost[kind] > 0;
    const stock = S.stock[kind];
    el.classList.toggle('active', active);
    el.classList.toggle('out', !active && stock <= 0);
    // pip carries the count; the face of the button stays a clean icon
    const pip = el.querySelector('.pip');
    const want = active ? `s:${Math.ceil(S.boost[kind])}` : `n:${stock}`;
    if (pip && pip.dataset.sig !== want){
      pip.dataset.sig = want;
      pip.textContent = active ? `${Math.ceil(S.boost[kind])}s` : stock;
      pip.classList.toggle('running', active);
    }
    const bar = el.querySelector('.bfill');
    if (bar) bar.style.width = active
      ? (S.boost[kind] / boostSeconds() * 100).toFixed(1) + '%' : '0%';
  }

  const ubtn = $('#upgBtn');
  const shopOn = S.maxTier >= C.protoShopUnlockTier;
  if (ubtn){
    ubtn.style.display = shopOn ? '' : 'none';
    const badge = ubtn.querySelector('.pip');
    const n = shopOn ? upgradesAffordable() : 0;
    if (badge){
      badge.textContent = n || '';
      badge.style.display = n ? '' : 'none';
    }
  }
  // the coin/gem pills open the shop now; a pip on the gem pill flags a free daily claim
  const spip = $('#shopPip');
  if (spip){
    const rd = shopOn ? dailyReady() : 0;
    spip.textContent = rd || '';
    spip.style.display = rd ? '' : 'none';
  }
}

/** The buyable next square, or '' when the coop is maxed. `prize` is the crate
 *  marker, passed in when this tile happens to be the last one in the row. */
function nextTileMarkup(prize = ''){
  const u = UPGRADES.find(x => x.id === 'board');
  const lv = S.upg.board;
  if (!u || lv >= u.max) return '';
  const cost = UpgradeCost(u, lv);
  const gems = UpgradeCur(u, lv) === 'gems';
  const afford = (gems ? S.gems : S.coins) >= cost;
  return `<div class="cell buytile${afford ? ' afford' : ''}" data-tap="buytile:0">
    ${prize}<span class="plus">+</span>
    <span class="price">${gems ? gemSVG(13) : coinSVG(13)}${fmt(cost)}</span>
  </div>`;
}

/** ' fresh' exactly once per egg, on the first render after it appears. */
function eggEntrance(c, now){
  if (c.shown) return '';
  if (now - (c.born || 0) > 420) { c.shown = true; return ''; }
  c.shown = true;
  return ' fresh';
}

function renderGrid(){
  // No board-wide `perSeg` any more: a slime speeds up only the eggs it touches,
  // so segment time is a per-cell lookup (segSecondsAt) rather than one figure.
  const now = performance.now();
  // Pad out to a full rectangle with LOCKED tiles. Buying one cell at a time
  // otherwise leaves a ragged final row — CSS grid fills a partial row from the
  // start, so there is no way to centre it — and a jagged edge reads as broken
  // rather than as "you own 17 of 20". Shown faintly and dashed, like the
  // buyable nest slot, so the board also advertises that it can grow.
  // Exactly the cells you own plus the one on offer. The old build padded out to
  // a full rectangle with dashed LOCKED tiles, because at 6 columns a ragged row
  // looked broken. At a fixed 4 columns a part-filled last row is the normal
  // shape of a merge board, and dashed tiles you cannot buy just read as noise —
  // so 8 cells now draws as two rows and a plus, which is what "start with 2
  // rows" means.
  const cells = gridCells();
  // V4: the rest of the CURRENT ROW is drawn again, as locked tiles, and the last
  // one carries a crate. That is the whole point of drawing them — a row of prices
  // with nothing on the end of it is a bill, and a row with a prize on the end is a
  // goal. It is the same device as the egg sitting on the end of a nest's star bar,
  // and it is why the locked tiles are back after V31 removed them: they were noise
  // when they advertised nothing, and they are a progress bar now that they do.
  const rowEnd = boardMaxed() ? cells
    : Math.min(BOARD_BASE + BOARD_MAX_LEVELS,
               Math.ceil((cells + 1) / BOARD_COLS) * BOARD_COLS);
  const slots = Math.max(cells + (boardMaxed() ? 0 : 1), rowEnd);
  const buyTile = nextTileMarkup();
  // Cell index whose purchase completes this row, i.e. where the crate is drawn.
  const crateIdx = boardMaxed() ? -1 : rowEnd - 1;
  $('#grid').innerHTML = Array.from({ length: slots }, (_, i) => {
    const prize = i === crateIdx
      ? `<span class="rowprize">${crateBadgeSVG(40)}</span>` : '';
    // The FIRST square you don't own is the buy button. Same affordance as an
    // unowned nest or customer slot: the price is on the thing you are buying,
    // and you tap the board rather than going shopping.
    if (i === cells && buyTile) return nextTileMarkup(prize);
    // The reward tile is now JUST THE CRATE, centred, with no dashed box around
    // it. The dashes said "a square you could buy", which is the wrong promise —
    // this square is not for sale, it is where a prize will appear. Removing the
    // box also stops the row's last tile competing with the buy tile beside it.
    if (i >= cells) return prize
      ? `<div class="cell prizeonly" data-tap="prizeinfo:0">${prize}</div>`
      : '<div class="cell locked"></div>';
    const c = S.grid[i];
    if (!c) return `<div class="cell empty" data-drop="grid:${i}"></div>`;
    if (c.kind === 'crate'){
      const cap = crateSlots(c), n = c.eggs.length;
      const lvl = c.lvl || 0;
      const maxed = lvl >= CrateMaxLevel(C);
      const can = !maxed && S.gems >= CrateUpgradeCost(C, lvl);
      // The "Crate" label reuses the bonus-egg pill, exactly as the slime does:
      // one affordance for "this thing on your board is new".
      const lbl = c.bonusAt && (now - c.bonusAt) < C.protoBonusLabelMs
        ? '<span class="bonuslbl">Crate</span>' : '';
      // ONE tap target now, matching the nest exactly: tapping does the reflex
      // action (tip the eggs out) AND opens the upgrade card. The corner gem chip
      // is gone. It worked, but it made the crate the only object in the game
      // whose upgrade lived on the tile rather than in a card — and a 20px chip
      // that spends gems is a mis-tap waiting to happen on a phone.
      // The chip becomes a LEVEL chip instead, exactly like a nest's.
      return `<div class="cell crate${S.cratePopup === i ? ' picked' : ''}"
                   data-drop="grid:${i}" data-drag="grid:${i}"
                   data-species="crate" data-tier="0" data-tap="crate:${i}">` +
             `${crateSVG(62, n, cap, c.eggs)}${lbl}` +
             `<span class="lvchip${can ? ' afford' : ''}${maxed ? ' maxed' : ''}">` +
             `${maxed ? 'MAX' : `Lv ${lvl}`}${can ? '<i class="lvup">▲</i>' : ''}</span>` +
             `</div>`;
    }
    if (c.kind === 'slime'){
      const lbl = c.bonusAt && (now - c.bonusAt) < C.protoBonusLabelMs
        ? '<span class="bonuslbl">Mutation!</span>' : '';
      // `hot` is the Speed-booster state: the slime burns brighter and dances
      // faster, which is the visible half of the doubled aura.
      const hot = S.boost.speed > 0 ? ' hot' : '';
      // Its own coin cycle, drawn as a bar across the foot of the tile — the same
      // affordance a nest uses, because it means the same thing.
      return `<div class="cell chick slimecell${hot}${S.slimePopup === i ? ' picked' : ''}"
                   data-drop="grid:${i}" data-drag="grid:${i}"
                   data-species="slime" data-tier="${c.tier}" data-tap="slime:${i}">` +
             `${slimeSVG(c.tier, 62)}${lbl}` +
             `<span class="slbar"><i style="width:${(clamp01(c.prog || 0) * 100).toFixed(1)}%"></i></span>` +
             `</div>`;
    }
    // BRACED. This `if` was a single-statement body and a `const` cannot be the
    // body of one — dropping a declaration in here is a parse error, not a
    // runtime one, so the whole bundle died with "Unexpected token 'const'".
    if (c.kind === 'egg'){
      // One shot, tracked on the cell. Deriving it purely from a timestamp
      // meant any unrelated board change inside the window rebuilt the node and
      // restarted the animation halfway, which reads as a stutter.
      // The CELL BOX is identical for all three variants — the premium reads
      // from the egg art and its shine, not from a different tile, so the board
      // stays one grid rather than three kinds of thing.
      // "Bonus egg" on a star reward, for a few seconds. This replaces the
      // dotted tutorial line that used to point at it — the label is on the
      // thing itself, so there is nothing to aim.
      const bonus = c.bonusAt && (now - c.bonusAt) < C.protoBonusLabelMs
        ? '<span class="bonuslbl">Bonus egg</span>' : '';
      // `aura` is the one visual cue for the slime's effect. Without it a player
      // who happens to drop an egg next to a slime gets a faster hatch and no way
      // to know why — the mechanic exists to make placement matter, so placement
      // has to be legible.
      // The aura, stated as a NUMBER rather than implied by a ring. The ring says
      // "something is affecting this egg"; the pill says how much, which is the
      // difference between a decorative glow and a stat you can play around. It
      // uses the slime's own orange so the cause is unmistakable, and it reads the
      // live aura so dragging a slime next to an egg updates it immediately.
      const au = slimeAura(i);
      const pill = au.any
        ? `<span class="aurapct">⚡${Math.round(au.hatch * 100)}%</span>` : '';
      const lit = au.any ? (au.hot ? ' auralit aurahot' : ' auralit') : '';
      return `<div class="cell egg ${eggKind(c)}${eggEntrance(c, now)}${lit}"` +
             ` data-drop="grid:${i}" data-tap="egg:${i}">` +
             `${eggSVG(60, c.seg || 0, eggSegs(c), (c.t || 0) / segSecondsAt(i), eggKind(c))}${bonus}${pill}</div>`;
    }
    if (isRare(c.kind)){
      // Same cell box as a hen, drawn in the branch's colours. A "new" pill for a
      // few seconds after it drops, reusing the slime/crate affordance.
      const lbl = c.bonusAt && (now - c.bonusAt) < C.protoBonusLabelMs
        ? `<span class="bonuslbl">${BRANCHES[c.kind].short}!</span>` : '';
      return `<div class="cell chick rarecell" data-drop="grid:${i}" data-drag="grid:${i}"
                   data-species="${c.kind}" data-tier="${c.tier}">${speciesSVG(c.kind, c.tier, 62)}${lbl}</div>`;
    }
    return `<div class="cell chick" data-drop="grid:${i}" data-drag="grid:${i}"
                 data-species="chicken" data-tier="${c.tier}">${chickenSVG(c.tier, 62)}</div>`;
  }).join('');
  // Cache what renderProgress iterates every frame — see the note there.
  eggEls = [...document.querySelectorAll('#grid .egg')];
  slimeEls = [...document.querySelectorAll('#grid .slimecell')];
}

function renderNests(){
  // Owned nests plus exactly one buyable tile, same as the customer stall.
  // The row wraps upward (see #nests wrap-reverse), so a newly opened slot
  // appears ABOVE the existing ones rather than pushing the board down.
  const show = Math.min(C.maxNests, S.nestsOwned + 1);
  let h = '';
  for (let i = 0; i < show; i++){
    if (i === S.nestsOwned){
      const cost = NestGemCost(C, i + 1);
      const hint = S.nestHintUntil > performance.now() ? ' hint' : '';
      h += `<div class="nest buyslot${S.gems >= cost ? ' afford' : ''}${hint}" data-tap="buynest:0">
              <span class="plus">+</span>
              <span class="price">${gemSVG(12)}${fmt(cost)}</span>
            </div>`;
      continue;
    }
    const n = S.nests[i];
    const busy = n.tier != null
      ? `data-tap="hurry:${i}" data-drag="nest:${i}"` : '';
    const lab = n.tier != null
      ? `${Math.ceil(nestLayTime(n) / speedMult() * (1 - n.prog))}s` : '';
    // A small level chip only — the numbers moved into the upgrade card, which
    // opens on tapping the nest. The chip is what tells you the card exists.
    const lvl = n.lvl || 0;
    const maxed = lvl >= C.protoNestLevelMax;
    const canBuy = !maxed && (S.freeNestUpgrade || S.coins >= NestLevelCost(C, lvl, i));
    const nag = (S.nestTutorial && i === 0 && S.nestPopup == null) ? ' nag' : '';
    const chip = n.tier == null ? '' :
      `<span class="lvchip${canBuy ? ' afford' : ''}${maxed ? ' maxed' : ''}${nag}">` +
      `${maxed ? 'MAX' : `Lv ${lvl}`}${canBuy ? '<i class="lvup">\u25B2</i>' : ''}</span>`;
    // A nest running its star boost pulses and wears a lightning pip, so the
    // reward is visible ON the nest you spent the coins on rather than only in a
    // toast that has already scrolled away.
    const hot = n.boost > 0 ? '<span class="hotpip">\u26A1</span>' : '';
    h += `<div class="nest${S.nestPopup === i ? ' picked' : ''}` +
         `${n.boost > 0 ? ' hot' : ''}` +
         `${n.kind === 'slime' ? ' slimenest' : ''}" data-drop="nest:${i}" ${busy}>` +
         hot +
         `${nestSVG(74, n.tier, n.prog, lab, NestStars(C, lvl), n.kind)}${chip}</div>`;
  }
  $('#nests').innerHTML = h;
  nestEls = [...document.querySelectorAll('#nests .nest')];
}

/** The next-tier pill.
 *
 *  It used to read "next 5 · [bird] +1,240" — the coin bonus for discovering the
 *  next chicken. That was the least motivating possible answer to "what do I get
 *  next", because coins are the one thing this game already has too many of; by
 *  the time the figure is large enough to notice it is also worthless.
 *
 *  It now names the next UNLOCK — the shop, auto-merge, the floor rising — and
 *  falls back to the tier number when the next tier hands over nothing new. Tap
 *  it for the full run of what is coming. */
function nextUnlock(){
  for (let t = S.maxTier + 1; t <= C.tiersPerArea; t++){
    const un = UnlocksAtTier(C, t);
    if (un.length) return { tier: t, ...un[0] };
  }
  return null;
}

function renderColl(){
  const el = $('#nextChip');
  if (!el) return;
  // The profile avatar: the best HEN you currently have on the grid. Rares are a
  // separate collectible and never stand in for your hen level here. Falls back
  // to a tier-1 hen when the board holds no chicken yet.
  let top = 0;
  for (const c of S.grid) if (c && c.kind === 'chicken' && c.tier > top) top = c.tier;
  const tier = top || 1;
  if (el.dataset.tier === String(tier)) return;
  el.dataset.tier = String(tier);
  el.innerHTML = chickenSVG(tier, 36, true);
}

/* ─────────────────── the rare-collection tree viewer ───────────────────
 * Rebuilt on open, not every frame — a full-screen sheet is never behind the
 * board while you play. Unlocked tiers draw in full colour; locked ones fall back
 * to the same silhouette the collection strip uses. A branch renders its own
 * sub-branches nested underneath, so the viewer shows the tree AS a tree.
 */
function renderTree(){
  const el = $('#treeBody');
  if (!el) return;
  const seen = S.seenRare || {};
  const maxT = Math.max(1, S.maxTier || 1);
  const slimeMax = slimeMaxTier();
  const slimeSeenMax = Math.max(S.maxSlimeTier || 0, S.slimeSeen ? 1 : 0);

  // ── layout: common spine down the middle, breeds forking into side lanes ──
  const W = 408, TOP = 92, PITCH = 56, R = 23;   // R = node half-size (box 46)
  const COMMON_X = 216;
  // Every non-common breed described as a lane. Slime is the fire-slime line: it
  // mutates off hen merges rather than one fixed tier, so it forks near the top.
  const lanes = [
    { key:'galaxy', short:'Galaxy',     glyph:'\u{1F30C}', x:132, parent:'common', forkTier:BRANCHES.galaxy.forkTier,
      max:BRANCHES.galaxy.max, chance:rarePct(BRANCHES.galaxy.chance), seen:seen.galaxy||0,
      dot:BRANCHES.galaxy.ramp[BRANCHES.galaxy.ramp.length-1], anchor:'middle',
      art:t=>rareSVG('galaxy',t,80,true) },
    { key:'nebula', short:'Nebula',     glyph:'\u{2728}',  x:48,  parent:'galaxy', forkTier:BRANCHES.nebula.forkTier,
      max:BRANCHES.nebula.max, chance:rarePct(BRANCHES.nebula.chance), seen:seen.nebula||0,
      dot:BRANCHES.nebula.ramp[BRANCHES.nebula.ramp.length-1], anchor:'start',
      art:t=>rareSVG('nebula',t,80,true) },
    { key:'frost',  short:'Frost',      glyph:'\u{2744}',  x:300, parent:'common', forkTier:BRANCHES.frost.forkTier,
      max:BRANCHES.frost.max, chance:rarePct(BRANCHES.frost.chance), seen:seen.frost||0,
      dot:BRANCHES.frost.ramp[BRANCHES.frost.ramp.length-1], anchor:'middle',
      art:t=>rareSVG('frost',t,80,true) },
    { key:'storm',  short:'Storm',      glyph:'\u{26A1}',  x:132, parent:'common', forkTier:BRANCHES.storm.forkTier,
      max:BRANCHES.storm.max, chance:rarePct(BRANCHES.storm.chance), seen:seen.storm||0,
      dot:BRANCHES.storm.ramp[BRANCHES.storm.ramp.length-1], anchor:'middle',
      art:t=>rareSVG('storm',t,80,true) },
    { key:'slime',  short:'Fire Slime', glyph:'\u{1F525}', x:384, parent:'common', forkTier:2,
      max:slimeMax, chance:'mutation', seen:slimeSeenMax, dot:'#FF7A46', anchor:'end',
      art:t=>speciesSVG('slime',t,80,true) },
  ];
  const byKey = k => lanes.find(l => l.key === k);
  const row0 = k => k === 'common' ? 0 : row0(byKey(k).parent) + (byKey(k).forkTier - 1);
  const xOf  = k => k === 'common' ? COMMON_X : byKey(k).x;
  const pos  = (k, t) => ({ x: xOf(k), y: TOP + (row0(k) + (t - 1)) * PITCH });
  const H = TOP + (C.tiersPerArea - 1) * PITCH + R + 40;

  const inner = s => s.replace(/^\s*<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
  const rr = (cx, cy, r, rad) =>
    `M ${cx-r+rad} ${cy-r} h ${2*(r-rad)} a ${rad} ${rad} 0 0 1 ${rad} ${rad} v ${2*(r-rad)} `
  + `a ${rad} ${rad} 0 0 1 ${-rad} ${rad} h ${-2*(r-rad)} a ${rad} ${rad} 0 0 1 ${-rad} ${-rad} `
  + `v ${-2*(r-rad)} a ${rad} ${rad} 0 0 1 ${rad} ${-rad} Z`;

  // ── connectors (behind nodes) ──
  let links = '';
  const link = (d, active) => {
    links += `<path d="${d}" fill="none" stroke="#5A463B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    links += `<path d="${d}" fill="none" stroke="${active ? '#F7BE2E' : '#7A6252'}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const vseg = (x, y1, y2) => `M ${x} ${y1} L ${x} ${y2}`;
  // common spine
  for (let t = 1; t < C.tiersPerArea; t++){
    const a = pos('common', t), b = pos('common', t + 1);
    link(vseg(COMMON_X, a.y + R, b.y - R), (t + 1) <= maxT);
  }
  // each lane's ladder + its fork off the parent
  for (const L of lanes){
    for (let t = 1; t < L.max; t++){
      const a = pos(L.key, t), c = pos(L.key, t + 1);
      link(vseg(L.x, a.y + R, c.y - R), L.seen >= t + 1);
    }
    const from = pos(L.parent, L.forkTier), to = pos(L.key, 1);
    const sgn = Math.sign(to.x - from.x) || 1;
    link(`M ${from.x + sgn*R} ${from.y} L ${to.x - sgn*R} ${to.y}`, L.seen >= 1);
  }

  // ── nodes: a dirt tile (like a board cell) holding the creature ──
  const node = (cx, cy, artFull, lit) => {
    const box = R * 1.78;
    const tile = lit
      ? `<path d="${rr(cx,cy,R,9)}" fill="#E8D5CA" stroke="#C6AE9C" stroke-width="2"/>`
      : `<path d="${rr(cx,cy,R,9)}" fill="#4A382F" stroke="#5C4738" stroke-width="1.6"/>`;
    const art = `<svg x="${(cx-box/2).toFixed(1)}" y="${(cy-box/2).toFixed(1)}" width="${box.toFixed(1)}" height="${box.toFixed(1)}" viewBox="0 0 104 104" overflow="visible"${lit ? '' : ' filter="url(#tdim)" opacity="0.42"'}>${inner(artFull)}</svg>`;
    return tile + art;
  };
  let nodes = '';
  for (let t = 1; t <= C.tiersPerArea; t++){
    const p = pos('common', t);
    nodes += node(p.x, p.y, chickenSVG(t, 80, true), t <= maxT);
  }
  for (const L of lanes)
    for (let t = 1; t <= L.max; t++){
      const p = pos(L.key, t);
      nodes += node(p.x, p.y, L.art(t), L.seen >= t);
    }

  // ── fork ports on the common spine (a coloured chip where a breed unlocks) ──
  let ports = '';
  for (const L of lanes){
    if (L.parent !== 'common') continue;
    const p = pos('common', L.forkTier);
    const sgn = Math.sign(L.x - COMMON_X) || -1;
    ports += `<circle cx="${p.x + sgn*(R-1)}" cy="${p.y}" r="7.5" fill="${L.dot}" stroke="#FFF3E6" stroke-width="2"/>`;
  }

  // ── labels ──
  const F = 'font-family="var(--font)"';
  const parentTierLabel = L => L.parent === 'common' ? `Hen T${L.forkTier}` : `${byKey(L.parent).short} T${L.forkTier}`;
  let labels = '';
  for (const L of lanes){
    const p = pos(L.key, 1), lit = L.seen >= 1;
    const y = p.y - R - 15;
    const tx = L.anchor === 'start' ? p.x - R : L.anchor === 'end' ? p.x + R : p.x;
    const sub = L.chance === 'mutation'
      ? `mutates \u00b7 ${L.seen}/${L.max}`
      : `${L.chance} @ ${parentTierLabel(L)} \u00b7 ${L.seen}/${L.max}`;
    labels += `<text x="${tx}" y="${y}" text-anchor="${L.anchor}" ${F} font-size="10.5" font-weight="800" letter-spacing=".3" fill="${lit ? '#FFF3E6' : '#B7A08E'}">${L.glyph} ${L.short}</text>`
            + `<text x="${tx}" y="${y+12}" text-anchor="${L.anchor}" ${F} font-size="8.5" font-weight="600" fill="${lit ? '#E3C892' : '#9A836F'}">${sub}</text>`;
  }
  const cp = pos('common', 1);
  labels += `<text x="${COMMON_X}" y="${cp.y - R - 15}" text-anchor="middle" ${F} font-size="10.5" font-weight="800" letter-spacing=".3" fill="#FFF3E6">\u{1F414} Hens</text>`
          + `<text x="${COMMON_X}" y="${cp.y - R - 3}" text-anchor="middle" ${F} font-size="8.5" font-weight="600" fill="#E3C892">common \u00b7 ${maxT}/${C.tiersPerArea}</text>`;

  // ── tallies ──
  const breedSeen = lanes.filter(L => L.seen >= 1).length;
  const breedTot  = lanes.length;

  el.innerHTML =
    `<div class="tinfo"><span>Rares &amp; the fire slime drop beside a lucky merge — the coloured dot on a hen tier marks where each can appear. Merge each up its own line; some fork again.</span>
       <span class="tstats"><b>${breedSeen}<i>/${breedTot}</i></b> breeds<br><b>${maxT}<i>/${C.tiersPerArea}</i></b> hens</span></div>
     <svg class="treemap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin meet">
       <defs><filter id="tdim"><feColorMatrix type="saturate" values="0.15"/></filter></defs>
       ${links}
       ${ports}
       ${nodes}
       ${labels}
     </svg>`;
}

/* ─────────────────── the two HUD dropdowns ───────────────────
 * One host node, two panels, mutually exclusive because S.drop holds at most one
 * id. Sharing the node means outside-tap dismissal, positioning and z-index are
 * written once instead of twice and cannot drift apart.
 */
function toggleDrop(which){
  S.drop = S.drop === which ? null : which;
  play(S.drop ? 'open' : 'close');
  markDirty('drop');
}
const closeDrop = () => { if (S.drop){ S.drop = null; play('close'); markDirty('drop'); } };

function dropTasksHTML(){
  const left = tasksLeft();
  const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000);
  const rows = S.tasks.list.map(id => {
    const t = taskDef(id);
    if (!t) return '';
    const need = TaskNeed(C, t);
    const p = taskProgress(id), done = p >= need, got = taskClaimed(id);
    const pct = Math.min(100, p / need * 100);
    return `<div class="hdrow${done ? ' done' : ''}${got ? ' claimed' : ''}">
      <div class="hdi">${t.icon}</div>
      <div class="hdtxt"><b>${t.label}</b>
        ${need > 1 && !got ? `<div class="hdbar"><i style="width:${pct.toFixed(0)}%"></i></div>
        <span class="hdnum">${fmt(p)} / ${fmt(need)}</span>` : ''}</div>
      <div class="hdclaim${got ? ' got' : done ? ' can' : ''}"
           ${done && !got ? `data-tap="task:${id}"` : ''}>
        ${got ? '✓' : done ? `${gemSVG(11)}${C.protoTaskGem}` : `${gemSVG(11)}${C.protoTaskGem}`}
      </div></div>`;
  }).join('');
  const all = tasksAllDone(), bonusGot = S.tasks.bonusClaimed;
  return `<div class="hdcard">
    <div class="hdhead">Daily tasks
      <span class="hdtimer">resets in ${h}h ${m}m</span></div>
    ${rows}
    <div class="hdbonus${all && !bonusGot ? ' can' : ''}${bonusGot ? ' got' : ''}"
         ${all && !bonusGot ? 'data-tap="taskbonus:0"' : ''}>
      ${bonusGot ? `✓ Bonus claimed`
        : `All ${S.tasks.list.length} done ${gemSVG(13)}+${C.protoTaskAllBonus}`}
    </div></div>`;
}

function dropNextHTML(){
  // Everything still ahead of you, in order, with the bird you will be holding
  // when it lands. Capped at four rows — this is a teaser, not a roadmap.
  const rows = [];
  for (let t = S.maxTier + 1; t <= C.tiersPerArea && rows.length < 4; t++){
    const un = UnlocksAtTier(C, t);
    if (!un.length) continue;
    rows.push(`<div class="hdnext${rows.length === 0 ? ' soon' : ''}">
      <div class="hdart">${chickenSVG(t, 42, false)}</div>
      <div><i class="hdtier">TIER ${t}</i>
        <b>${un[0].icon} ${un[0].name}</b><span>${un[0].line}</span></div></div>`);
  }
  const nextT = Math.min(C.tiersPerArea, S.maxTier + 1);
  if (!rows.length)
    rows.push(`<div class="hdnext soon">
      <div class="hdart">${chickenSVG(nextT, 42, false)}</div>
      <div><i class="hdtier">TIER ${nextT}</i><b>A new chicken</b>
        <span>+${fmt(DiscoveryBonus(C, nextT))} coins the first time you reach it.</span></div></div>`);
  return `<div class="hdcard"><div class="hdhead">Coming up</div>${rows.join('')}</div>`;
}

function renderDrop(){
  const el = $('#huddrop');
  if (!el) return;
  if (!S.drop || S.popup || S.rv || S.inter || S.confirm || S.mutPopup || S.cratePopupIntro){
    el.classList.remove('open'); el.dataset.sig = ''; return;
  }
  // The tasks panel carries a live countdown and live progress, so its signature
  // includes both — but at MINUTE resolution, not milliseconds, or the panel
  // rebuilds every frame and the claim chips restart their nag animation.
  const sig = S.drop === 'tasks'
    ? ['t', S.tasks.list.join(','), S.tasks.claimed.join(','), S.tasks.bonusClaimed,
       Math.floor(tasksLeft() / 60000),
       S.tasks.list.map(taskProgress).join(',')].join('|')
    : ['n', S.maxTier].join('|');
  if (el.dataset.sig !== sig){
    el.dataset.sig = sig;
    el.innerHTML = S.drop === 'tasks' ? dropTasksHTML() : dropNextHTML();
  }
  el.classList.add('open');
  const host = $(S.drop === 'tasks' ? '#tasksBtn' : '#nextPill');
  const hud = $('#hud');
  if (host && hud){
    const r = host.getBoundingClientRect();
    const w = 250;
    const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    el.style.left = left + 'px';
    el.style.top = (hud.getBoundingClientRect().bottom + 8) + 'px';
    el.style.setProperty('--arrow', (r.left + r.width / 2 - left) + 'px');
  }
}

function offerArt(kind){
  // whole eggs, not cracked ones: a cracked egg reads as damaged goods
  if (kind === 'eggs')  return eggSVG(50, 0, 4) + eggSVG(40, 0, 4) + gemSVG(24);
  if (kind === 'gems')  return [26, 36, 26].map(n => gemSVG(n)).join('');
  if (kind === 'pig')   return '<span class="bigemo">\u{1F437}</span>';
  return '<span class="bigemo">\u{1F6AB}\u{1F4FA}</span>';
}

/** The seven leveled upgrade cards for one currency, shared by the Upgrades
 *  half-sheet. A line sits in the section matching the currency of its NEXT
 *  level, so Bigger coop would move Coin->Gem once it switches (it is inline,
 *  so it is filtered out here and lives on the board tile instead). */
function upgradeGrid(cur){
  return UPGRADES
    .filter(u => !u.inline && UpgradeCur(u, S.upg[u.id]) === cur).map(u => {
    const lv = S.upg[u.id], maxed = lv >= u.max, cost = UpgradeCost(u, lv);
    const can = !maxed && (cur === 'gems' ? S.gems : S.coins) >= cost;
    const switching = u.gemsFrom != null && lv === u.gemsFrom - 1;
    const off = lv === 0 && u.open && u.open < u.base * 0.5
      ? Math.min(99, Math.round((1 - u.open / u.base) * 100)) : 0;
    const starter = off > 0;
    return `<div class="up${can ? ' can' : ''}${maxed ? ' maxed' : ''}${starter ? ' starter' : ''}"
                 data-up="${u.id}" ${maxed ? '' : `data-tap="upg:${u.id}"`}>
      ${starter ? `<div class="uptag shiny">${off}% OFF</div>`
                : switching ? '<div class="uptag gem">gems after this one</div>' : ''}
      <div class="uptop"><div class="upic ${cur === 'gems' ? 'g' : 'c'}">${u.icon}</div>
        <div><div class="upname">${u.name}</div><div class="uplv">Level ${lv} / ${u.max}</div></div></div>
      <div class="upunit ${cur === 'gems' ? 'g' : ''}">${
        typeof u.unit === 'function' ? u.unit(lv) : u.unit}</div>
      <div class="upbuy ${maxed ? 'off' : can ? cur.charAt(0) : 'off'}">
        ${maxed ? 'MAX' : `${cur === 'gems' ? gemSVG(13) : coinSVG(15, true)}${fmt(cost)}`}</div>
    </div>`;
  }).join('');
}

/** How many leveled upgrades the player can afford right now — drives the pip
 *  on the bottom Upgrades button. */
const upgradesAffordable = () => UPGRADES.filter(u => !u.inline && S.upg[u.id] < u.max &&
  ((UpgradeCur(u, S.upg[u.id]) === 'gems' ? S.gems : S.coins) >= UpgradeCost(u, S.upg[u.id]))).length;

/** The Upgrades half-sheet body. Same self-gating + scroll-preserving pattern as
 *  renderShopSheet: rebuild only when a level or an affordability flips, and put
 *  the reader back where they were scrolled. */
function renderUpgradesSheet(){
  const host = $('#upgBody');
  if (!host || !$('#upgrades').classList.contains('open')) return;
  const sig = [S.maxTier,
    UPGRADES.map(u => S.upg[u.id]).join(','),
    UPGRADES.map(u => (UpgradeCur(u, S.upg[u.id]) === 'gems' ? S.gems : S.coins)
        >= UpgradeCost(u, S.upg[u.id]) ? 1 : 0).join('')].join('|');
  if (host.dataset.sig === sig) return;
  host.dataset.sig = sig;
  const keepY = host.scrollTop;
  requestAnimationFrame(() => { host.scrollTop = keepY; });
  host.innerHTML = `
    <div><div class="sec">${coinSVG(14)} Coin upgrades</div>
      <div class="upgrid">${upgradeGrid('coins')}</div></div>
    <div><div class="sec">${gemSVG(14)} Gem upgrades</div>
      <div class="upgrid">${upgradeGrid('gems')}</div></div>`;
}
function openUpgrades(){ play('open'); $('#upgrades').classList.add('open'); $('#upgDim').classList.add('open'); renderUpgradesSheet(); }
function closeUpgrades(){ $('#upgrades').classList.remove('open'); $('#upgDim').classList.remove('open'); coachClear(); }

function renderShopSheet(){
  const host = $('#shopBody');
  if (!host || !$('#shop2').classList.contains('open')) return;

  // Never rebuild under a finger. Replacing innerHTML destroys the carousel
  // node mid-gesture, and a fresh element starts at scrollLeft 0 — which is
  // exactly the "it snaps back to the first offer" bug.
  if (carDragging) return;

  // The signature must NOT contain raw balances. Coins tick every few frames
  // while you play, so a raw-balance signature rebuilt the whole sheet several
  // times a second — invisible when the numbers barely move, fatal to anything
  // holding scroll state. What the sheet actually renders from a balance is a
  // yes/no: can you afford this line. So encode THAT.
  const afford = [
    ...UPGRADES.map(u => (UpgradeCur(u, S.upg[u.id]) === 'gems' ? S.gems : S.coins)
        >= UpgradeCost(u, S.upg[u.id]) ? 1 : 0),
    ...['speed', 'merge'].flatMap(k =>
      [C.protoBoostPackSmall, C.protoBoostPackLarge].map(q =>
        S.gems >= BoostPackCost(C, S.stats.boostBuy[k] || 0, q) ? 1 : 0)),
  ].join('');
  // NOT the piggy either. It used to move only when you made a sale — a rare,
  // deliberate act. It now fills from every golden crack, auto-cracks included,
  // so it ticks on its own exactly the way coins do, and putting it in the
  // signature reintroduced the original bug through a different field. The
  // three numbers it renders are patched in place by renderPiggyLive instead.
  const sig = [afford, S.stock.speed, S.stock.merge,
    dailyCoinReady(), dailyGemReady(), piggyReady(), S.maxTier, flashLeft() > 0,
    S.stats.boostBuy.speed, S.stats.boostBuy.merge,
    UPGRADES.map(u => S.upg[u.id]).join(','), Object.keys(S.owned).join(',')].join('|');
  if (host.dataset.sig === sig) return;
  host.dataset.sig = sig;

  // and even on a legitimate rebuild, put the reader back where they were
  const keepY = host.scrollTop;
  const car0 = $('#carousel');
  const keepX = car0 ? car0.scrollLeft : 0;
  requestAnimationFrame(() => {
    host.scrollTop = keepY;
    const c = $('#carousel');
    if (c && keepX) c.scrollLeft = keepX;
  });

  // a one-time offer leaves the carousel once bought; repeatable ones stay
  const offers = OFFERS.filter(o => o.repeat || !S.owned[o.id]).map(o => {
    const pig = o.id === 'piggy';
    // same cap fillPiggy tops out at, or the bar reads 80% on a full piggy
    const cap = PiggyCap(C);
    const pct = pig ? Math.min(100, S.piggy / cap * 100) : 0;
    const deal = !o.rv && offerPrice(o) !== o.price;
    // The piggy's plate is a WATCH button or a cooldown, never a price. It sits in
    // the same slot the price occupied so the card's shape does not change \u2014 what
    // changes is that the currency being asked for is thirty seconds, not $4.99.
    const ready = pig && piggyReady() && S.piggy >= 1;
    const plate = pig
      ? (piggyReady()
          // `rvprice` is a flex row. gemSVG renders display:block, so in the
          // plain text-align:center plate it forced a line break and the gem
          // escaped to the left of the button.
          // NO GEM GLYPH on it. Everywhere else in this game a gem icon on a
          // button is a PRICE, so putting one here made a free reward read as a
          // purchase. A bare "+30" says the same thing and says it is a gain.
          ? `<div class="price rvprice${ready ? '' : ' off'}">${ready
              ? `<span>\u25b6 SMASH</span><span class="dotsep">\u00b7</span><b>+${fmt(Math.floor(S.piggy))}</b>`
              : '<span>Fill it first</span>'}</div>`
          : `<div class="price off">Back in ${untilNext(S.piggyAt, C.protoPiggyCooldownHours)}</div>`)
      : `<div class="price">${deal
          ? `<span class="wasnow"><s>${o.price}</s><span>${offerPrice(o)}</span></span>`
          : o.price}</div>`;
    return `<div class="offer ${o.kind}${deal ? ' deal' : ''}" data-tap="offer:${o.id}">
      ${o.ribbon ? `<div class="ribbon">${o.ribbon}</div>` : ''}
      <div class="oname">${o.name}${pig ? ' \u00b7 once a day' : ''}</div>
      <div class="orow"><div class="oart2">${offerArt(o.art)}</div><div>
        ${pig ? `<div class="oli">Fills as you crack special eggs</div>
                 <div class="oli">${gemSVG(12)} <b class="pigamt">${fmt(S.piggy)}</b> of ${fmt(cap)} inside</div>
                 <div class="oli">\u25b6 Watch a short video to smash it</div>`
              : o.lines.map(l => `<div class="oli">${l}</div>`).join('')}
      </div></div>
      ${pig ? `<div class="pigbar"><i style="width:${pct.toFixed(0)}%"></i></div>` : ''}
      ${plate}
    </div>`;
  }).join('');

  const coinReady = dailyCoinReady(), gemReady = dailyGemReady();
  const daily = `<div class="free">
    <div class="fcard"><div class="fi coinart">${coinSVG(27)}</div>
      <b>${fmt(DailyCoins(C, S.maxTier))} coins</b>
      <span>${coinReady ? 'Free, once a day' : 'Refreshes in ' + untilNext(S.daily.coinAt)}</span>
      <div class="fbtn ${coinReady ? 'go' : 'off'}" ${coinReady ? 'data-tap="dailyc:0"' : ''}>
        ${coinReady ? 'CLAIM' : 'CLAIMED'}</div></div>
    <div class="fcard"><div class="fi">\u{1F4FA}</div>
      <b>${fmt(DailyGems(C, S.maxTier, S.daily.streak))} gems</b>
      <span>${gemReady ? 'Watch a short video \u00b7 1 a day' : 'Back in ' + untilNext(S.daily.gemAt)}</span>
      <div class="fbtn ${gemReady ? 'rv' : 'off'}" ${gemReady ? 'data-tap="dailyg:0"' : ''}>
        ${gemReady ? '\u25B6 WATCH' : 'CLAIMED'}</div></div>
  </div>`;

  // One card per pack, not two prices crammed into one box. Two buy buttons
  // side by side inside a single card reads as one product with a confusing
  // choice attached; four cards read as four offers, which is what they are.
  const packs = [['speed', '\u26A1', 'Speed 30s', 's'], ['merge', '\u21BB', 'Auto-merge 30s', 'm']]
    .filter(([k]) => S.maxTier >= (k === 'speed' ? C.protoSpeedUnlockTier : C.protoMergeUnlockTier))
    .flatMap(([k, ico, name, cls]) => [C.protoBoostPackSmall, C.protoBoostPackLarge]
      .map(qty => {
        const bought = S.stats.boostBuy[k] || 0;
        const cost = BoostPackCost(C, bought, qty);
        const per  = cost / qty;
        const one  = BoostUnitCost(C, bought);
        const save = Math.round((1 - per / one) * 100);
        const can  = S.gems >= cost;
        const big  = qty === C.protoBoostPackLarge;
        return `<div class="cn${can ? ' can' : ''}${big ? ' best' : ''}"
                     ${can ? `data-tap="pack:${k}.${qty}"` : ''}>
          ${big && save > 0 ? `<div class="cnsave">save ${save}%</div>` : ''}
          <div class="cnh"><div class="cni ${cls}">${ico}</div>
            <div><div class="cnn">${qty} \u00d7 ${name}</div>
                 <div class="cnq">You have ${S.stock[k]}</div></div></div>
          <div class="cnbuy1 ${can ? '' : 'off'}">${gemSVG(13)}${fmt(cost)}</div>
        </div>`;
      })).join('');

  host.innerHTML = `
    <div><div class="sec">\u2728 Offers</div>
      <div class="carousel" id="carousel">${offers}</div>
      <div class="dots" id="cdots"></div></div>
    <div><div class="sec">\u{1F381} Free every day</div>${daily}</div>
    ${packs ? `<div><div class="sec">\u23F1 Boosters</div><div class="cons">${packs}</div></div>` : ''}`;
  buildDots();
}

const untilNext = (at, hours = 24) => {
  const ms = Math.max(0, hours * 3600000 - (Date.now() - at));
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return h ? `${h}h ${m}m` : `${m}m`;
};

/** Carousel dots + a 6-second auto-advance. */
function buildDots(){
  const car = $('#carousel'), dots = $('#cdots');
  if (!car || !dots) return;
  const n = car.children.length;
  // the true card pitch (card width + gap), not scrollWidth/n — the last card
  // can never be scrolled to its own offset, so an averaged step drifts the
  // dot index by one at the end of the strip
  const step = () => (car.children[1]
    ? car.children[1].offsetLeft - car.children[0].offsetLeft
    : car.scrollWidth) || 1;
  dots.innerHTML = Array.from({ length: n }, (_, i) => `<i${i === 0 ? ' class="on"' : ''}></i>`).join('');
  car.onscroll = () => {
    const i = Math.round(car.scrollLeft / step());
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  };
  // Tapping a dot jumps to that offer — a row of dots that is only a readout
  // is a control the thumb keeps trying and failing to use.
  [...dots.children].forEach((d, k) => {
    d.onclick = () => { touched(); car.scrollTo({ left: k * step(), behavior: 'smooth' }); };
  });

  // Drag to swipe. `overflow-x:auto` alone gives a native flick on touch but
  // NOTHING on a mouse, and this build gets played on both — so the pointer
  // drives scrollLeft directly. Snap is suspended mid-drag or it fights every
  // frame of the gesture.
  let sx = 0, sl = 0, on = false, lastX = 0, lastT = 0, vel = 0;
  car.onpointerdown = e => {
    on = true; carDragging = true; sx = lastX = e.clientX; sl = car.scrollLeft;
    lastT = performance.now(); vel = 0;
    car.setPointerCapture?.(e.pointerId);
    touched();
  };
  car.onpointermove = e => {
    if (!on) return;
    const t = performance.now(), dt = t - lastT;
    if (dt > 0) vel = (e.clientX - lastX) / dt;   // px per ms, signed
    lastX = e.clientX; lastT = t;
    car.scrollLeft = sl - (e.clientX - sx);
  };
  const end = () => {
    if (!on) return;
    on = false;

    // Rounding to the NEAREST card is what made a short swipe rubberband: a
    // deliberate 30px flick is nowhere near half a card, so it snapped back to
    // where it started and read as the gesture being rejected. Page on intent
    // instead — a decent flick or a third of a card commits, in the direction
    // you actually moved.
    const s = step();
    // Judge intent by the FINGER, not by how far the list actually moved.
    // scrollLeft clamps at both ends, so at the last card a forward swipe
    // produces zero movement — and reading direction from that sent the
    // carousel backwards on every swipe once you reached the end.
    const swept = sx - lastX;                     // + when swiping forward
    const from = Math.round(sl / s);
    let target = Math.round(car.scrollLeft / s);
    // 18px, not "a third of a card". A swipe on a phone is a flick of a thumb,
    // not a haul across the screen — asking for 100px before it counts is what
    // made a deliberate short swipe spring back. Anything past the 9px that
    // already cancels a tap is clearly a swipe, so 18 is honest.
    const flicked = Math.abs(vel) > 0.15;         // px/ms
    const dragged = Math.abs(swept) >= 18;
    if ((flicked || dragged) && target === from){
      target = from + (swept > 0 ? 1 : -1);
    }
    target = Math.max(0, Math.min(n - 1, target));
    car.scrollTo({ left: target * s, behavior: 'smooth' });
    // hold the rebuild lock through the settle animation, or the smooth scroll
    // gets cut off by a rebuild landing halfway
    setTimeout(() => { carDragging = false; }, 420);
  };
  car.onpointerup = end;
  car.onpointercancel = end;
  car.onpointerleave = end;

  // Auto-advance, but only while you are leaving it alone. Yanking the card out
  // from under a thumb that just swiped is worse than not auto-advancing.
  const touched = () => { buildDots._quiet = performance.now(); };
  clearInterval(buildDots._t);
  buildDots._t = setInterval(() => {
    if (!$('#shop2').classList.contains('open')) return;
    if (performance.now() - (buildDots._quiet || 0) < 9000) return;
    const next = (Math.round(car.scrollLeft / step()) + 1) % n;
    car.scrollTo({ left: next * step(), behavior: 'smooth' });
  }, 6000);
}

function renderInterstitial(){
  const el = $('#inter');
  if (!S.inter){ el.classList.remove('open'); el.dataset.at = ''; return; }
  if (el.dataset.at !== String(S.inter.at)){
    el.dataset.at = String(S.inter.at);
    el.querySelector('.ibody').innerHTML = `
      <div class="itag"><span>Interstitial ad</span><b id="icount">${
        C.protoInterstitialAdSeconds}s</b></div>
      <div class="iscreen">${jumpingMonkeySVG(112)}<div class="ifake">your ad here</div></div>
      <div id="ibar"><i></i></div>
      <button id="iclose" disabled>Closes by itself\u2026</button>
      <div class="ihint">Remove interstitials in the shop</div>`;
    el.querySelector('#iclose').onclick = closeInterstitial;
    el.classList.add('open');
  }
  // The spot runs itself down and dismisses itself. Left as a modal you must
  // tap away, an interstitial charges the player twice: once for the interrupt
  // and again for the dismissal.
  const total = C.protoInterstitialAdSeconds * 1000;
  const p = Math.min(1, (performance.now() - S.inter.at) / total);
  const bar = el.querySelector('#ibar i');
  if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
  const cd = el.querySelector('#icount');
  if (cd) cd.textContent = Math.max(0, Math.ceil(C.protoInterstitialAdSeconds * (1 - p))) + 's';
  // close on the same frame rather than dirtying and waiting: render() clears
  // the dirty flag straight after this call, so a deferred close never lands
  if (p >= 1){ closeInterstitial(); el.classList.remove('open'); el.dataset.at = ''; }
}

 *  elements, and there were two of them — nest to special egg, and board to

 *  moving targets every frame and re-deriving a quadratic; a bouncing arrow just

 *  itself now — it shines, it throws confetti, and cracking it pays a gem.

 *  hint line without needing to know what is underneath it. */

               && !S.popup && !S.rv && !S.inter && !S.confirm && !S.mutPopup;

  if (!host){ el.style.display = 'none'; return; }
  const r = host.getBoundingClientRect();
  if (el.dataset.done !== '1'){
    el.dataset.done = '1';
    // pointing DOWN at the nest, so it sits above and never covers the tap target
    el.innerHTML = `<svg width="30" height="26" viewBox="0 0 30 26">
      <path d="M15 2 L15 9 M15 23 L4 8 L26 8 Z"
            fill="#FFFFFF" stroke="#8C8898" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" paint-order="stroke"/>
    </svg>`;
  }
  el.style.display = 'block';
  el.style.left = (r.left + r.width / 2 - 15) + 'px';
  // CLAMPED UNDER THE HUD, measured rather than assumed. The arrow used to have
  // the hint line's row to live in; that row is height:0 now, which leaves about
  // 14px between the white band and the nest — and a 26px arrow placed 3px above
  // the tile reached up over the coin pill. It sits as high as it can without
  // touching the HUD instead, which lands its head on the nest's top edge: it
  // points at the tile by overlapping it, and pointer-events are off, so it still
  // cannot take the tap it is asking for.
  const hud = $('#hud');
  const ceil = hud ? hud.getBoundingClientRect().bottom + 2 : 0;
  el.style.top  = Math.max(ceil, r.top - 29) + 'px';
}

function renderProgress(){
  // the live egg segment fills smoothly, so it needs a per-frame update.
  // CACHED node lists (filled by renderGrid/renderNests). Two querySelectorAll
  // sweeps of the whole board, every frame, forever, was the other half of the
  // drag lag — and it was pure waste, because the only thing that changes which
  // nodes exist is a board rebuild, which is exactly where the cache is refreshed.
  for (const el of eggEls){
    if (!el.isConnected) continue;
    const i = +el.dataset.drop.split(':')[1];
    const c = S.grid[i];
    if (!c || c.kind !== 'egg') continue;
    const f = clamp01((c.t || 0) / segSecondsAt(i));
    void eggSegs(c);   // variant-aware; the bar itself is drawn per-segment
    const part = el.querySelector('.eggpart');           // SVG path
    if (part) part.setAttribute('width', (parseFloat(part.dataset.w) * f).toFixed(2));
    const live = el.querySelector('.artbar i.live');     // PNG path
    if (live) live.style.setProperty('--f', f.toFixed(3));
  }
  // the slime coin bars, same treatment as the egg segment bars
  for (const el of slimeEls){
    if (!el.isConnected) continue;
    const i = +el.dataset.drop.split(':')[1];
    const c = S.grid[i];
    if (!c || c.kind !== 'slime') continue;
    const bar = el.querySelector('.slbar i');
    if (bar) bar.style.width = (clamp01(c.prog || 0) * 100).toFixed(1) + '%';
  }
  nestEls.forEach((el, i) => {
    if (!el.isConnected) return;
    const n = S.nests[i];
    if (!n || n.tier == null) return;
    // 80, not 72. nestSVG draws this bar 80 wide; scaling by 72 meant a nest
    // that was visually 90% full was actually laying. Latent since V4.
    const bar = el.querySelector('.nestbar');
    if (bar) bar.setAttribute('width', (80 * clamp01(n.prog)).toFixed(1));
    const nbar = el.querySelector('.nestbarwrap i');     // PNG path
    if (nbar) nbar.style.setProperty('--f', clamp01(n.prog).toFixed(3));
    // The label lives inside the SVG, which only re-renders on markDirty, so
    // without this it froze at whatever second it was last drawn at.
    const lab = el.querySelector('.nestlab,.artnestlab');
    if (lab) lab.textContent =
      Math.ceil(nestLayTime(n) / speedMult() * (1 - clamp01(n.prog))) + 's';
  });
}

// ───────────────────────────── input ─────────────────────────────

let drag = null;
let pendingTap = null;
/** True while the offers carousel is being swiped (or settling). The shop sheet
 *  refuses to rebuild in that window — see renderShopSheet. */
let carDragging = false;

/** Tear down whatever drag is in flight, and sweep anything a previous one left
 *  behind. Both halves matter:
 *
 *  A second pointerdown arriving before the first pointerup — two fingers, or a
 *  fast tap on two chickens — used to overwrite `drag` and ORPHAN the first
 *  ghost. Nothing referenced it any more, so a chicken-shaped copy sat on the
 *  board forever and the source tile kept its `.dragging` class. That is the
 *  "visual dummy copy" bug.
 *
 *  The sweep is not belt-and-braces theatre either: `.dragging` lives on a tile
 *  that markDirty('grid') can replace mid-gesture, so the class can end up on a
 *  node this function no longer has a handle to. Querying the document is the
 *  only way to be sure. */
function endDrag(){
  if (drag){
    const { ghost, el, pid } = drag;
    try { if (pid != null) el.releasePointerCapture?.(pid); } catch (_){ /* already gone */ }
    ghost?.remove();
    el?.classList.remove('dragging');
    drag = null;
  }
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  clearHighlight();
  // render() refuses to touch the board while a drag is live, so whatever it
  // deferred has to be flushed now or the board sits stale until the next crack.
  markDirty('grid'); markDirty('nest');
}

function onDown(e){
  if (S.popup || S.rv || S.inter || S.confirm || S.mutPopup) return;
  // Never start a second drag on top of a live one. This is the fix for the
  // orphaned ghost — see endDrag().
  if (drag) endDrag();
  // Tapping anywhere that is not the card or a nest dismisses the card. Done on
  // pointerDOWN rather than up so it never races the tap it is dismissing for.
  if (S.nestPopup != null && !e.target.closest('#nestcard') && !e.target.closest('#nests'))
    closeNestCard();
  if (S.cratePopup != null && !e.target.closest('#cratecard') && !e.target.closest('.cell.crate'))
    closeCrateCard();
  if (S.slimePopup != null && !e.target.closest('#slimecard') && !e.target.closest('.slimecell'))
    closeSlimeCard();
  if (S.prizePopup && !e.target.closest('#prizecard') && !e.target.closest('.prizeonly')){
    S.prizePopup = false; markDirty('popup');
  }
  if (S.drop && !e.target.closest('#huddrop') && !e.target.closest('#hud'))
    closeDrop();
  // Any real press is proof the player is here — that is what the come-back task
  // measures its gap against.
  touchPlayed();
  const dragEl = e.target.closest('[data-drag]');
  const tapEl  = e.target.closest('[data-tap]');
  // A [data-tap] nested INSIDE a [data-drag] is its own control and wins.
  // The nest level pip is the only one: without this the drag branch below
  // claims the press and runs the NEST's tap action (hurry the hen) instead,
  // which made the pip unbuyable on any nest that had a hen in it — i.e. every
  // nest anyone would ever want to level.
  if (dragEl && tapEl && tapEl !== dragEl && dragEl.contains(tapEl)){
    runTap(tapEl.dataset.tap);
    e.preventDefault();
    return;
  }
  if (dragEl){
    const [src, idxStr] = dragEl.dataset.drag.split(':');
    const idx = +idxStr;
    const held = src === 'nest' ? S.nests[idx] : S.grid[idx];
    const tier = held?.tier;
    // A crate is a container, not a piece: `species` is what everything downstream
    // keys off, so the drop handler can allow "move a crate to an empty cell" while
    // refusing every merge.
    const species = src === 'nest'
      ? held?.kind
      : held?.kind;
    if (tier == null && species !== 'crate') return;
    // A nest is BOTH a drag source and a tap target, so remember where the
    // press started: if the pointer never really moved, this was a tap.
    drag = { from: idx, src, el: dragEl, tier, species, x0: e.clientX, y0: e.clientY,
             moved: false, tap: dragEl.dataset.tap || null, pid: e.pointerId };
    // Capture, or a touch that leaves the tile stops delivering moves — and the
    // whole point of the gesture is that it leaves the tile. Capture also means
    // pointerup still arrives if the finger lifts over a different element.
    try { dragEl.setPointerCapture?.(e.pointerId); } catch (_){ /* not fatal */ }
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.innerHTML = species === 'crate' ? crateSVG(66, held.eggs.length, crateSlots(held))
                    : species === 'slime' ? slimeSVG(tier, 66)
                    : chickenSVG(tier, 66);
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    moveGhost(e.clientX, e.clientY);
    dragEl.classList.add('dragging');
    highlight(tier, species);
    e.preventDefault();
  } else if (tapEl){
    // Inside the shop the sheet SCROLLS — vertically through the sections and
    // horizontally through the offer carousel — so acting on pointerdown makes
    // every swipe a purchase. Defer to pointerup and cancel on movement.
    // store the ACTION, not the node: the sheet rebuilds itself whenever a
    // balance changes, so the element under the finger can be replaced between
    // pointerdown and pointerup — the exact bug that ate the boost buttons
    if (tapEl.closest('#shop2')) pendingTap = { do: tapEl.dataset.tap, x0: e.clientX, y0: e.clientY };
    else runTap(tapEl.dataset.tap);
  }
}

/** Every tap action in one place, so the board (act on press, it feels snappy)
 *  and the shop (act on release, so a swipe isn't a spend) can't drift apart. */
function runTap(data){
  const [kind, idx] = data.split(':');
  if (kind === 'egg')     crackSegment(+idx, false);
  if (kind === 'hurry')   hurryNest(+idx);
  if (kind === 'buynest') buyNest();
  if (kind === 'buytile') buyUpgrade('board');
  if (kind === 'upg')     buyUpgrade(idx);
  if (kind === 'offer')   confirmOffer(idx);
  if (kind === 'dailyc')  claimDailyCoins();
  if (kind === 'dailyg')  claimDailyGems();
  if (kind === 'pack'){ const [k, q] = idx.split('.'); buyBoostPack(k, +q); }
  if (kind === 'nestlvl') buyNestLevel(+idx);
  if (kind === 'tapboost') tapBoostNest(+idx);
  if (kind === 'nestcard') openNestCard(+idx);
  if (kind === 'closecard') closeNestCard();
  if (kind === 'crate')     tapCrate(+idx);
  if (kind === 'crateup')   crateUpgrade(+idx);
  if (kind === 'slime')     tapSlime(+idx);
  if (kind === 'slimesell') sellSlime(+idx);
  if (kind === 'prizeinfo'){ S.prizePopup = true; play('open'); markDirty('popup'); }
  if (kind === 'closeprize'){ S.prizePopup = false; play('close'); markDirty('popup'); }
  if (kind === 'drop')      toggleDrop(idx);
  if (kind === 'task')      claimTask(idx);
  if (kind === 'taskbonus') claimTaskBonus();
}

function onMove(e){
  if (pendingTap && Math.hypot(e.clientX - pendingTap.x0, e.clientY - pendingTap.y0) > 9)
    pendingTap = null;                      // that was a swipe, not a purchase
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) drag.moved = true;
  moveGhost(e.clientX, e.clientY);
  drag.y = e.clientY;
  e.preventDefault();
}

function onCancel(){
  pendingTap = null;
  endDrag();
}

function onUp(e){
  if (pendingTap){
    const t = pendingTap; pendingTap = null;
    runTap(t.do);
  }
  if (!drag) return;
  const { from, src, ghost, el, moved, tap, pid, species } = drag;
  try { if (pid != null) el.releasePointerCapture?.(pid); } catch (_){ /* already gone */ }

  if (!moved && tap){
    endDrag();
    const [kind, idx] = tap.split(':');
    if (kind === 'hurry') tapNest(+idx);
    if (kind === 'egg')   crackSegment(+idx, false);
    if (kind === 'nestlvl') buyNestLevel(+idx);
    if (kind === 'crate') tapCrate(+idx);
    if (kind === 'slime') tapSlime(+idx);
    return;
  }

  ghost.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under && under.closest('[data-drop]');
  endDrag();
  if (!target) return;
  const [kind, idxStr] = target.dataset.drop.split(':');
  const idx = +idxStr;

  if (src === 'nest'){
    const hen = S.nests[from].tier;
    const henKind = S.nests[from].kind;
    if (kind === 'grid' && S.grid[idx] == null){
      S.grid[idx] = { kind: henKind, tier: hen };
      setNest(from, null, 0);
      play('unnest');
      markDirty('grid'); markDirty('nest');
    } else if (kind === 'grid' && S.grid[idx]?.kind === henKind
               && S.grid[idx].tier === hen && hen < speciesMax(henKind)){
      // merge straight out of the nest onto a matching piece of the same species
      setNest(from, null, 0);
      const nt = hen + 1;
      S.grid[idx] = { kind: henKind, tier: nt };
      if (henKind === 'slime') slimeMergeReward(nt, idx);
      else mergeReward(nt, idx);
      markDirty('grid'); markDirty('nest');
    } else if (kind === 'nest' && idx !== from){
      nestToNest(from, idx);
    } else shake(target);
    return;
  }

  if (kind === 'grid'){
    if (idx === from) return;
    if (S.grid[idx] == null){ S.grid[idx] = S.grid[from]; S.grid[from] = null; markDirty('grid'); }
    else if (!tryMerge(from, idx)) shake(target);
  } else if (kind === 'nest'){
    // A crate has no business in the coop.
    if (species === 'crate'){ shake(target); return; }
    if (!tryNest(from, idx)) shake(target);
  }
}

/* ─────────────────── the ghost ───────────────────
 * Two changes, both about the same thing: keeping the dragged piece off the main
 * thread's critical path.
 *
 * 1. TRANSFORM, not left/top. Writing left/top invalidates layout for the whole
 *    document on every pointermove; a translate3d is composited and never touches
 *    layout at all. `.ghost` also carries will-change:transform so the compositor
 *    gives it its own layer up front instead of promoting it mid-gesture (which is
 *    itself a visible hitch on the first move).
 *
 * 2. ONE WRITE PER FRAME. A finger on a 120Hz screen delivers coalesced
 *    pointermove events faster than the browser paints, so writing the style on
 *    every event does work that is thrown away. The position is stashed and
 *    flushed from a requestAnimationFrame, which is also what makes the ghost land
 *    in the same frame as everything else the loop draws.
 */
let ghostX = 0, ghostY = 0, ghostRaf = 0;
function flushGhost(){
  ghostRaf = 0;
  if (!drag?.ghost) return;
  drag.ghost.style.transform =
    `translate3d(${Math.round(ghostX)}px,${Math.round(ghostY)}px,0) translate(-50%,-50%)`;
}
const moveGhost = (x, y) => {
  ghostX = x; ghostY = y;
  if (!ghostRaf) ghostRaf = requestAnimationFrame(flushGhost);
};

function highlight(tier, species = 'chicken'){
  // Crates merge with each other now (capacities add), so they highlight like
  // anything else — but by SPECIES only, since a crate has no tier to match on.
  if (species === 'crate'){
    document.querySelectorAll('#grid [data-species="crate"]')
      .forEach(el => el.classList.add('match'));
    return;
  }
  document.querySelectorAll(`#grid [data-species="${species}"]`).forEach(el => {
    if (+el.dataset.tier === tier) el.classList.add('match');
  });
  document.querySelectorAll('#nests .nest[data-drop]').forEach(el => {
    // a nest holding the same tier AND THE SAME SPECIES is a MERGE target, not
    // just somewhere to park the piece — it gets the same green as a match
    const i = +el.dataset.drop.split(':')[1];
    const n = S.nests[i];
    const same = n?.kind === species;
    if (n?.tier === tier && same && tier < speciesMax(species)) el.classList.add('match');
    else el.classList.add('canNest');
  });
}
const clearHighlight = () =>
  document.querySelectorAll('.match,.canNest').forEach(el => el.classList.remove('match', 'canNest'));

function shake(el){ play('nope'); if (!el) return; el.classList.add('nope'); setTimeout(() => el.classList.remove('nope'), 320); }
function shakeSel(sel){ shake($(sel)); }
function pulse(i){ bounceEl(document.querySelector(`[data-drop="grid:${i}"]`)); }

/** The bounce a completed merge gets. Squash-overshoot-settle on the tile plus
 *  a ring that expands past it — the ring lives on <body> so it can grow beyond
 *  the tile without the board needing overflow, which would let dragged ghosts
 *  and float text escape too. */
function bounceEl(el, ring = true){
  if (!el) return;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 440);
  if (!ring) return;
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'ring';
  d.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 480);
}


function floatText(txt, cls, gridIdx){
  const host = gridIdx != null ? document.querySelector(`[data-drop="grid:${gridIdx}"]`) : $('#hud');
  if (!host) return;
  const r = host.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float ' + cls;
  d.textContent = txt;
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top  = (r.top + r.height / 3) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 900);
}

/** Fly `count` icons from a rect to a HUD pill. Gems fly ONE PER GEM (capped,
 *  so a big payout still reads as a shower rather than a swarm) because the
 *  amounts are small and countable. Coins do not — see coinSplash. */
function flyTo(targetSel, from, html, count, cls, reverse = false){
  const t = document.querySelector(targetSel)?.getBoundingClientRect();
  if (!t || !from) return;
  const n = Math.max(1, Math.min(12, count));
  for (let k = 0; k < n; k++){
    const d = document.createElement('div');
    d.className = 'flyer ' + cls;
    d.innerHTML = html;
    const jitter = n > 1 ? (Math.random() - 0.5) : 0;
    const sx = (reverse ? t.left + t.width / 2 : from.left + from.width / 2) + jitter * 30;
    const sy = (reverse ? t.top + t.height / 2 : from.top + from.height / 3) + jitter * 20;
    const ex = reverse ? from.left + from.width / 2 : t.left + t.width / 2;
    const ey = reverse ? from.top + from.height / 2 : t.top + t.height / 2;
    d.style.left = sx + 'px';
    d.style.top  = sy + 'px';
    d.style.setProperty('--dx', (ex - sx).toFixed(0) + 'px');
    d.style.setProperty('--dy', (ey - sy).toFixed(0) + 'px');
    d.style.animationDelay = (k * 55) + 'ms';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 900 + k * 55);
  }
  setTimeout(() => bump(targetSel), 260 + n * 55);
}

function bump(sel){
  const el = document.querySelector(sel)?.closest('.pill');
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/** The egg a star tier pays out, drawn small for the end of the progress bar.
 *  Naming the prize beats a gem there: a gem says "currency", this says which egg
 *  is coming. White keyline so it reads on both halves of the bar. */
function prizeEggSVG(kind = 'silver', px = 26){
  // 'normal' is the plain shell, for the end of the nest card's green lay bar.
  // That bar's prize is literally the next ordinary egg, so drawing it in silver
  // would promise a special-egg reward that never arrives. The keyline goes GREY
  // on it — a white egg with a white outline on a green bar is invisible.
  const body = kind === 'gold' ? '#E8A427' : kind === 'normal' ? '#FFFCF4' : '#C4CBD4';
  const lit  = kind === 'gold' ? '#FFECB8' : kind === 'normal' ? '#E4DED2' : '#F2F6FA';
  const key  = kind === 'normal' ? '#8A6A4E' : '#FFFFFF';
  return `<svg viewBox="0 0 32 32" width="${px}" height="${px}" style="display:block">
    <path d="M16 2.5 c5.6 0 9.7 7 9.7 12.8 c0 5.5 -4.3 9.4 -9.7 9.4
             c-5.4 0 -9.7 -3.9 -9.7 -9.4 C6.3 9.5 10.4 2.5 16 2.5 Z"
          fill="${body}" stroke="${key}" stroke-width="3"/>
    <path d="M13.6 6.8 c-2.4 2.5 -3.9 6.2 -4.1 9.6" stroke="${lit}" stroke-width="2.6"
          fill="none" stroke-linecap="round"/>
  </svg>`;
}

/** Gems flying from a cracked golden egg up to the wallet. Capped inside
 *  flyTo, so a big Rich-seams payout does not spawn forty nodes. */
function gemBurst(gridIdx, amount){
  const host = document.querySelector(`[data-drop="grid:${gridIdx}"]`);
  flyTo('#gems', host?.getBoundingClientRect(), gemSVG(16), amount, 'g');
}

/** The gem equivalent of coinSplash — the number, above the cell you tapped. */
function gemSplash(amount, gridIdx){
  const host = gridIdx != null
    ? document.querySelector(`[data-drop="grid:${gridIdx}"]`) : $('#hud');
  if (!host) return;
  const r = host.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'splash gemsplash';
  d.innerHTML = `${gemSVG(13)}<b>+${fmt(amount)}</b>`;
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top  = (r.top - 30) + 'px';   // above the coin splash, not on top of it
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 820);
  bump('#gems');
  gemBurst(gridIdx, amount);
}

/** Gems leaving the wallet on a purchase — same icons, run backwards. */
function spendGems(amount, fromRect){
  flyTo('#gems', fromRect, gemSVG(14), Math.min(6, amount), 'g out', true);
}

/** Coins are earned in the hundreds, so one icon per coin is nonsense. A
 *  single scaled-up splash carries the amount instead. */
function coinSplash(amount, gridIdx){
  const host = gridIdx != null
    ? document.querySelector(`[data-drop="grid:${gridIdx}"]`) : $('#hud');
  if (!host) return;
  const r = host.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'splash';
  d.innerHTML = `<i>${coinSVG(21)}</i><b>+${fmt(amount)}</b>`;
  d.style.left = (r.left + r.width / 2) + 'px';
  // lifted well above the tap point: on a phone your finger covers the cell
  d.style.top  = (r.top - 14) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 780);
  bump('#coins');
}

function toast(msg, kind = 'start'){
  const host = $('#toasts');
  if (!host) return;
  // cap the stack: rapid-fire purchases were burying the screen in toasts
  while (host.children.length >= 3) host.firstChild.remove();
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.textContent = msg;
  host.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

/* Just-in-time tutorial. The first time the player actually DOES a mechanic we
 * slide a small hint in from the top — it never covers the bottom action bar,
 * auto-dismisses, taps away, shows exactly once (S.tips), and QUEUES so two
 * triggers close together never pile up on screen. Add a mechanic by dropping
 * one coach(...) call at the point where it first fires. */
function coach(id, icon, title, body, ms = 5200){
  if (!S.tips) S.tips = {};
  if (S.tips[id]) return;
  S.tips[id] = 1;
  autosave();                                  // remember it even if they bail immediately
  if (HAND_STEPS[id]) return;                  // taught by the animated hand pointer, not a text card
  (coach._q || (coach._q = [])).push({ icon, title, body, ms });
  coachDrain();
}
function coachDrain(){
  if (coach._active) return;
  const item = (coach._q || []).shift();
  if (!item) return;
  const host = $('#coachwrap');
  if (!host){ coach._active = false; return; }
  coach._active = true;
  const d = document.createElement('div');
  d.className = 'coach';
  d.innerHTML = `<span class="cico">${item.icon}</span>`
    + `<div class="ctxt"><b>${item.title}</b><span>${item.body}</span></div>`
    + `<span class="cx">\u2715</span>`;
  host.appendChild(d);
  requestAnimationFrame(() => d.classList.add('in'));
  let done = false;
  const kill = () => {
    if (done) return; done = true;
    coach._kill = null;
    d.classList.remove('in');
    setTimeout(() => { d.remove(); coach._active = false; coachDrain(); }, 260);
  };
  coach._kill = kill;
  d.querySelector('.cx').addEventListener('click', kill);
  d.addEventListener('click', kill);
  setTimeout(kill, item.ms);
  try { play('open'); } catch (_){ }
}

const HAND_STEPS = { buyEgg: 1, tapEgg: 1, merge: 1 };

/** Dismiss the coach text card currently on screen (used when its panel closes). */
function coachClear(){ if (coach._kill) coach._kill(); }

/* First-time animated HAND pointer for the three core gestures. A pointing hand
 * sits on the real target — the BUY button, an egg, or a mergeable pair — and
 * animates the gesture (tap or drag). It clears the instant the step is done
 * (marked by the existing coach('id') hooks) and hides whenever a panel is up. */
function onboardPair(){
  const ch = [];
  S.grid.forEach((c, i) => { if (c && c.kind === 'chicken') ch.push([i, c.tier]); });
  for (let a = 0; a < ch.length; a++)
    for (let b = a + 1; b < ch.length; b++)
      if (ch[a][1] === ch[b][1]) return [ch[a][0], ch[b][0]];
  return null;
}
const ONBOARD = [
  { id: 'tapEgg', label: 'Tap the egg to crack it', drag: false,
    target: () => document.querySelector('.cell.egg') },
  { id: 'merge', label: 'Drag two of the same together', drag: true,
    target:  () => { const p = onboardPair(); return p ? document.querySelector(`[data-drag="grid:${p[0]}"]`) : null; },
    target2: () => { const p = onboardPair(); return p ? document.querySelector(`[data-drag="grid:${p[1]}"]`) : null; } },
  { id: 'buyEgg', label: 'Tap BUY to get an egg', drag: false,
    target: () => $('#buyEgg') },
];
function onboardTick(){
  const hand = $('#handhint');
  if (!hand) return;
  if (!S.tips) S.tips = {};
  // safety nets: never nag a player who clearly already knows the loop
  if (!S.tips.tapEgg && S.maxTier >= 2) S.tips.tapEgg = 1;
  if (!S.tips.merge  && S.maxTier >= 2) S.tips.merge  = 1;
  if (!S.tips.buyEgg && S.maxTier >= 3) S.tips.buyEgg = 1;
  // these hints belong to the board — hide behind any panel/modal
  if (document.querySelector('.sheet.open, .halfsheet.open, .modal.open')){ hand.style.display = 'none'; return; }
  let step = null, tgt = null;
  for (const st of ONBOARD){ if (S.tips[st.id]) continue; const t = st.target(); if (t){ step = st; tgt = t; break; } }
  if (!step){ hand.style.display = 'none'; return; }
  const r = tgt.getBoundingClientRect();
  if (!r.width){ hand.style.display = 'none'; return; }
  const cx = r.left + r.width / 2;
  const below = (r.top + r.height / 2) < innerHeight * 0.6;   // hand under the target, finger up
  hand.style.display = 'block';
  hand.className = 'hand' + (step.drag ? ' drag' : '') + (below ? ' up' : ' down');
  hand.querySelector('.handglyph').textContent = below ? '\u{1F446}' : '\u{1F447}';
  hand.querySelector('.handlabel').textContent = step.label;
  hand.style.left = cx + 'px';
  hand.style.top  = (below ? r.bottom + 4 : r.top - 4) + 'px';
  hand.style.setProperty('--dx', '0px'); hand.style.setProperty('--dy', '0px');
  if (step.drag && step.target2){
    const t2 = step.target2();
    if (t2){ const r2 = t2.getBoundingClientRect();
      hand.style.setProperty('--dx', (r2.left + r2.width / 2 - cx) + 'px');
      hand.style.setProperty('--dy', (r2.top - r.top) + 'px'); }
  }
  // keep the label on-screen (targets in the edge columns would clip it)
  const lbl = hand.querySelector('.handlabel');
  lbl.style.transform = 'translateX(-50%)';
  const lr = lbl.getBoundingClientRect();
  let shift = 0;
  if (lr.left < 8) shift = 8 - lr.left;
  else if (lr.right > innerWidth - 8) shift = (innerWidth - 8) - lr.right;
  if (shift) lbl.style.transform = `translateX(calc(-50% + ${Math.round(shift)}px))`;
}

function bounceNest(i){
  const el = document.querySelectorAll('#nests .nest')[i];
  if (el){ el.classList.remove('hurry'); void el.offsetWidth; el.classList.add('hurry'); }
}

function note(msg){
  S.log.unshift(msg);
  S.log = S.log.slice(0, 40);
  const el = $('#log');
  if (el){ el.textContent = msg; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

const hms = sec => {
  const s = Math.floor(sec), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (h ? `${h}h ` : '') + `${h ? String(m).padStart(2, '0') : m}m ${String(s % 60).padStart(2, '0')}s`;
};

const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return n.toLocaleString();
};
