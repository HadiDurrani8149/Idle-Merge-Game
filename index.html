/** One more slot. This is the late-game gem sink now that boosters are
 *  flat-priced — it is per-crate, it never goes free, and it is the only thing in
 *  the game that buys STORAGE rather than speed. */
function crateUpgrade(i){
  const c = S.grid[i];
  if (!c || c.kind !== 'crate') return;
  const lvl = c.lvl || 0;
  if (lvl >= CrateMaxLevel(C)){ note('That crate is fully upgraded.'); return; }
  const cost = CrateUpgradeCost(C, lvl);
  if (S.gems < cost){
    shakeSel(`[data-tap="crateup:${i}"]`);
    note(`Need ${fmt(cost)} gems.`);
    return;
  }
  S.gems -= cost;
  S.stats.coinsSpent += 0;
  c.lvl = lvl + 1;
  S.stats.crateLevels++;
  play('bought');
  purchaseFx(`[data-tap="crateup:${i}"]`, 'gems', 4);
  toast(`Crate holds ${crateSlots(c)} eggs`, 'start');
  markDirty('grid'); markDirty('popup');
}

/** Hand over a crate. Row rewards call this; if the board is full it waits, the
 *  same way a star-reward egg does — silently losing a prize you just earned is
 *  worse than making you wait for it. */
function grantCrate(){
  const slot = freeCell();
  if (slot < 0){ S.pendingCrates++; toast('Crate waiting — board is full', 'start'); return false; }
  S.grid[slot] = { kind: 'crate', lvl: 0, eggs: [], bonusAt: performance.now() };
  S.stats.crates++;
  play('unlock', 5);
  celebrate();
  pushFx({ where: 'confetti', i: slot, cls: 'gold' });
  queueBounce('grid', slot);
  // The FIRST crate gets the same treatment as the first fire slime: a card that
  // says what the object is. A crate is even less self-explanatory than a slime —
  // it does nothing visible until the board fills, and a box that sits there doing
  // nothing is indistinguishable from a bug.
  if (!S.crateSeen){
    S.crateSeen = true;
    S.cratePopupIntro = true;
    markDirty('popup');
  } else {
    toast(`\u{1F4E6} Row complete — free crate! Holds ${C.protoCrateBase} eggs`, 'start');
  }
  markDirty('grid');
  return true;
}

function flushPendingCrates(){
  while (S.pendingCrates > 0){
    if (freeCell() < 0) return;
    S.pendingCrates--;
    grantCrate();
  }
}

function spawnEgg(nest){
  const variant = rollEggVariant(nest);
  const slot = freeCell();
  if (slot === -1){
    // THE CRATE, and this is the whole reason it exists. The model says 96-98% of
    // every egg this game produces overflows and is sold into the carton for coins
    // the player already has too many of. A crate intercepts that: the egg is kept
    // instead of converted, and it is kept AS AN EGG, so it can still become a
    // chicken later. Coins are what you get when you have nowhere to put an egg;
    // a crate is what you buy so that stops happening.
    if (crateStore(variant)) return;
    const v = eggCoins();
    S.coins += v;
    S.stats.cartons++; S.stats.cartonCoins += v;
    // A crated SPECIAL pays protoSpecialCratedGems, which ships at 0: a full
    // board costs you the whole egg. Paying out anyway would make overflow free
    // and the gem faucet would stop needing a board at all. The handle exists
    // because that sting is worth playtesting.
    if (isSpecial(variant)){
      const g = C.protoSpecialCratedGems;
      S.gems += g;
      S.stats.specialCrated++; S.stats.gemsEarned += g;
      // Only if it actually paid. Firing the "you earned your first gem" lesson
      // off a zero payout both lies and burns the scripted first special.
      if (g > 0){ fillPiggy(g); firstGem(); }
    }
    const now = performance.now();
    if (now - (spawnEgg._lastFloat || 0) > 320){
      spawnEgg._lastFloat = now;
      coinSplash(v, null);
    }
    return;
  }
  S.grid[slot] = { kind: 'egg', seg: 0, t: 0, born: performance.now(), variant };
  if (isRare(nest?.kind)) S.grid[slot].hb = C.protoRareHatchBonus;   // this hen will hatch higher
  // A special arriving is the single best thing that happens in this loop, so
  // it gets an event: confetti around the cell the moment it lands.
  if (isSpecial(variant)){
    S.stats[variant]++;
    play(variant === 'gold' ? 'discover' : 'unlock', 6);
    queueFx(slot, variant === 'gold' ? 'goldpop' : 'silverpop');
    pushFx({ where: 'confetti', i: slot, cls: variant });
  }
  markDirty('grid');
}

function crackSegment(i, auto = false){
  const cell = S.grid[i];
  if (!cell || cell.kind !== 'egg') return;
  const kind = eggKind(cell), segs = eggSegs(cell);
  cell.seg = (cell.seg || 0) + 1;
  cell.t = 0;                                   // a tap consumes the live segment
  // Slimes touching this cell make it pay more, from slime tier 3 up. Read here
  // rather than cached on the cell: a slime can be dragged next to an egg
  // mid-crack, and the next segment should already know about it.
  const aura = slimeAura(i);
  // A special pays NO coins. It occupies a cell for 1.5x or 3x as long as a
  // normal egg, and the board is the ceiling in this game — if it paid coins
  // too it would strictly dominate the egg it displaced.
  const v = EggPaysCoins(kind) ? Math.round(segCoins() * (1 + aura.coin)) : 0;
  S.coins += v;
  // Every crack of a special pays gems, auto-cracks included — otherwise the
  // faucet would quietly reward hovering over the board rather than building
  // the nests that produce them.
  if (isSpecial(kind)){
    let g = EggTapGems(C, kind, cell.seg - 1, S.upg.gembonus);
    if (g > 0 && aura.gem > 0) g = Math.max(1, Math.round(g * (1 + aura.gem)));
    if (g > 0){
      S.gems += g;
      S.stats.gemsEarned += g;
      fillPiggy(g); firstGem();
      gemSplash(g, i);
    }
    S.tutorial = false;
  }
  // Auto and manual pay identically; the only difference is that a tap is
  // instant. Auto-cracks show a throttled splash so the coins are visible.
  if (!auto){ S.stats.taps++; if (v > 0) coinSplash(v, i); play('tap', cell.seg);
    coach('tapEgg', '\u{1F95A}', 'Tap to crack', 'Tap an egg to crack a piece early and pocket the coins — no need to wait for the timer.'); }
  else if (performance.now() - (crackSegment._lastAuto || 0) > 260){
    crackSegment._lastAuto = performance.now();
    if (v > 0) coinSplash(v, i);
    play('tap', cell.seg);
  }
  if (cell.seg >= segs) hatchAt(i);
  else queueFx(i, 'jolt');          // very slight — it happens up to 12x on a gold egg
  markDirty('grid');
}

/** Tier 10 is the end of the run. Nothing removes a maxed bird from the board,
 *  so without this the board silently clogs with them — and the player has no
 *  idea they finished. Called from anywhere maxTier can rise. */
/** Fires once, when the tier-3 chicken appears: point at the nest, because the
 *  upgrade card is behind a tap nothing else in the game teaches. Tier 3 is
 *  chosen because it is the first tier that is clearly a PROGRESSION rather
 *  than the starting state, so the player is receptive to being told there is
 *  something to spend on. */
/** Gifts that fire the first time a tier is reached. Kept separate from
 *  UnlocksAtTier (which only ever DESCRIBED a tier) because these hand over real
 *  currency, so they must fire exactly once and from one place — every route that
 *  can raise maxTier calls this, the same way they all call checkNestTutorial. */
/* Gifts are granted the moment the tier is reached (so the state is always
 * correct), but their ANIMATION is queued and played when the tier popup is
 * dismissed. That ordering is the whole teaching device: the icon leaves the card
 * you are looking at and flies to the control that now owns it, so the player
 * learns where the thing lives instead of being told it exists. */
function queueGiftFx(html, sel){
  (S.giftFx = S.giftFx || []).push({ html, sel });
}

/** Fire the queued gift animations, staggered, and bounce each destination. */
function flushGiftFx(){
  const q = S.giftFx || [];
  S.giftFx = [];
  const from = $('#app')?.getBoundingClientRect();
  q.forEach((g, k) => setTimeout(() => {
    const t = document.querySelector(g.sel);
    if (!t || !from) return;
    // start from the middle of the screen — where the card the player just
    // dismissed was — and land on the control
    const src = { left: innerWidth / 2 - 20, top: innerHeight / 2 - 20, width: 40, height: 40 };
    flyTo(g.sel, src, g.html, 5, 'g');
    setTimeout(() => {
      t.classList.remove('gifted'); void t.offsetWidth; t.classList.add('gifted');
      setTimeout(() => t.classList.remove('gifted'), 900);
    }, 520);
  }, k * 420));
}

function checkTierGifts(){
  S.gifted = S.gifted || {};
  // Ten free eggs at the tier-4 chicken. They land on the Buy Egg button's
  // existing FREE xN tag rather than on the board: ten eggs dumped onto an
  // eight-cell board would overflow straight into the carton, and the point is
  // that YOU choose when to spend them.
  if (S.maxTier >= C.protoFreeEggTier && !S.gifted.eggs){
    S.gifted.eggs = true;
    S.freeEggs += C.protoFreeEggGift;
    play('purchase');
    celebrate();
    toast(`\u{1F95A} ${C.protoFreeEggGift} free eggs — tap Buy Egg`, 'start');
    queueGiftFx(eggSVG(22, 0, 4), '#buyEgg');
  }
  // Tier 8 is where interstitials begin — the one tier whose "reward" is something
  // being taken away. The gems are the apology, and they are handed over on the
  // same popup so the two land together rather than the ad arriving alone.
  if (S.maxTier >= C.protoFreeGemTier && !S.gifted.gems){
    S.gifted.gems = true;
    S.gems += C.protoFreeGemGift;
    S.stats.gemsEarned += C.protoFreeGemGift;
    play('purchase');
    celebrate();
    toast(`\u{1F48E} +${C.protoFreeGemGift} gems`, 'start');
    queueGiftFx(gemSVG(20), '#gems');
  }
  // Auto-merge arrives at tier 7, and two Speed boosters arrive with it. This is
  // the moment the bottom bar goes from one consumable to two, so it is also the
  // moment a player with an empty Speed shelf most needs to be shown that the
  // shelf has sections.
  if (S.maxTier >= C.protoMergeUnlockTier && !S.gifted.speed){
    S.gifted.speed = true;
    S.stock.speed += C.protoMergeUnlockSpeedGift;
    toast(`⚡ +${C.protoMergeUnlockSpeedGift} Speed boosters`, 'start');
    queueGiftFx('<span style="font-size:19px">⚡</span>', '#boostSpeed');
  }
  // DAILY TASKS, at tier 5 — which is also the one empty early tier. The pill has
  // been hidden until now, so it gets a flight of its own AND the panel opens by
  // itself once: a control that appears in the HUD with no announcement is a
  // control nobody presses.
  if (S.maxTier >= C.protoTaskUnlockTier && !S.gifted.tasks){
    S.gifted.tasks = true;
    rollTasks();
    play('unlock', 6);
    queueGiftFx('<span style="font-size:19px">\u{1F4CB}</span>', '#tasksBtn');
    S.autoOpenTasks = true;
  }
}

function checkNestTutorial(){
  if (S.nestTutorialDone || S.maxTier < C.protoNestTutorialTier) return;
  if (!S.nestsOwned || S.nests[0]?.tier == null) return;
  S.nestTutorialDone = true;
  S.nestTutorial = true;
  S.nestTutorialStage = 'open';
  toast('Tap your nest — the first upgrade is free', 'start');
  markDirty('nest');
}

/* ═════════════════════ DAILY TASKS ═════════════════════
 * Six a day, one gem each, four more for clearing the set, on a 24-hour reset.
 *
 * Three decisions carry the whole feature:
 *
 * 1. PROGRESS IS MEASURED AGAINST A SNAPSHOT. `base` records every counter the
 *    moment the list is rolled, and a task's progress is (now - base). Without it
 *    "Merge 10 chickens" is already complete on day two for anyone who has ever
 *    merged ten chickens, and the whole list self-completes on arrival.
 *
 * 2. THE POOL IS GATED. Only tasks whose gate passes can be drawn — see
 *    TASK_POOL. A checklist containing something you cannot do yet is a bonus you
 *    are being shown and denied.
 *
 * 3. ONE SLOT IS ALWAYS RETENTION. Exactly one task per day asks for a SECOND
 *    SESSION rather than more of this one. It is the only thing a daily list can
 *    do that an achievements panel cannot.
 *
 * KNOWN LIMIT, stated plainly: this build has no save system — `newState()` runs
 * fresh on every load — so the day resets when the page does, exactly like the
 * existing daily coins and daily gems. The 24-hour timer is real within a session.
 * Making dailies actually daily is a persistence job, not a task-system job.
 */

const TASK_MS = () => C.protoTaskResetHours * 3600 * 1000;
const tasksUnlocked = () => S.maxTier >= C.protoTaskUnlockTier;
const tasksLeft = () => Math.max(0, TASK_MS() - (Date.now() - (S.tasks.at || 0)));

/** Snapshot every counter a task can read. */
function taskBase(){
  const base = {};
  for (const t of TASK_POOL) base[t.id] = t.value(S);
  return base;
}

/** Roll a fresh day: one retention task plus five others, all gated, shuffled. */
function rollTasks(){
  const ok = TASK_POOL.filter(t => taskAvailable(t, S, C));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => arr
    .map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  const retention = ok.filter(t => t.retention);
  const rest = shuffle(ok.filter(t => !t.retention));
  const list = [];
  if (retention.length) list.push(pick(retention).id);
  for (const t of rest){
    if (list.length >= C.protoTaskCount) break;
    list.push(t.id);
  }
  S.tasks = { list, claimed: [], bonusClaimed: false, at: Date.now(), base: taskBase() };
  // The come-back task measures a gap from NOW, so the clock restarts with the day.
  S.lastPlayedAt = Date.now();
  markDirty('tasks');
}

const taskDef = id => TASK_POOL.find(t => t.id === id);
/** How far into a task you are, measured from the day's snapshot. */
function taskProgress(id){
  const t = taskDef(id);
  if (!t) return 0;
  return Math.max(0, Math.min(TaskNeed(C, t), t.value(S) - (S.tasks.base?.[id] ?? 0)));
}
const taskDone     = id => taskProgress(id) >= TaskNeed(C, taskDef(id));
const taskClaimed  = id => S.tasks.claimed.includes(id);
const taskClaimable= id => taskDone(id) && !taskClaimed(id);
const tasksAllDone = () => S.tasks.list.length > 0 && S.tasks.list.every(taskClaimed);
/** What the pill's badge counts: things you can collect right now. */
const tasksReady = () =>
  S.tasks.list.filter(taskClaimable).length +
  (tasksAllDone() && !S.tasks.bonusClaimed ? 1 : 0);

function claimTask(id){
  if (!taskClaimable(id)) return;
  S.tasks.claimed.push(id);
  S.gems += C.protoTaskGem;
  play('gem');
  flyTo('#gems', $(`[data-tap="task:${id}"]`)?.getBoundingClientRect(),
        gemSVG(16), C.protoTaskGem, 'g');
  toast(`+${C.protoTaskGem} gem — ${taskDef(id)?.label}`, 'start');
  markDirty('tasks');
}

function claimTaskBonus(){
  if (!tasksAllDone() || S.tasks.bonusClaimed) return;
  S.tasks.bonusClaimed = true;
  S.gems += C.protoTaskAllBonus;
  play('purchase');
  celebrate();
  flyTo('#gems', $('#taskdrop')?.getBoundingClientRect(),
        gemSVG(18), C.protoTaskAllBonus, 'g');
  toast(`All done — +${C.protoTaskAllBonus} bonus gems!`, 'start');
  markDirty('tasks');
}

/** Called every tick. Rolls the day over, and drives the come-back task. */
function tickTasks(){
  if (!tasksUnlocked()) return;
  if (!S.tasks.at || Date.now() - S.tasks.at >= TASK_MS()){ rollTasks(); return; }
  // THE RETENTION TASK. Any interaction stamps lastPlayedAt; if the gap since the
  // previous stamp was longer than protoTaskReturnMinutes, the player has come
  // back from a real break and the task completes. Measured on wall-clock
  // Date.now(), never on S.elapsed — S.elapsed is scaled by the debug time
  // controls, and a task about real absence must not be completable at 200x.
  if (S.tasks.list.includes('comeback') && !S.stats.returned && S.lastPlayedAt){
    const gapMin = (Date.now() - S.lastPlayedAt) / 60000;
    if (gapMin >= C.protoTaskReturnMinutes){
      S.stats.returned = 1;
      play('unlock', 5);
      toast('⏰ Welcome back — daily task complete', 'start');
      markDirty('tasks');
    }
  }
}

/** Stamp "the player is here". Called from any real interaction. */
function touchPlayed(){
  const now = Date.now();
  if (S.lastPlayedAt && S.tasks.list?.includes('comeback') && !S.stats.returned){
    if ((now - S.lastPlayedAt) / 60000 >= C.protoTaskReturnMinutes){
      S.stats.returned = 1;
      play('unlock', 5);
      toast('⏰ Welcome back — daily task complete', 'start');
      markDirty('tasks');
    }
  }
  S.lastPlayedAt = now;
}

/* ─────────────────── MUTATION ───────────────────
 * A merge does not only produce the bird you merged for — it can also throw out a
 * fire slime beside it. That is the entire mechanic, and the placement is the
 * design: the slime lands TOUCHING the merge, so the first one a player ever sees
 * arrives at the exact spot they were already looking at.
 *
 * Chance is 1% x the tier merged INTO, capped at 15%, and nothing below
 * protoSlimeUnlockTier mutates at all — a slime appearing during the first two
 * merges would land on top of the silver-egg and nest tutorials.
 */
function maybeMutate(tier, nearIdx){
  const p = MutationChance(C, tier);
  if (p <= 0 || Math.random() >= p) return false;
  const slot = freeCellNear(nearIdx);
  // Deliberately NO consolation prize when there is no room. A queued mutation
  // (the way star-reward eggs queue) would arrive minutes later attached to
  // nothing, and a mutation that is not visibly caused by a merge teaches the
  // player nothing about where slimes come from.
  if (slot < 0) return false;
  S.grid[slot] = { kind: 'slime', tier: 1, bonusAt: performance.now() };
  S.stats.mutations++;
  revealSlime(slot);
  markDirty('grid');
  return true;
}

/** Everything that happens when a slime becomes visible, from a mutation or from
 *  a slime egg. The FIRST one gets the full treatment — confetti, the whole-screen
 *  celebration and a modal that explains what the thing is — because a new species
 *  quietly appearing on the board with no explanation reads as a rendering bug.
 *  Every one after that gets confetti and a line of toast. */
function revealSlime(slot){
  pushFx({ where: 'confetti', i: slot, cls: 'gold' });
  queueFx(slot, 'goldpop');
  S.maxSlimeTier = Math.max(S.maxSlimeTier || 0, 1);
  if (!S.slimeSeen){
    S.slimeSeen = true;
    play('discover', 8);
    celebrate();
    S.mutPopup = true;
    markDirty('popup');
  } else {
    play('unlock', 7);
    toast('\u{1F525} Mutation — a fire slime!', 'start');
  }
}

/** A slime pair merging. Its own ladder, its own cap, and a smaller coin payout
 *  than a chicken merge of the same tier — a slime is not a coin engine, it is an
 *  aura, and paying chicken money for it would make slimes the better merge. */
function slimeMergeReward(nt, gridIdx = null, landed = null){
  play('merge', nt);
  S.maxSlimeTier = Math.max(S.maxSlimeTier || 0, nt);
  const bonus = Math.round(MergeBonus(C, nt) * C.protoSlimeMergeBonusShare);
  S.coins += bonus;
  S.stats.slimeMerged++;
  coinSplash(bonus, gridIdx);
  if (landed) queueBounce(landed.where, landed.i);
  else if (gridIdx != null) queueBounce('grid', gridIdx);
  toast(`\u{1F525} Slime ${nt} — +${Math.round(SlimeHatchBoost(C, nt) * 100)}% hatch speed` +
        (SlimeCoinBonus(C, nt) > 0 ? `, +${Math.round(SlimeCoinBonus(C, nt) * 100)}% egg coins` : ''),
        'start');
  return bonus;
}

/* ─────────────────── RARE BRANCH: rolls, rewards, discovery ───────────────────
 * `maybeBranch` is the single fork door. Any merge INTO a fork tier of a species
 * that HAS a branch gets one roll to drop that branch's tier-1 seed into a free
 * cell touching the merge — exactly how a slime arrives. It is called from BOTH
 * the chicken merge path (trunk -> rare) and the rare merge path (rare -> sub-
 * rare), which is what makes the tree recurse through one piece of code. */
function maybeBranch(fromKind, tier, nearIdx){
  for (const key of branchesFrom(fromKind)){
    const b = BRANCHES[key];
    if (breedFullyDone(key)) continue;   // #1 a finished breed stops dropping
    if (tier !== b.forkTier) continue;
    if (Math.random() >= b.chance) continue;
    const slot = freeCellNear(nearIdx);
    // No room, no consolation — same rule the slime mutation follows, and for the
    // same reason: a rare that is not visibly caused by a merge teaches nothing.
    if (slot < 0) return false;
    S.grid[slot] = { kind: key, tier: 1, bonusAt: performance.now() };
    revealRare(key, slot);
    markDirty('grid');
    return true;                       // at most one rare per merge
  }
  return false;
}

function discoverRare(kind, tier){
  if (!S.seenRare) S.seenRare = {};
  if (tier <= (S.seenRare[kind] || 0)) return;
  S.seenRare[kind] = tier;
}

function revealRare(kind, slot){
  const b = BRANCHES[kind];
  pushFx({ where: 'confetti', i: slot, cls: 'gold' });
  queueFx(slot, 'goldpop');
  const first = !(S.seenRare && S.seenRare[kind]);
  discoverRare(kind, 1);
  if (first){
    play('discover', 8);
    celebrate();
    toast(`${b.glyph} Rare find — a ${b.name}!`, 'start');
    coach('rare', b.glyph, 'A rare breed!', 'Merge rares up their own line for the tree (tap \u{1F333}) \u2014 or drop one in a nest: rares are premium layers, faster eggs that hatch higher.', 9000);
  } else {
    play('unlock', 7);
    toast(`${b.glyph} Another ${b.short}!`, 'start');
  }
}

/** A rare pair merging up its own ladder. Pays a coin bonus (a little under a
 *  hen's, like the slime), records the tier for the collection, and rolls its
 *  OWN fork — this is where a Galaxy merge can throw a Nebula. */
/** A rare breed is "finished" only when its OWN ladder is maxed AND every branch
 *  it can throw is finished too. Without the recursion, switching off a parent's
 *  drops (Galaxy) would strand a sub-rare that only forks off it (Nebula). */
function breedFullyDone(key){
  if ((S.seenRare?.[key] || 0) < BRANCHES[key].max) return false;
  for (const sub of branchesFrom(key)) if (!breedFullyDone(sub)) return false;
  return true;
}

/** #2 GRADUATION. The moment a rare tops out ON THE BOARD it flies into the
 *  collection avatar for a gem reward and frees the cell — a finished breed never
 *  squats on the grid. A maxed rare sitting in a NEST is a producer, not clutter,
 *  so graduation deliberately never touches nests. */
function graduateRare(kind, gi){
  const b = BRANCHES[kind];
  const gems = Math.round((C.protoGraduateGemsPerMax || 0) * b.max);
  const cell = document.querySelector(`[data-drag="grid:${gi}"]`)
            || document.querySelector(`[data-drop="grid:${gi}"]`);
  const from = cell?.getBoundingClientRect();
  if (from) flyTo('#nextPill', from, rareSVG(kind, b.max, 30, false), 1, 'grad');
  S.grid[gi] = null;                                  // free the cell right away
  if (gems > 0){ S.gems += gems; gemSplash(gems, gi); }
  celebrate();
  try { play('boostMerge'); } catch (_){ }
  toast(`${b.glyph} ${b.short} complete \u2014 collected! +${fmt(gems)} gems`, 'start');
  markDirty('grid'); markDirty('coll'); markDirty('shop');
}

function rareMergeReward(kind, nt, gridIdx = null, landed = null){
  const b = BRANCHES[kind];
  play('merge', nt);
  discoverRare(kind, nt);                       // record the tier for the tree
  const maxed = nt >= b.max;
  const nested = !!(landed && landed.where === 'nest');
  const gi = nested ? null
           : gridIdx != null ? gridIdx
           : (landed && landed.where === 'grid' ? landed.i : null);
  if (maxed && gi != null){ graduateRare(kind, gi); return 0; }   // #2 graduate off the board
  if (maxed) celebrate();                        // maxed in a nest → stays as a producer
  // a rare's own merge can fork into a SUB-rare (Galaxy -> Nebula), same door as the trunk
  maybeBranch(kind, nt, gridIdx != null ? gridIdx : (landed?.where === 'grid' ? landed.i : null));
  if (landed) queueBounce(landed.where, landed.i);
  else if (gridIdx != null) queueBounce('grid', gridIdx);
  toast(`${b.glyph} ${b.short} ${nt}${maxed ? ' \u00b7 maxed!' : ''}`, 'start');
  return 0;                                       // no coins — rares are a collection chase, not income
}

const speciesMax = kind =>
  kind === 'slime' ? slimeMaxTier()
  : isRare(kind)   ? BRANCHES[kind].max
  : C.tiersPerArea;

function hatchAt(i){
  const cell = S.grid[i];
  if (!cell || cell.kind !== 'egg') return;
  // A slime egg hatches a SLIME, always at tier 1. Not at the chicken hatch floor:
  // the two ladders are separate, and a nested slime handing out tier-10 slimes
  // because your chickens are at tier 20 would make the aura free.
  if (eggKind(cell) === 'slime'){
    S.grid[i] = { kind: 'slime', tier: 1 };
    S.stats.hatched++;
    play('hatch');
    featherBurst(i, 1);
    queueFx(i, 'hatched');
    revealSlime(i);
    markDirty('grid');
    return;
  }
  const tier = Math.min(C.tiersPerArea, hatchTier(eggKind(cell)) + (cell.hb || 0));
  S.grid[i] = { kind: 'chicken', tier };
  S.stats.hatched++;
  if (tier > S.maxTier){ S.maxTier = tier; checkNestTutorial(); checkTierGifts(); }
  play('hatch');
  discover(tier);
  featherBurst(i, tier);
  queueFx(i, 'hatched');            // the bird arriving, not the shell breaking
  markDirty('grid');
}

/** Everything a completed merge pays out, in one place. There are four ways to
 *  merge now — grid onto grid, nest onto grid, grid onto nest, and the
 *  auto-merge boost — and they must all award identically or the player learns
 *  to prefer one gesture for reasons that are purely a bug. */
function mergeReward(nt, gridIdx = null, silent = false, landed = null){
  play('merge', nt);
  if (!silent) coach('merge', '\u2728', 'Nice merge!', 'Drag two of the SAME bird together to merge them up a tier. Climb the ladder for bigger payouts.');
  const bonus = MergeBonus(C, nt);
  S.coins += bonus;
  S.stats.merged++;
  if (nt > S.maxTier){ S.maxTier = nt; checkNestTutorial(); checkTierGifts(); }
  discover(nt);
  // Every merge path routes through here — grid onto grid, nest onto grid, grid
  // onto nest and the auto-merge boost — so this is the one place the mutation
  // roll belongs. Putting it in tryMerge alone would have made three of the four
  // gestures unable to mutate, which is precisely the class of bug the comment
  // above this function was written about.
  maybeMutate(nt, gridIdx != null ? gridIdx : (landed?.where === 'grid' ? landed.i : null));
  // Same door as the mutation, one line down: a hen merge into a fork tier can
  // also drop a rare-branch seed. Routed through here for the same reason the
  // mutation is — all four merge gestures must be able to fork, not just one.
  maybeBranch('chicken', nt, gridIdx != null ? gridIdx : (landed?.where === 'grid' ? landed.i : null));
  if (!silent) coinSplash(bonus, gridIdx);
  // Queue the bounce rather than running it here. markDirty('grid') replaces
  // the whole board's innerHTML on the next frame, which threw away the class
  // one frame in — the animation was being started and immediately deleted,
  // which is why a merge barely registered as anything.
  // `silent` is the batch/auto-merge path — no splash, and no bounce either
  if (silent){ /* nothing to show */ }
  else if (landed) queueBounce(landed.where, landed.i);
  else if (gridIdx != null) queueBounce('grid', gridIdx);
  return bonus;
}

/* Effects have to be applied AFTER the render that draws their result, because
 * markDirty replaces the whole board's innerHTML on the next frame and would
 * throw the class straight back away. So they queue. */
let fxQueue = [];
// Capped. A queue longer than a few entries means something ran a batch
// between frames — the tuning panel's ladder simulation merges tens of
// thousands of times in one synchronous loop — and turning every one of those
// into a DOM node takes the tab down. Only the most recent are worth showing.
const FX_MAX = 8;
const pushFx = fx => { fxQueue.push(fx); if (fxQueue.length > FX_MAX) fxQueue.shift(); };
const queueBounce = (where, i) => pushFx({ where, i, cls: 'pop', ring: true });
const queueFx = (i, cls) => pushFx({ where: 'grid', i, cls, ring: false });

/* ─────────────────── the merge vanish ───────────────────
 * A merge used to be one bird appearing and one bird ceasing to exist between two
 * frames, and it read as the piece you dragged being DELETED rather than absorbed.
 * The bounce on the survivor was doing all the work.
 *
 * This copies the source tile's art into a throwaway fixed-position node at the
 * exact rect it occupied and scales it down toward the target while fading. It has
 * to be a copy on <body>: the tile itself is about to be replaced by
 * markDirty('grid'), so anything animated on the live node is thrown away one
 * frame later — the same trap the merge bounce fell into and the reason
 * queueBounce exists at all.
 */
function vanishAt(rect, html){
  if (!rect || !rect.width) return;
  const d = document.createElement('div');
  d.className = 'vanish';
  d.innerHTML = html;
  d.style.left = rect.left + 'px';
  d.style.top = rect.top + 'px';
  d.style.width = rect.width + 'px';
  d.style.height = rect.height + 'px';
  // 200ms and the removal is timed to match. It used to drift toward the tile it
  // merged into over 340ms; IN PLACE is better and the reason is legibility. The
  // survivor is playing its own bounce at the same moment, so a second piece
  // travelling across the board draws the eye AWAY from the thing that actually
  // happened. Shrinking on the spot reads as "consumed here" in a fifth of a
  // second and leaves the bounce to carry the result.
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 240);
}

/** Vanish the piece currently drawn in grid cell `i`. Must be called BEFORE the
 *  state is changed, while the tile is still on screen. */
function vanishGrid(i){
  const el = document.querySelector(`[data-drop="grid:${i}"]`);
  const c = S.grid[i];
  if (!el || !c) return;
  const art = c.kind === 'slime' ? slimeSVG(c.tier, 62) : chickenSVG(c.tier, 62);
  vanishAt(el.getBoundingClientRect(), art);
}

/** A ring of specks thrown out from a cell. Used when a special egg lands,
 *  which is the rarest good thing that happens on the board — a gold egg at
 *  ~2% is roughly one every fifty eggs, so it can afford to be loud. */
function confettiAt(gridIdx, kind = 'silver'){
  const host = document.querySelector(`[data-drop="grid:${gridIdx}"]`);
  if (!host) return;
  const r = host.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = kind === 'gold'
    ? ['#FFD870', '#FFF3C4', '#E8A427', '#FFFBEA']
    : ['#EDF1F5', '#C4CBD4', '#FFFFFF', '#9FB0C2'];
  const n = kind === 'gold' ? 22 : 14;
  for (let k = 0; k < n; k++){
    const d = document.createElement('i');
    d.className = 'conf';
    const a = (k / n) * Math.PI * 2 + Math.random() * 0.5;
    const dist = (kind === 'gold' ? 46 : 34) + Math.random() * 26;
    d.style.cssText =
      `left:${cx}px;top:${cy}px;background:${cols[k % cols.length]};` +
      `--dx:${(Math.cos(a) * dist).toFixed(1)}px;--dy:${(Math.sin(a) * dist).toFixed(1)}px;` +
      `--rot:${Math.round(Math.random() * 540 - 270)}deg;` +
      `animation-delay:${(Math.random() * 90).toFixed(0)}ms`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1200);
  }
}

/** An overflow egg dropping into a crate: it arcs in from above the tile, pops,
 *  and the crate bounces to receive it. This is the only visible evidence that
 *  owning a crate changed anything — without it the egg is a number ticking and a
 *  gauge moving, both of which a player watching the board will miss. */
function crateInFx(gridIdx, variant = 'normal'){
  const host = document.querySelector(`[data-drop="grid:${gridIdx}"]`);
  if (!host) return;
  const r = host.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'cratein';
  d.innerHTML = eggSVG(Math.round(r.width * 0.44), 0, 4, 0, variant);
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top  = (r.top + r.height * 0.42) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 520);
  // the crate takes the hit a beat after the egg lands, not on the same frame
  setTimeout(() => bounceEl(host, false), 230);
}

function flushBounce(){
  if (!fxQueue.length) return;
  const q = fxQueue; fxQueue = [];
  for (const { where, i, cls, ring } of q){
    if (where === 'confetti'){ confettiAt(i, cls); continue; }
    if (where === 'crateIn'){ crateInFx(i, cls); continue; }
    const el = where === 'nest'
      ? document.querySelectorAll('#nests .nest')[i]
      : document.querySelector(`[data-drop="grid:${i}"]`);
    if (!el) continue;
    if (cls === 'pop') bounceEl(el, ring);
    else { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
           setTimeout(() => el.classList.remove(cls), cls === 'laid' ? 420 : 600); }
  }
}

/** What buying something looks like. A flash across the card, a ring, and the
 *  currency you just spent flying to the balance in the header — the wallet is
 *  right there in the shop, so the transaction has somewhere to land instead of
 *  a number silently changing. */
function purchaseFx(sel, cur = 'coins', n = 5){
  const el = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!el) return;
  const r = el.getBoundingClientRect();
  // The card itself is re-rendered the moment the balance changes, so the flash
  // has to be applied to whatever node exists AFTER that — the same trap the
  // merge bounce fell into.
  if (typeof sel === 'string') requestAnimationFrame(() => requestAnimationFrame(() => {
    const live = document.querySelector(sel);
    if (!live) return;
    live.classList.add('bought');
    setTimeout(() => live.classList.remove('bought'), 700);
  }));
  else { el.classList.add('bought'); setTimeout(() => el.classList.remove('bought'), 700); }
  const ring = document.createElement('div');
  ring.className = 'ring buyring';
  ring.style.cssText += `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 520);
  // The shine gets its own clip box over the card rather than a ::before on the
  // card, which had nothing to clip it and travelled across the whole screen.
  const shine = document.createElement('div');
  shine.className = 'shineclip';
  shine.style.cssText +=
    `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;` +
    `border-radius:${getComputedStyle(el).borderRadius || '16px'}`;
  shine.innerHTML = '<i></i>';
  document.body.appendChild(shine);
  setTimeout(() => shine.remove(), 620);
  const gems = cur === 'gems';
  flyTo(gems ? '#shopGems' : '#shopCoins', r,
        gems ? gemSVG(15) : coinSVG(15), n, gems ? 'g' : 'c', true);
  sparkle(r, gems ? '#8FE0FF' : '#FFE480', 7);
}

/** A short burst of specks. Used on top of a purchase, and on its own for a
 *  real-money one, where the point is that it should feel like an event. */
function sparkle(r, colour, n = 8, spread = 1){
  for (let k = 0; k < n; k++){
    const d = document.createElement('div');
    d.className = 'spark';
    const a = (Math.PI * 2 * k) / n + Math.random() * 0.5;
    const dist = (34 + Math.random() * 46) * spread;
    d.style.left = (r.left + r.width / 2) + 'px';
    d.style.top  = (r.top + r.height / 2) + 'px';
    d.style.background = colour;
    d.style.setProperty('--sx', (Math.cos(a) * dist).toFixed(0) + 'px');
    d.style.setProperty('--sy', (Math.sin(a) * dist).toFixed(0) + 'px');
    d.style.animationDelay = (k * 22) + 'ms';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 900 + k * 22);
  }
}

/** A real-money purchase. Rarer and larger than anything else in the game, so
 *  it gets the whole screen for three quarters of a second. */
function celebrate(){
  const r = { left: innerWidth / 2 - 20, top: innerHeight / 2 - 20, width: 40, height: 40 };
  sparkle(r, '#FFD54A', 14, 3.4);
  setTimeout(() => sparkle(r, '#8FE0FF', 10, 4.4), 140);
  const g = document.createElement('div');
  g.className = 'glory';
  document.body.appendChild(g);
  setTimeout(() => g.remove(), 900);
}

/** Two or three feathers drifting off from a cell, gone inside 1.5s. Fixed to
 *  the viewport rather than parented to the tile, so they can travel past its
 *  edges without the board needing overflow. */
function featherBurst(gridIdx, tier = 1){
  const host = document.querySelector(`[data-drop="grid:${gridIdx}"]`);
  if (!host) return;
  const r = host.getBoundingClientRect();
  const n = 2 + (Math.random() < 0.5 ? 0 : 1);
  for (let k = 0; k < n; k++){
    const d = document.createElement('div');
    d.className = 'feather';
    const size = 13 + Math.random() * 8;
    // spread them across the tile and send each somewhere different, or three
    // identical arcs read as one sprite drawn three times
    d.style.left = (r.left + r.width * (0.25 + Math.random() * 0.5) - size / 2) + 'px';
    d.style.top  = (r.top + r.height * (0.3 + Math.random() * 0.3) - size / 2) + 'px';
    d.style.setProperty('--fx', (Math.random() * 74 - 37).toFixed(0) + 'px');
    d.style.setProperty('--fy', (-26 - Math.random() * 34).toFixed(0) + 'px');
    d.style.setProperty('--fr', (Math.random() * 300 - 150).toFixed(0) + 'deg');
    d.style.animationDelay = (k * 0.07).toFixed(2) + 's';
    d.innerHTML = featherSVG(size, k === 1 ? '#FFF0D4' : '#FFF8EC');
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }
}

function tryMerge(from, to, silent = false){
  const a = S.grid[from], b = S.grid[to];
  if (!a || !b) return false;
  // Two species, two ladders, and they never cross. A slime is not a low-tier
  // chicken and must not be mergeable into one.
  if (a.kind !== b.kind) return false;
  // Crates merge by CAPACITY rather than by tier, so they take their own path.
  if (a.kind === 'crate') return mergeCrates(from, to);
  if (!isCreature(a.kind)) return false;
  if (a.tier !== b.tier || a.tier >= speciesMax(a.kind)) return false;
  const nt = a.tier + 1;
  // The piece you PICKED UP is the one that disappears, so it is the one that
  // gets the vanish. Fired before the state changes, while the source tile is
  // still on screen and still has a bounding box to copy.
  if (!silent) vanishGrid(from);
  S.grid[to] = { kind: a.kind, tier: nt };
  S.grid[from] = null;
  if (a.kind === 'slime'){ if (!silent) slimeMergeReward(nt, to); }
  else if (isRare(a.kind)){ if (!silent) rareMergeReward(a.kind, nt, to); }
  else mergeReward(nt, to, silent);
  markDirty('grid');
  return true;
}

/** Auto-merge boost: clears the LOWEST tier that has a pair. Deliberately not
 *  "merge everything" — the high-tier decisions stay yours, only the clutter
 *  goes, so the boost removes tedium without automating the actual choice. */
let devAutoMerge = false;   // dev-tools toggle: run auto-merge every tick without a booster
function autoMergeLowest(){
  let did = false;

  // ── grid domain: the lowest merge that involves a board piece ──
  // either two matching board pieces, or one board piece dropped into a nest
  // that already holds the same creature at the same tier.
  let gbest = null;   // { tier, run }
  const groups = new Map();
  S.grid.forEach((c, i) => {
    if (c && isCreature(c.kind) && c.tier < speciesMax(c.kind)){
      const k = c.kind + ':' + c.tier;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    }
  });
  for (const [k, idx] of groups) if (idx.length >= 2){
    const tier = +k.slice(k.indexOf(':') + 1);
    if (!gbest || tier < gbest.tier) gbest = { tier, run: () => tryMerge(idx[0], idx[1]) };
  }
  // board -> nest: a lone board piece merges into a nest holding the same kind+tier
  S.grid.forEach((c, gi) => {
    if (!c || !isCreature(c.kind) || c.tier >= speciesMax(c.kind)) return;
    for (let ni = 0; ni < S.nestsOwned; ni++){
      const n = S.nests[ni];
      if (n && n.tier === c.tier && n.kind === c.kind){
        if (!gbest || c.tier < gbest.tier) gbest = { tier: c.tier, run: () => tryNest(gi, ni) };
        break;
      }
    }
  });
  if (gbest) did = gbest.run() || did;

  // ── nest domain: two coops holding the same creature at the same tier ──
  const ng = new Map();
  S.nests.forEach((n, i) => {
    if (i < S.nestsOwned && n && n.tier != null && isCreature(n.kind) && n.tier < speciesMax(n.kind)){
      const k = n.kind + ':' + n.tier;
      if (!ng.has(k)) ng.set(k, []);
      ng.get(k).push(i);
    }
  });
  let nbest = null;
  for (const [k, idx] of ng) if (idx.length >= 2){
    const tier = +k.slice(k.indexOf(':') + 1);
    if (!nbest || tier < nbest.tier) nbest = { tier, idx };
  }
  if (nbest) did = nestToNest(nbest.idx[0], nbest.idx[1]) || did;

  return did;
}

/** First time a tier is ever seen: coin windfall plus a modal, so a new
 *  chicken is an event rather than a slightly different sprite. */
function discover(tier){
  if (S.seen.has(tier)) return;
  S.seen.add(tier);
  const bonus = DiscoveryBonus(C, tier);
  S.coins += bonus;
  S.popup = { tier, bonus, sawVideo: false };
  markDirty('coll'); markDirty('popup');
}

/** Write a nest's OCCUPANT without touching its LEVEL.
 *  The level belongs to the coop slot, not the hen — you paid coins for the
 *  nest, not for the bird in it. Every site that rebuilt the object literal
 *  wiped `lvl`, which is invisible in play and would have read as "my upgrade
 *  didn't save". This is the only way nests should be written. */
function setNest(i, tier, prog = 0, kind = 'chicken'){
  const lvl = S.nests[i]?.lvl || 0;
  S.nests[i] = { tier, kind: tier == null ? 'chicken' : kind, prog, lvl };
}

function tryNest(gridIdx, nestIdx){
  if (nestIdx >= S.nestsOwned) return false;
  const cell = S.grid[gridIdx];
  // Slimes nest too — that is how you farm them — but a crate does not.
  if (!cell || !isCreature(cell.kind)) return false;   // hens, slimes AND rares can nest
  const n = S.nests[nestIdx];
  const prev = n.tier, prevKind = n.kind;

  // Same SPECIES and same tier already sitting in the nest? Merge into it rather
  // than swapping. The upgraded occupant stays nested, which is the outcome you
  // wanted when you aimed at an occupied nest — swapping an identical piece does
  // nothing at all. Species has to match: dropping a tier-3 slime on a tier-3 hen
  // is a swap, not a merge.
  if (prev != null && prevKind === cell.kind && prev === cell.tier
      && cell.tier < speciesMax(cell.kind)){
    const nt = cell.tier + 1;
    vanishGrid(gridIdx);
    setNest(nestIdx, nt, n.prog, cell.kind);
    S.grid[gridIdx] = null;
    if (cell.kind === 'slime') slimeMergeReward(nt, gridIdx, { where: 'nest', i: nestIdx });
    else if (isRare(cell.kind)) rareMergeReward(cell.kind, nt, gridIdx, { where: 'nest', i: nestIdx });
    else mergeReward(nt, gridIdx, false, { where: 'nest', i: nestIdx });
    play('nest');
    markDirty('grid'); markDirty('nest');
    return true;
  }

  play('nest');
  S.stats.nested++;
  setNest(nestIdx, cell.tier, 0, cell.kind);
  S.grid[gridIdx] = prev == null ? null : { kind: prevKind, tier: prev };
  markDirty('grid'); markDirty('nest');
  return true;
}

/** Tapping a hen shaves time off her current egg — the nest equivalent of
 *  tapping an egg, so both halves of production reward the same impulse. */
function hurryNest(nestIdx){
  const n = S.nests[nestIdx];
  if (n.tier == null) return;
  bounceNest(nestIdx);
  // The instant one-tap egg jump is OFF — a nest is now sped by holding it in a
  // timed boost via the Boost button in the card (tapBoostNest). Everything
  // below is the old behaviour, kept intact behind the flag: flip
  // C.protoNestInstantHurry to true to bring the one-tap hurry straight back.
  if (!C.protoNestInstantHurry) return;
  // Measured against THIS nest's lay time, so a tap on a slime nest shaves the
  // same number of seconds off a ten-times-longer wait — i.e. proportionally
  // less progress, which is correct: tapping must not undo the slime trade-off.
  const lay = nestLayTime(n) / layMult(S.upg.layspeed);
  S.stats.hurries++;
  coach('hurry', '\u{1F446}', 'Tap to hurry', 'Tapping a nest speeds up the next egg. Mash it when you are waiting on a lay.');
  n.prog = Math.min(1, n.prog + C.protoNestTapSeconds / lay);
  if (n.prog >= 1){ n.prog = 0; spawnEgg(n); }
  markDirty('nest');
}

/** The Boost button in the nest card. Each tap adds protoTapBoostSeconds to this
 *  nest's boost timer, capped at protoTapBoostCap, so mashing it ramps the nest
 *  into a boost PHASE instead of jumping one egg. While it runs the nest lays at
 *  protoTapBoostMult, compounding with the star boost and the Speed booster.
 *  This is the effort mechanic that replaced the instant hurry, so it also feeds
 *  the "hurry a hen" task that hurryNest used to. */
function tapBoostNest(i){
  const n = S.nests[i];
  if (!n || i >= S.nestsOwned || n.tier == null) return;
  const before = n.tapBoost || 0;
  if (before >= C.protoTapBoostCap){         // already maxed — nudge, don't stack past cap
    bounceNest(i); shakeSel(`[data-tap="tapboost:${i}"]`);
    return;
  }
  n.tapBoost = Math.min(C.protoTapBoostCap, before + C.protoTapBoostSeconds);
  S.stats.hurries++;
  play('boostSpeed');
  bounceNest(i);
  markDirty('nest'); markDirty('popup');
}

function unnest(nestIdx){
  const n = S.nests[nestIdx];
  if (n.tier == null) return;
  const slot = freeCell();
  if (slot === -1){ note('Board full — no room to take that one back.'); return; }
  S.grid[slot] = { kind: n.kind, tier: n.tier };
  setNest(nestIdx, null, 0);
  markDirty('grid'); markDirty('nest');
}

// ───────────────────────────── purchases ─────────────────────────────

function buyEgg(){
  const free = S.freeEggs > 0;
  const cost = free ? 0 : BuyEggCost(C, S.stats.bought);
  if (!free && S.coins < cost){ shakeSel('#buyEgg'); return; }
  const slot = freeCell();
  if (slot === -1){ note('Board is full.'); shakeSel('#buyEgg'); return; }
  if (free) S.freeEggs--; else { S.coins -= cost; S.stats.coinsSpent += cost; }
  S.stats.bought++;
  // A bought egg is never special. Gems have to come off the production line,
  // or coins would buy gems directly and the two currencies collapse.
  S.grid[slot] = { kind: 'egg', seg: 0, t: 0, born: performance.now(), variant: 'normal' };
  play('buy');
  coach('buyEgg', '\u{1F6D2}', 'Buying eggs', 'BUY drops a fresh egg on the board. Hatch a few, then drag matching birds together to merge them up.');
  markDirty('grid');
}

function buyNest(){
  if (S.nestsOwned >= C.maxNests) return;
  const cost = NestGemCost(C, S.nestsOwned + 1);
  if (S.gems < cost){ shakeSel('#nests .buyslot'); note(`Need ${fmt(cost)} gems.`); return; }
  S.gems -= cost;
  S.nestsOwned++;
  // The glow was a one-time "gems buy nests" lesson. Once it has been acted on,
  // the next tile revealed underneath must not inherit it.
  S.nestHintUntil = 0;
  play('unlock');
  note(`Nest ${S.nestsOwned} built`);
  markDirty('nest');
}

/** Level up a nest. COINS, and this is the only thing in the game that spends
 *  them at scale — 97-98% of eggs crate into coins and until now nothing could
 *  absorb that. A level buys golden-egg CHANCE and nothing else: no lay speed,
 *  because production is already 30x what the board can process and making it
 *  faster would change nothing at all. */
/** Tapping a hen used to only hurry her egg. It now ALSO opens her upgrade
 *  card — hurrying is the reflex action and stays, but the nest is the only
 *  place the level lives, so it has to be what you tap to find it. */
function tapNest(i){
  hurryNest(i);
  if (S.nestPopup !== i) openNestCard(i);
}

function openNestCard(i){
  if (i >= S.nestsOwned || S.nests[i]?.tier == null) return;
  S.nestPopup = i;
  // The arrow has done its job the moment the card is open.
  if (S.nestTutorial) S.nestTutorialStage = 'buy';
  play('open');
  markDirty('nest'); markDirty('popup');
}

function closeNestCard(){
  if (S.nestPopup == null) return;
  S.nestPopup = null;
  play('close');
  markDirty('nest'); markDirty('popup');
}

/** The card itself. Same shape as the reference: level, name, three stars, a
 *  progress bar, two stat readouts and one big buy button. It hangs BELOW the
 *  nest — there is room down there now the stall is gone — and it is allowed to
 *  overlap the board, because a card you can dismiss by tapping anywhere else
 *  costs nothing to have covered something. */
function renderNestCard(){
  const el = $('#nestcard');
  if (!el) return;
  const i = S.nestPopup;
  if (S.popup || S.rv || S.inter || S.confirm || S.mutPopup){
    el.classList.remove('open'); return;
  }
  if (i == null || i >= S.nestsOwned || S.nests[i]?.tier == null){
    el.classList.remove('open'); el.dataset.sig = ''; return;
  }
  const n = S.nests[i];
  const lvl = n.lvl || 0;
  const maxed = lvl >= C.protoNestLevelMax;
  const free = S.freeNestUpgrade && !maxed;
  const cost = NestLevelCost(C, lvl, i);   // per-nest multiplier: nest 4 costs more
  const stars = NestStars(C, lvl);
  const can = free || S.coins >= cost;

  // Affordability BOOLEAN in the signature, not the raw balance — coins tick
  // several times a second and a raw figure rebuilds this card constantly,
  // which is the trap that killed the shop sheet twice.
  // n.boost is a BOOLEAN in the signature, not the raw seconds — it ticks down
  // every frame and a raw value would rebuild this card thirty times a second,
  // which is the exact trap the comment below is about.
  const sig = [i, lvl, stars, maxed, free, can, n.tier, n.kind,
               n.boost > 0, n.tapBoost > 0, HatchFloor(C, S.maxTier)].join('|');
  if (el.dataset.sig === sig){ el.classList.add('open'); return; }
  el.dataset.sig = sig;

  const chance = specialChanceFor(n);
  const next = maxed ? chance : SpecialChanceFor(C, lvl + 1, n.tier);
  const sp = NestStarProgress(C, lvl);
  // The bar shows the CURRENT star tier only — filling it earns the star and
  // resets it — so twelve levels read as three short climbs instead of one slog.
  const barPct = (sp.maxed ? 1 : sp.frac) * 100;
  const prize = sp.maxed ? null : StarReward(C, sp.stars);
  const floor = HatchFloor(C, S.maxTier);

  el.innerHTML = `
    <div class="ncard">
      <div class="ncnest">${nestSVG(44, null, 0, '', sp.stars)}</div>
      <div class="nctitle">Level ${lvl}</div>
      <div class="ncname">Nest ${i + 1} upgrade</div>
      <div class="ncstars">${[0,1,2].map(k =>
        `<i class="${k < sp.stars ? 'on' : ''}">\u2605</i>`).join('')}</div>
      <div class="ncbar"><i style="width:${barPct.toFixed(1)}%"></i>${
        sp.maxed ? '' : `<span class="ncend">${prizeEggSVG(prize)}</span>`}</div>
      <!-- The SECOND bar. The blue one above is a long-term goal measured in
           purchases; this green one is the nest's CURRENT EGG, measured in
           seconds, with a plain egg on the end of it. Two bars stacked is the
           whole readout a nest needs: what am I working towards, and what is
           happening right now. It is patched in place by renderNestEggBar every
           frame \u2014 it must never enter this card's rebuild signature. -->
      <div class="ncbar egg"><i class="nceggfill" style="width:${(clamp01(n.prog) * 100).toFixed(1)}%"></i>
        <span class="ncend">${prizeEggSVG('normal', 24)}</span></div>
      <div class="ncstats">
        <span>${gemSVG(15)}${(chance * 100).toFixed(1)}%</span>
        <span class="nctime${n.boost > 0 ? ' hot' : ''}">${n.boost > 0 ? '\u26A1' : '\u25F4'}
          <b class="nceggsec">${Math.ceil(nestLayTime(n) * (1 - clamp01(n.prog)))}</b>s</span>
      </div>
      <button class="ncbuy${can ? '' : ' broke'}${free ? ' free' : ''}${maxed ? ' maxed' : ''}"
              data-tap="nestlvl:${i}">
        ${maxed ? 'FULLY UPGRADED'
          : free ? 'FREE \u2014 first one\u2019s on us'
          : `${coinSVG(19, true)}${fmt(cost)}`}
      </button>
      <!-- Boost button: mash it to pour seconds into this nest's boost phase
           (protoTapBoostSeconds each, capped at protoTapBoostCap). The live
           readout is patched by renderNestEggBar every frame, so only the
           on/off state may ride in this card's rebuild signature. -->
      <button class="ncbuy boost${n.tapBoost > 0 ? ' on' : ''}" data-tap="tapboost:${i}">
        \u26A1 Boost <b class="nctapsec">${(n.tapBoost || 0).toFixed(1)}</b>\u2009/\u2009${C.protoTapBoostCap}s
      </button>
      ${floor > 1 ? `<div class="ncfloor">Eggs now hatch at tier ${floor} \u2014 the floor has risen</div>` : ''}
    </div>`;
  el.classList.add('open');

  // Anchor under the nest it belongs to, clamped inside the viewport.
  const host = document.querySelectorAll('#nests .nest')[i];
  if (host){
    const r = host.getBoundingClientRect();
    const w = 232;
    const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    el.style.left = left + 'px';
    // +18, not +10: the level chip hangs 9px below the nest, and at +10 the
    // card's pointer landed on top of it.
    el.style.top  = (r.bottom + 18) + 'px';
    el.style.setProperty('--arrow', (r.left + r.width / 2 - left) + 'px');
  }
}

function buyNestLevel(i){
  const n = S.nests[i];
  if (!n || i >= S.nestsOwned) return;
  const lvl = n.lvl || 0;
  if (lvl >= C.protoNestLevelMax){ note('That nest is fully upgraded.'); return; }
  // The FIRST upgrade anyone buys is free. It is the whole point of the tier-3
  // tutorial: the lesson is "nests can be upgraded", and a lesson that also
  // costs 2,000 coins is a lesson a new player declines.
  const free = S.freeNestUpgrade;
  const cost = free ? 0 : NestLevelCost(C, lvl, i);
  if (!free && S.coins < cost){
    shakeSel(`[data-tap="nestlvl:${i}"]`);
    note(`Need ${fmt(cost)} coins.`);
    return;
  }
  const starsBefore = NestStars(C, lvl);
  if (free) S.freeNestUpgrade = false; else { S.coins -= cost; S.stats.coinsSpent += cost; }
  n.lvl = lvl + 1;
  S.stats.nestLevels++;
  play('bought');
  purchaseFx(`[data-tap="nestlvl:${i}"]`, 'coins', 5);

  // Filling a star tier pays a free egg. This is what makes the bar worth
  // watching instead of being a number going up — the reward arrives ON the
  // board, where it is the thing you were going to play with anyway.
  const starsNow = NestStars(C, n.lvl);
  if (starsNow > starsBefore){
    const prize = StarReward(C, starsNow - 1);
    S.stats.stars++;
    celebrate();
    // Two rewards, deliberately of different kinds. The free egg is a prize you
    // carry away and play with later; the boost is something you can WATCH happen,
    // right now, on the exact nest you just spent coins on. A star that only
    // produced an egg made the nest itself feel incidental to its own upgrade.
    n.boost = C.protoStarBoostSeconds;
    play('boostSpeed');
    toast(`\u2605 Star ${starsNow} \u2014 free ${prize} egg + ${C.protoStarBoostSeconds}s ` +
          `${C.protoSpeedBoostMult}\u00d7 on this nest!`, 'start');
    grantEgg(prize);
  } else {
    toast(`Nest ${i + 1} → ${(specialChanceFor(n) * 100).toFixed(1)}% special eggs`, 'start');
  }
  // The tutorial is over the moment it has been acted on.
  S.nestTutorial = false; S.nestTutorialStage = null;
  markDirty('nest'); markDirty('popup');
}

function buyUpgrade(id){
  const u = UPGRADES.find(x => x.id === id);
  if (!u) return;
  const lv = S.upg[id];
  if (lv >= u.max) return;
  const cost = UpgradeCost(u, lv);
  const cur = UpgradeCur(u, lv);          // a line can switch currency partway
  const purse = cur === 'gems' ? S.gems : S.coins;
  if (purse < cost){
    shakeSel(u.inline ? '.buytile' : `[data-up="${id}"]`);
    if (u.inline) note(`Need ${fmt(cost)} ${cur}.`);
    return;
  }
  if (cur === 'gems') S.gems -= cost; else { S.coins -= cost; S.stats.coinsSpent += cost; }
  play('bought');
  purchaseFx(u.inline ? '.cell.buytile' : `[data-up="${id}"]`, cur, 5);
  S.upg[id] = lv + 1;
  S.stats.shopBuys++;
  if (id === 'board'){
    S.stats.cellsBought++;
    // grow the board in place, keeping everything already on it
    while (S.grid.length < gridCells()) S.grid.push(null);
    queueFx(gridCells() - 1, 'hatched');   // the new square pops into existence
    // The tile you just bought completed a ROW, so the crate drawn on the end of
    // it is now yours. Paying out here rather than on a timer or a claim button is
    // the point: the reward arrives on the same tap that earned it, which is what
    // makes the marker on the end of the next row believable.
    if (CrateAtBoardLevel(S.upg.board)) grantCrate();
    markDirty('grid');
  }
  toast(`${u.name} → level ${S.upg[id]}`, 'start');
  markDirty('shop'); markDirty('nest');
}

const DAY_MS = 24 * 3600 * 1000;
const dailyCoinReady = () => Date.now() - S.daily.coinAt >= DAY_MS;
const dailyGemReady  = () => Date.now() - S.daily.gemAt  >= DAY_MS;
const dailyReady     = () => (dailyCoinReady() ? 1 : 0) + (dailyGemReady() ? 1 : 0);

function claimDailyCoins(){
  if (!dailyCoinReady()) return;
  const amt = DailyCoins(C, S.maxTier);
  S.coins += amt; S.daily.coinAt = Date.now();
  coinSplash(amt, null);
  play('coin');
  toast(`Free daily — +${fmt(amt)} coins`, 'start');
  markDirty('shop');
  // the tier-5 claim is the first interstitial the player ever sees
  maybeInterstitial('daily');
}

function claimDailyGems(){
  if (!dailyGemReady()) return;
  openVideo('dailygems');
}

function grantDailyGems(){
  const amt = DailyGems(C, S.maxTier, S.daily.streak);
  S.gems += amt;
  S.daily.streak++; S.daily.gemAt = Date.now();
  S.stats.dailyGemClaims++;
  flyTo('#gems', $('#shopBody')?.getBoundingClientRect(), gemSVG(16), 8, 'g');
  toast(`+${fmt(amt)} gems`, 'start');
  markDirty('shop');
}

function buyBoostPack(kind, qty){
  // Priced off boosters of THIS KIND you have bought, and nothing else. Buying
  // speed boosters must not move the price of merge boosters, and neither of them
  // may move because you climbed a tier or bought a coop tile.
  const cost = BoostPackCost(C, S.stats.boostBuy[kind] || 0, qty);
  if (S.gems < cost){ note(`Need ${fmt(cost)} gems.`); return; }
  S.gems -= cost;
  S.stock[kind] += qty;
  S.stats.boostBuy[kind] = (S.stats.boostBuy[kind] || 0) + qty;
  play('bought');
  purchaseFx(`[data-tap="pack:${kind}.${qty}"]`, 'gems', 4);
  toast(`+${qty} ${kind === 'speed' ? 'Speed' : 'Auto-merge'} boosts`, 'start');
  markDirty('shop');
}

/** Fake purchase. Nothing is charged; this exists so the flow and the copy can
 *  be judged before real billing goes in. */
function confirmOffer(id){
  const o = OFFERS.find(x => x.id === id);
  if (!o) return;
  // A rewarded-video card is not a purchase and must never open the buy confirm.
  if (o.rv){ if (o.id === 'piggy') smashPiggy(); return; }
  S.confirm = o; markDirty('confirm');
}

function applyOffer(o){
  const gr = o.grant || {};
  if (gr.gems)     { S.gems += gr.gems; }
  if (gr.coins)    { S.coins += gr.coins; }
  if (gr.freeEggs) { S.freeEggs += gr.freeEggs; }
  if (gr.boosts)   { S.stock.speed += gr.boosts; S.stock.merge += gr.boosts; }
  if (gr.noAds)    { S.owned.noads = true; S.flashUntil = 0; S.flashPopup = false; }
  if (gr.piggy)    { S.gems += Math.floor(S.piggy); S.piggy = 0; }
  if (!o.repeat) S.owned[o.id] = true;
  play('purchase');
  celebrate();
  S.confirm = null;
  toast(`${o.name} — thanks!`, 'start');
  markDirty('confirm'); markDirty('shop');
}

// ───────────────────────────── boosts ─────────────────────────────

/** How long a booster runs, once the Longer boosts line is factored in. Used
 *  by grantBoost AND by the countdown bar — if the bar divided by the base 30
 *  it would sit pinned at 100% for the first half of an upgraded boost. */
const boostSeconds = () => C.protoBoostSeconds + boostAdd(S.upg.boostlen);

function grantBoost(kind){
  // Two booster types now share the bottom bar, so they get distinct cues — one
  // shared sound means you cannot tell by ear which consumable you just spent.
  play(kind === 'merge' ? 'boostMerge' : 'boostSpeed');
  S.boost[kind] = boostSeconds();
  S.stats.boosts++;
  if (kind === 'speed') markDirty('grid');
  if (kind === 'merge') S.mergeTick = 0;
  toast(`${kind === 'speed' ? '⚡ Speed' : '⟳ Auto-merge'} boost — ${Math.round(boostSeconds())}s`, 'start');
}

function openShop(){
  play('open');
  markDirty('shop');
  $('#shop2').classList.add('open');
}

const boostUnlockTier = kind =>
  kind === 'speed' ? C.protoSpeedUnlockTier : C.protoMergeUnlockTier;
const boostUnlocked = kind => S.maxTier >= boostUnlockTier(kind);

/** Boosters are stock you hold, not something you buy in the moment. Running
 *  out is meant to be felt — that is what sends you to the shop. */
function tryBoost(kind){
  if (S.boost[kind] > 0) return;                       // already running
  const sel = kind === 'speed' ? '#boostSpeed' : '#boostMerge';
  if (!boostUnlocked(kind)){ shakeSel(sel); return; }
  if (S.stock[kind] <= 0){
    shakeSel(sel);
    note(`Out of ${kind === 'speed' ? 'Speed' : 'Auto-merge'} boosts — buy more in the shop`);
    // tapping an empty booster IS the intent to restock; make the trip for them
    if (S.maxTier >= C.protoShopUnlockTier) openShop();
    return;
  }
  S.stock[kind]--;
  grantBoost(kind);
}

// ─────────────────────── rewarded video (dummy) ───────────────────────

function openVideo(kind, payload = null){
  S.rv = { kind, payload, startedAt: performance.now() };
  markDirty('rv');
}

function tickVideo(){
  if (!S.rv) return;
  const p = (performance.now() - S.rv.startedAt) / (C.protoRewardedVideoSeconds * 1000);
  const bar = document.querySelector('#rvbar i');
  if (bar) bar.style.width = (Math.min(1, p) * 100).toFixed(1) + '%';
  const cd = document.querySelector('#rvcount');
  if (cd) cd.textContent = Math.max(0, Math.ceil(C.protoRewardedVideoSeconds * (1 - p))) + 's';
  if (p >= 1){
    const { kind, payload } = S.rv;
    S.rv = null;
    S.stats.videos++;
    if (kind === 'double'){
      S.coins += payload;
      coinSplash(payload, null);
      toast(`Doubled — +${fmt(payload)}`, 'start');
    } else if (kind === 'dailygems'){
      grantDailyGems();
    } else if (kind === 'piggy'){
      grantPiggy();
    } else grantBoost(kind);
    markDirty('rv');
  }
}

function skipVideo(){
  if (!S.rv) return;
  // Skipping early forfeits the reward, same as a real rewarded placement.
  S.rv = null;
  note('Video skipped — no boost.');
  markDirty('rv');
}

// ───────────────────────────── rendering ─────────────────────────────

const $ = s => document.querySelector(s);
const clamp01 = v => (Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : 0);
let dirty = { grid: true, nest: true, coll: true, popup: true, rv: true,
              shop: true, inter: true, confirm: true, tasks: true, drop: true };
const markDirty = k => { dirty[k] = true; };
/* Node caches, refreshed by the two functions that can invalidate them. Sweeping
 * the document with querySelectorAll on every frame was measurable at four nests
 * and a twenty-cell board, and it bought nothing: the set of egg tiles and nest
 * tiles only changes when the board or the coop is rebuilt. */
let eggEls = [], nestEls = [], slimeEls = [];

function render(){
  // NEVER rebuild the board under a finger. This is the drag lag, and it was not
  // the pointer handler: markDirty('grid') replaces the whole board's innerHTML,
  // crackSegment fires markDirty('grid') on every auto-crack, and at four nests
  // that is several full board rebuilds a second. Each one destroys the tile the
  // gesture started on, forces a synchronous layout of every cell, and re-parses
  // twenty inline SVGs — while the ghost is trying to follow the pointer at 60fps.
  // The rebuild is simply deferred; the dirty flag stays set and the board catches
  // up the moment the piece is dropped.
  if (dirty.grid && !drag)  { renderGrid();   dirty.grid  = false; }
  if (dirty.nest && !drag)  { renderNests();  dirty.nest  = false; }
  flushBounce();       // after the redraw, or the class is wiped a frame later
  renderColl();      // self-gating on the top-hen tier, so the avatar stays live
  onboardTick();     // first-time hand pointer; self-hides once each step is done
  if (dirty.popup) { renderPopup();  dirty.popup = false; }
  renderMut();         // self-gating: builds once, then only toggles .open
  renderCrateIntro();  // ditto, for a player's first crate
  renderNestCard();    // self-gating on a signature, same as the shop sheet
  renderCrateCard();   // ditto
  renderSlimeCard();   // ditto
  renderRowPrizeCard();// ditto
  renderDrop();        // the two HUD dropdowns share one host
  if (dirty.rv)    { renderVideo();  dirty.rv    = false; }
  // every frame while one is open: the spot runs its own countdown and closes
  // itself, which a dirty-flag gate would freeze
  if (dirty.inter || S.inter){ renderInterstitial(); dirty.inter = false; }
  if (dirty.confirm) { renderConfirm();      dirty.confirm = false; }
  renderFlash();   // every frame: it owns two live countdowns
  fitIfNeeded();       // self-gating: only writes when a row count changed
  renderSoundState();
  renderSaveState();
  renderShopSheet();   // self-gating: only rebuilds when something changed
  renderUpgradesSheet();
  renderPiggyLive();   // the one number on the sheet that moves on its own
  renderNestEggBar();  // ditto, for the nest card's green egg bar
  tickNestHint();
  tickBonusLabels();
  renderHud();
  renderShop();
  renderProgress();
  renderTutorial();
}

  $('#gems').textContent    = fmt(S.gems);

  if (sgi && !sgi.dataset.done){ sgi.innerHTML = gemSVG(16); sgi.dataset.done = '1'; }
  const sci = $('#shopCoinIcon');
  if (sci && !sci.dataset.done){ sci.innerHTML = coinSVG(16); sci.dataset.done = '1'; }
  const tb = $('#tasksBtn');
  if (tb) tb.style.display = tasksUnlocked() ? '' : 'none';
  const tp = $('#tasksPip');
  if (tp){
    const nready = tasksReady();
    tp.textContent = nready;
    tp.style.display = nready ? '' : 'none';
  }
  const sc = $('#shopCoins'); if (sc) sc.textContent = fmt(S.coins);
  const sg = $('#shopGems');  if (sg) sg.textContent = fmt(S.gems);
  const ugi = $('#upgGemIco');
  if (ugi && !ugi.dataset.done){ ugi.innerHTML = gemSVG(16); ugi.dataset.done = '1'; }
  const uci = $('#upgCoinIco');
  if (uci && !uci.dataset.done){ uci.innerHTML = coinSVG(16); uci.dataset.done = '1'; }
  const uc = $('#upgCoins'); if (uc) uc.textContent = fmt(S.coins);
  const ug = $('#upgGems');  if (ug) ug.textContent = fmt(S.gems);
  // the pill counts DOWN to the next bird, not up from the current one
  const dl = $('#dbgline');
  dl.style.display = S.debug ? '' : 'none';
  if (S.debug){
    const st = S.stats;
    dl.textContent =
      `played ${hms(S.realElapsed)} · day ${modelDay().toFixed(1)} · ` +
      `floor ${HatchFloor(C, S.maxTier)} · window ${S.maxTier - HatchFloor(C, S.maxTier) + 1}/${gridCells()} · ` +
      `hatched ${st.hatched} · taps ${st.taps} · merged ${st.merged} · ` +
      `slv ${st.silver} · gld ${st.gold} · gems ${fmt(st.gemsEarned)} · lvls ${st.nestLevels}`;
